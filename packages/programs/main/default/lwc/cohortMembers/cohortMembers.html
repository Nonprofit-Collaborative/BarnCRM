<template>
    <template lwc:if={helpReady}>
  <lightning-card title={labels.title} icon-name="custom:custom50">
    <div class="slds-var-p-horizontal_medium slds-is-relative">
      <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <c-barn-notice variant="error" message={errorMessage} data-id="error-message" class="slds-show slds-var-m-bottom_small"></c-barn-notice>
      </template>

      <div role="status" data-id="result" class="slds-var-m-bottom_small">{resultMessage}</div>

      <template lwc:if={hasFailures}>
        <c-barn-notice variant="warning" title={labels.notAdded} data-id="failures" class="slds-show slds-var-m-bottom_small">
          <ul class="slds-list_dotted">
            <template for:each={failures} for:item="failure">
              <li key={failure.key} data-id="failure">{failure.personName}: {failure.message}</li>
            </template>
          </ul>
        </c-barn-notice>
      </template>

      <template lwc:if={loaded}>
        <p data-id="member-count" class="slds-text-title_bold slds-var-m-bottom_x-small">{memberCount}</p>
        <p class="slds-assistive-text" id="drag-help">{dragHelp}</p>
        <p class="slds-assistive-text" role="status" aria-live="polite" data-id="drag-live">{announcement}</p>
        <div class={membersZoneClass} data-drop-zone="members" data-drop-label={labels.title} data-id="members-zone">
        <template lwc:if={hasMembers}>
          <ul class="slds-has-dividers_bottom-space">
            <template for:each={members} for:item="member">
              <li key={member.key} class="slds-item" data-id="member">
                <div class="slds-grid slds-grid_vertical-align-center">
                  <div class="slds-col slds-grow slds-shrink">
                    <p class="slds-text-heading_small">{member.personName}</p>
                    <p class="slds-text-body_small slds-text-color_weak">{member.stage}</p>
                  </div>
                  <template lwc:if={canEdit}>
                    <div class="slds-col slds-grow-none slds-shrink-none slds-var-p-left_small">
                      <lightning-button
                        data-id="remove"
                        data-enrollment={member.enrollmentId}
                        label={labels.remove}
                        title={member.removeLabel}
                        onclick={handleRemove}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </li>
            </template>
          </ul>
        </template>
        <template lwc:else>
          <c-barn-empty-state illustration="no-data" heading={labels.membersEmpty} data-id="members-empty"></c-barn-empty-state>
        </template>
        </div>
        <template lwc:if={moreThanShown}>
          <p data-id="more" class="slds-text-body_small slds-text-color_weak">{labels.moreThanShown}</p>
        </template>

        <template lwc:if={canEdit}>
          <section class="slds-var-m-top_medium" aria-label={labels.addPeople} data-id="add-people">
            <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addPeople}</h3>

            <div class="slds-grid slds-grid_vertical-align-center slds-var-m-bottom_x-small">
              <p class="slds-col slds-text-title_bold">{labels.candidates}</p>
              <template lwc:if={hasCandidates}>
                <lightning-button
                  data-id="select-all"
                  class="slds-col slds-grow-none"
                  variant="base"
                  label={labels.selectAll}
                  onclick={handleSelectAll}
                ></lightning-button>
              </template>
            </div>
            <template lwc:if={hasCandidates}>
              <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_x-small" data-id="drag-hint">{labels.dragHint}</p>
              <ul data-drop-zone="candidates" data-drop-label={labels.candidates} data-id="candidates-zone">
                <template for:each={candidates} for:item="candidate">
                  <li key={candidate.key} data-id="candidate" class="slds-grid slds-grid_vertical-align-center">
                    <span
                      class="drag-handle slds-var-m-right_x-small"
                      role="button"
                      tabindex="0"
                      title={dragHelp}
                      aria-label={candidate.personName}
                      aria-describedby="drag-help"
                      data-drag-id={candidate.enrollmentId}
                      data-drag-label={candidate.personName}
                      data-id="drag"
                      onpointerdown={handlePointerDown}
                      onkeydown={handleDragKey}
                    >
                      <lightning-icon icon-name="utility:drag_and_drop" size="x-small"></lightning-icon>
                    </span>
                    <lightning-input
                      data-id="tick"
                      data-enrollment={candidate.enrollmentId}
                      type="checkbox"
                      label={candidate.personName}
                      title={candidate.tickLabel}
                      checked={candidate.checked}
                      onchange={handleTick}
                    ></lightning-input>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else>
              <c-barn-empty-state size="compact" heading={labels.noCandidates} data-id="no-candidates"></c-barn-empty-state>
            </template>

            <template lwc:if={canEnroll}>
              <p class="slds-text-title_bold slds-var-m-top_medium slds-var-m-bottom_x-small">{labels.someoneElse}</p>
              <div class="slds-grid slds-wrap slds-grid_vertical-align-end slds-gutters_x-small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                  <lightning-record-picker
                    data-id="person-picker"
                    label={labels.person}
                    object-api-name={personObjectApiName}
                    filter={personFilter}
                    onchange={handlePersonChange}
                  ></lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                  <lightning-button
                    data-id="add-to-list"
                    label={labels.addToList}
                    disabled={addToListDisabled}
                    onclick={handleAddToList}
                  ></lightning-button>
                </div>
              </div>
              <template lwc:if={hasPicked}>
                <div class="slds-var-m-top_x-small" data-id="picked-list">
                  <template for:each={pickedPeople} for:item="person">
                    <lightning-pill
                      key={person.id}
                      data-id="picked"
                      data-person={person.id}
                      label={person.name}
                      title={person.takeOffLabel}
                      onremove={handleTakeOff}
                    ></lightning-pill>
                  </template>
                </div>
              </template>
            </template>

            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-end slds-var-m-vertical_small">
              <p data-id="chosen" class="slds-col slds-text-body_small" aria-live="polite">{chosenMessage}</p>
              <lightning-button
                data-id="add"
                class="slds-col slds-grow-none"
                variant="brand"
                label={labels.addToCohort}
                disabled={addDisabled}
                onclick={handleAdd}
              ></lightning-button>
            </div>
          </section>
        </template>
      </template>
    </div>
  </lightning-card>
    </template>
</template>
