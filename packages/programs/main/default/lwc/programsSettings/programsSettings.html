<template>
  <template lwc:if={helpReady}>
    <!-- The App Page prints the name above this component, so the shell's title is for screen readers only. -->
    <c-barn-page-shell
      title={labels.title}
      purpose={labels.intro}
      icon-name={icons.settings}
      data-id="shell"
    >
      <div class="slds-is-relative">
        <template lwc:if={loading}>
          <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
        </template>

        <template lwc:if={errorMessage}>
          <c-barn-notice variant="error" message={errorMessage} class="slds-show slds-var-m-bottom_small" data-id="error"></c-barn-notice>
        </template>

        <template lwc:if={savedMessage}>
          <c-barn-notice variant="success" message={savedMessage} class="slds-show slds-var-m-bottom_small" data-id="saved"></c-barn-notice>
        </template>

        <template lwc:if={noAccess}>
          <c-barn-notice message={labels.noAccess} class="slds-show slds-var-m-bottom_small" data-id="no-access"></c-barn-notice>
        </template>

        <template lwc:if={canManage}>
          <section class="slds-var-m-bottom_medium" aria-labelledby="programs-privacy" data-id="privacy">
            <h2 class="slds-text-heading_medium slds-var-m-bottom_x-small" id="programs-privacy">{labels.privacyTitle}</h2>
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">{labels.privacyIntro}</p>
            <lightning-radio-group
              name="participantPrivacy"
              label={labels.privacyLegend}
              options={privacyOptions}
              value={chosenPrivacy}
              disabled={saving}
              onchange={handlePrivacyChange}
              data-id="privacy-choice"
            ></lightning-radio-group>
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small" data-id="privacy-default">
              {labels.privacyDefault}
            </p>
          </section>

          <section aria-labelledby="programs-picklists" data-id="picklists">
            <h2 class="slds-text-heading_medium slds-var-m-bottom_x-small" id="programs-picklists">{labels.picklistsTitle}</h2>
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">{labels.picklistsIntro}</p>
            <ul class="slds-has-dividers_bottom-space">
              <template for:each={picklists} for:item="picklist">
                <li key={picklist.key} class="slds-item" data-id="picklist">
                  <div class="slds-grid slds-wrap slds-gutters_x-small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-4">
                      <h3 class="slds-text-heading_small">{picklist.label}</h3>
                      <p class="slds-text-body_regular" data-id="choices">{picklist.choices}</p>
                      <p class="slds-text-body_small slds-text-color_weak" data-id="default">{picklist.defaultText}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-text-align_right">
                      <a href={picklist.setupUrl} target="_blank" aria-label={picklist.linkLabel} data-id="setup-link"
                        >{labels.changeInSetup}</a
                      >
                    </div>
                  </div>
                </li>
              </template>
            </ul>
          </section>

          <c-barn-save-bar
            dirty-count={dirtyCount}
            saving={saving}
            onsave={handleSavePrivacy}
            ondiscard={handleDiscard}
            data-id="save-bar"
          ></c-barn-save-bar>
        </template>
      </div>
    </c-barn-page-shell>
  </template>
</template>
