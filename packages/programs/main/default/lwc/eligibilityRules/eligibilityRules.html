<template>
  <lightning-card title={labels.title} icon-name="standard:task2">
    <div class="slds-var-p-horizontal_medium slds-is-relative">
      <template lwc:if={showSpinner}>
        <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
      </template>

      <p class="slds-text-body_regular slds-var-m-bottom_small" data-id="intro">{labels.intro}</p>

      <template lwc:if={errorMessage}>
        <p role="alert" data-id="error-message" class="slds-text-color_error slds-var-m-bottom_small">{errorMessage}</p>
      </template>

      <template lwc:if={hasProblems}>
        <ul role="alert" data-id="problems" class="slds-text-color_error slds-var-m-bottom_small">
          <template for:each={problemItems} for:item="problem">
            <li key={problem.key} data-id="problem">{problem.text}</li>
          </template>
        </ul>
      </template>

      <template lwc:if={readOnly}>
        <p class="slds-text-body_small slds-text-color_weak" data-id="read-only">{labels.readOnly}</p>
      </template>

      <template lwc:if={noRules}>
        <p class="slds-text-body_regular" data-id="no-rules">{labels.noRules}</p>
      </template>

      <template for:each={ruleViews} for:item="rule">
        <div key={rule.key} class="slds-box slds-var-m-bottom_small" data-id="rule">
          <div class="slds-grid slds-grid_vertical-align-center slds-var-m-bottom_x-small">
            <h3 class="slds-text-heading_small slds-col slds-grow" data-id="rule-title">{rule.title}</h3>
            <template lwc:if={canEdit}>
              <lightning-button-icon
                icon-name="utility:arrowup"
                alternative-text={labels.moveUp}
                title={labels.moveUp}
                data-id="move-up"
                data-rule={rule.index}
                data-step="-1"
                disabled={rule.moveUpDisabled}
                onclick={handleMove}
                class="slds-var-m-right_xx-small"
              ></lightning-button-icon>
              <lightning-button-icon
                icon-name="utility:arrowdown"
                alternative-text={labels.moveDown}
                title={labels.moveDown}
                data-id="move-down"
                data-rule={rule.index}
                data-step="1"
                disabled={rule.moveDownDisabled}
                onclick={handleMove}
                class="slds-var-m-right_xx-small"
              ></lightning-button-icon>
              <lightning-button
                label={labels.removeRule}
                data-id="remove-rule"
                data-rule={rule.index}
                onclick={handleRemoveRule}
              ></lightning-button>
            </template>
          </div>
          <p class="slds-text-title_caps slds-var-m-bottom_xx-small">{labels.whenAll}</p>
          <template for:each={rule.conditions} for:item="condition">
            <div key={condition.key} class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end" data-id="condition">
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-combobox
                  label={labels.field}
                  value={condition.field}
                  options={fieldOptions}
                  data-id="field"
                  data-rule={rule.index}
                  data-condition={condition.index}
                  disabled={readOnly}
                  onchange={handleFieldChange}
                ></lightning-combobox>
              </div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-combobox
                  label={labels.operator}
                  value={condition.operator}
                  options={operatorOptions}
                  data-id="operator"
                  data-rule={rule.index}
                  data-condition={condition.index}
                  disabled={readOnly}
                  onchange={handleOperatorChange}
                ></lightning-combobox>
              </div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <template lwc:if={condition.showValue}>
                  <lightning-input
                    label={condition.valueLabel}
                    value={condition.value}
                    data-id="value"
                    data-rule={rule.index}
                    data-condition={condition.index}
                    disabled={readOnly}
                    onchange={handleValueChange}
                  ></lightning-input>
                </template>
              </div>
              <template lwc:if={canEdit}>
                <template lwc:if={condition.canRemove}>
                  <div class="slds-col slds-size_1-of-1">
                    <lightning-button
                      variant="base"
                      label={labels.removeCondition}
                      data-id="remove-condition"
                      data-rule={rule.index}
                      data-condition={condition.index}
                      onclick={handleRemoveCondition}
                    ></lightning-button>
                  </div>
                </template>
              </template>
            </div>
          </template>
          <template lwc:if={canEdit}>
            <lightning-button
              variant="base"
              label={labels.addCondition}
              data-id="add-condition"
              data-rule={rule.index}
              onclick={handleAddCondition}
              class="slds-var-m-top_xx-small"
            ></lightning-button>
          </template>
          <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-top_small">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
              <lightning-combobox
                label={labels.result}
                value={rule.result}
                options={resultOptions}
                data-id="rule-result"
                data-rule={rule.index}
                disabled={readOnly}
                onchange={handleResultChange}
              ></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <lightning-input
                label={labels.reason}
                value={rule.reason}
                maxlength="255"
                data-id="reason"
                data-rule={rule.index}
                disabled={readOnly}
                onchange={handleReasonChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
              <lightning-combobox
                label={labels.basis}
                value={rule.basis}
                options={basisOptions}
                data-id="basis"
                data-rule={rule.index}
                disabled={readOnly}
                onchange={handleBasisChange}
              ></lightning-combobox>
            </div>
          </div>
        </div>
      </template>

      <template lwc:if={canEdit}>
        <lightning-button label={labels.addRule} data-id="add-rule" onclick={handleAddRule} disabled={controlsDisabled}></lightning-button>
      </template>

      <template lwc:if={loaded}>
        <div class="slds-var-m-top_medium">
          <h3 class="slds-text-heading_small">{labels.defaultTitle}</h3>
          <div class="slds-grid slds-wrap slds-gutters_x-small">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
              <lightning-combobox
                label={labels.defaultResult}
                value={defaultResult}
                options={resultOptions}
                data-id="default-result"
                disabled={readOnly}
                onchange={handleDefaultResultChange}
              ></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
              <lightning-input
                label={labels.defaultReason}
                value={defaultReason}
                maxlength="255"
                data-id="default-reason"
                disabled={readOnly}
                onchange={handleDefaultReasonChange}
              ></lightning-input>
            </div>
          </div>
        </div>

        <template lwc:if={canEdit}>
          <div class="slds-grid slds-grid_align-end slds-var-m-vertical_small">
            <template lwc:if={dirty}>
              <span class="slds-text-color_weak slds-var-m-right_small slds-align-middle" data-id="unsaved">{labels.unsaved}</span>
            </template>
            <lightning-button variant="brand" label={labels.save} data-id="save" disabled={saveDisabled} onclick={handleSave}></lightning-button>
          </div>
        </template>

        <div class="slds-var-m-top_medium">
          <h3 class="slds-text-heading_small">{labels.previewTitle}</h3>
          <template lwc:if={noPeople}>
            <p class="slds-text-body_regular" data-id="no-people">{labels.noPeople}</p>
          </template>
          <template lwc:if={hasPeople}>
            <lightning-combobox
              label={labels.previewPerson}
              value={personId}
              options={peopleOptions}
              data-id="person"
              disabled={controlsDisabled}
              onchange={handlePersonChange}
            ></lightning-combobox>
            <p class="slds-text-body_regular slds-var-m-vertical_x-small" data-id="preview" role="status">{previewText}</p>
          </template>
          <template lwc:if={moreThanShown}>
            <p class="slds-text-body_small slds-text-color_weak" data-id="more">{labels.moreThanShown}</p>
          </template>
          <template lwc:if={canScreen}>
            <lightning-input
              type="checkbox"
              label={labels.includeDecided}
              checked={includeDecided}
              data-id="include-decided"
              onchange={handleIncludeDecided}
            ></lightning-input>
            <div class="slds-var-m-top_x-small">
              <lightning-button
                label={labels.applyOne}
                data-id="apply-one"
                disabled={applyOneDisabled}
                onclick={handleApplyOne}
                class="slds-var-m-right_x-small"
              ></lightning-button>
              <lightning-button
                variant="brand"
                label={labels.screenAll}
                data-id="screen-all"
                disabled={screenDisabled}
                onclick={handleScreenAll}
              ></lightning-button>
            </div>
          </template>
        </div>

        <div role="status" data-id="result" class="slds-var-m-vertical_small">{resultMessage}</div>
      </template>
    </div>
  </lightning-card>
</template>
