<template>
  <template lwc:if={helpReady}>
    <!-- The Programs app's home (vis-modules-19). -->
    <c-barn-page-shell title={labels.title} purpose={labels.intro} icon-name={icons.dashboard} data-id="shell">
      <div slot="actions">
        <lightning-combobox
          name="period"
          label={labels.period}
          options={periodOptions}
          value={period}
          onchange={handlePeriodChange}
          data-id="period"
        ></lightning-combobox>
      </div>

      <div class="slds-is-relative">
        <template lwc:if={loading}>
          <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
        </template>

        <template lwc:if={errorMessage}>
          <c-barn-notice variant="error" message={errorMessage} class="slds-show slds-var-m-bottom_small" data-id="error"></c-barn-notice>
        </template>

        <template lwc:if={noAccess}>
          <c-barn-notice message={labels.noAccess} class="slds-show slds-var-m-bottom_small" data-id="no-access"></c-barn-notice>
        </template>

        <template lwc:if={canSee}>
          <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-bottom_medium">
            <template for:each={tiles} for:item="tile">
              <div key={tile.key} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
                <c-barn-stat-tile
                  label={tile.label}
                  value={tile.value}
                  format-style={tile.formatStyle}
                  bordered
                  align="start"
                  data-id="tile"
                  data-key={tile.key}
                ></c-barn-stat-tile>
              </div>
            </template>
          </div>
        </template>

        <c-barn-tool-grid groups={toolGroups} data-id="tools"></c-barn-tool-grid>

        <template lwc:if={canSee}>
          <section class="slds-var-m-top_medium" aria-labelledby="programs-by-program">
            <h2 class="slds-text-heading_medium slds-var-m-bottom_small" id="programs-by-program">{labels.byProgram}</h2>
            <template lwc:if={noRows}>
              <c-barn-empty-state illustration="no-data" heading={labels.noPrograms} data-id="no-programs"></c-barn-empty-state>
            </template>
            <template lwc:else>
              <table
                class="slds-table slds-table_cell-buffer slds-table_bordered slds-max-medium-table_stacked"
                aria-label={labels.byProgram}
              >
                <thead>
                  <tr class="slds-line-height_reset">
                    <th scope="col" data-label={labels.program}>{labels.program}</th>
                    <th scope="col" class="slds-text-align_right" data-label={labels.openEnrollments}>{labels.openEnrollments}</th>
                    <th scope="col" class="slds-text-align_right" data-label={labels.newEnrollments}>{labels.newEnrollments}</th>
                    <th scope="col" class="slds-text-align_right" data-label={labels.completed}>{labels.completed}</th>
                    <th scope="col" class="slds-text-align_right" data-label={labels.peopleServed}>{labels.peopleServed}</th>
                    <th scope="col" class="slds-text-align_right" data-label={labels.peopleCounted}>{labels.peopleCounted}</th>
                    <th scope="col" class="slds-text-align_right" data-label={labels.delivered}>{labels.delivered}</th>
                    <th scope="col" data-label={labels.attendanceRate}>{labels.attendanceRate}</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={rows} for:item="row">
                    <tr key={row.key} data-id="program-row">
                      <th scope="row" data-label={labels.program}>
                        <a href={row.href} data-record-id={row.key} onclick={handleOpen} data-id="program">{row.name}</a>
                      </th>
                      <td class="slds-text-align_right" data-label={labels.openEnrollments}>
                        <lightning-formatted-number value={row.openEnrollments}></lightning-formatted-number>
                      </td>
                      <td class="slds-text-align_right" data-label={labels.newEnrollments}>
                        <lightning-formatted-number value={row.newEnrollments}></lightning-formatted-number>
                      </td>
                      <td class="slds-text-align_right" data-label={labels.completed}>
                        <lightning-formatted-number value={row.completedEnrollments}></lightning-formatted-number>
                      </td>
                      <td class="slds-text-align_right" data-label={labels.peopleServed}>
                        <lightning-formatted-number value={row.peopleServed}></lightning-formatted-number>
                      </td>
                      <td class="slds-text-align_right" data-label={labels.peopleCounted}>
                        <lightning-formatted-number value={row.peopleCounted} data-id="row-counted"></lightning-formatted-number>
                      </td>
                      <td class="slds-text-align_right" data-label={labels.delivered}>
                        <lightning-formatted-number value={row.delivered}></lightning-formatted-number>
                      </td>
                      <td data-label={labels.attendanceRate}>
                        <c-barn-meter value={row.ratePercent} value-text={row.rate} size="small" data-id="rate"></c-barn-meter>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
            <template lwc:if={moreThanShown}>
              <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_small" data-id="more">
                {labels.moreThanShown}
              </p>
            </template>
          </section>
        </template>
      </div>
    </c-barn-page-shell>
  </template>
</template>
