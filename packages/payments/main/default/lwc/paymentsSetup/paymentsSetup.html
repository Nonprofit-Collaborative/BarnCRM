<template>
    <template lwc:if={helpReady}>
    <!-- The App Page prints the name above this component, so the shell's title is for screen readers only. -->
    <c-barn-page-shell
        title={labels.title}
        purpose={labels.intro}
        icon-name={icons.page}
        data-id="shell"
    >
        <div class="slds-is-relative">
            <template lwc:if={loading}>
                <lightning-spinner alternative-text={labels.title} size="small" data-id="loading"></lightning-spinner>
            </template>
            <template lwc:if={loaded}>
                <p class="slds-var-m-bottom_medium" data-id="mode">{modeText}</p>
                <template lwc:if={scheduled}>
                    <c-barn-notice class="slds-var-m-bottom_medium" variant="info" message={labels.scheduled} data-id="scheduled"></c-barn-notice>
                </template>
                <template lwc:else>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="warning" message={labels.notScheduled} data-id="not-scheduled"></c-barn-notice>
                    <lightning-button
                        class="slds-var-m-bottom_medium"
                        label={labels.schedule}
                        disabled={locked}
                        data-id="schedule"
                        onclick={handleSchedule}
                    ></lightning-button>
                </template>
                <template lwc:if={noSiteShown}>
                    <c-barn-notice class="slds-var-m-bottom_medium" variant="warning" message={labels.noSite} data-id="no-site"></c-barn-notice>
                </template>
                <template lwc:else>
                    <p class="slds-var-m-bottom_small">{labels.addresses}</p>
                    <ul class="slds-var-m-bottom_medium" data-id="receivers">
                        <template for:each={receivers} for:item="receiver">
                            <li key={receiver.site} class="slds-var-m-bottom_small">
                                <p class="slds-text-title_bold">{receiver.site}</p>
                                <lightning-input label={labels.stripeUrl} value={receiver.stripeUrl} read-only></lightning-input>
                                <lightning-input label={labels.payPalUrl} value={receiver.payPalUrl} read-only></lightning-input>
                            </li>
                        </template>
                    </ul>
                    <lightning-button
                        class="slds-var-m-bottom_medium"
                        label={labels.regenerate}
                        disabled={locked}
                        data-id="regenerate"
                        onclick={handleRegenerate}
                    ></lightning-button>
                </template>
                <template lwc:if={noManageShown}>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="info" message={labels.noManage} data-id="no-manage"></c-barn-notice>
                </template>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={credentials} for:item="credential">
                        <div key={credential.processor} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" data-id={credential.dataId}>
                            <h2 class="slds-text-title_bold slds-var-m-bottom_x-small">{credential.processor}</h2>
                            <p class="slds-var-m-bottom_x-small" data-id={credential.statusId}>{credential.status}</p>
                            <p class="slds-var-m-bottom_small slds-text-body_small" data-id={credential.stepsId}>{credential.steps}</p>
                            <template lwc:if={credential.isPayPal}>
                                <template for:each={payPalKeys} for:item="key">
                                    <lightning-input
                                        key={key.name}
                                        autocomplete="off"
                                        label={key.label}
                                        field-level-help={key.status}
                                        placeholder={key.status}
                                        value={key.value}
                                        data-name={key.name}
                                        disabled={locked}
                                        onchange={handleType}
                                    ></lightning-input>
                                </template>
                                <lightning-button
                                    class="slds-var-m-top_small slds-var-m-right_small"
                                    label={labels.saveKeys}
                                    onclick={handleSave}
                                    disabled={locked}
                                    data-id="save"
                                ></lightning-button>
                            </template>
                            <lightning-button
                                class="slds-var-m-top_small slds-var-m-right_small"
                                variant="brand"
                                label={labels.check}
                                data-processor={credential.processor}
                                data-id={credential.checkId}
                                disabled={locked}
                                onclick={handleCheck}
                            ></lightning-button>
                            <lightning-button
                                class="slds-var-m-top_small"
                                label={labels.clear}
                                data-processor={credential.processor}
                                data-id={credential.clearId}
                                disabled={locked}
                                onclick={handleClear}
                            ></lightning-button>
                        </div>
                    </template>
                </div>
                <template lwc:if={notice}>
                    <c-barn-notice class="slds-var-m-vertical_medium" variant={notice.variant} message={notice.message} data-id="saved"></c-barn-notice>
                </template>
            </template>
            <template lwc:if={error}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="error" message={error} data-id="error"></c-barn-notice>
            </template>
        </div>
    </c-barn-page-shell>
    </template>
</template>
