<template>
  <template lwc:if={helpReady}>
    <article class="slds-card slds-card_boundary" data-id="panel">
      <template lwc:if={detail}>
        <div class="slds-card__header">
          <h2 class="slds-text-heading_small" data-id="heading">{detail.name}: {detail.subject}</h2>
          <p class="slds-text-color_weak">
            <template lwc:if={detail.requester}>{labels.requester}: {detail.requester}. </template>
            {labels.channel}: {detail.channel}
            <template lwc:if={detail.satisfaction}>. {labels.satisfaction}: {detail.satisfaction}</template>
          </p>
        </div>
        <div class="slds-card__body slds-card__body_inner">
          <template lwc:if={errorMessage}>
            <c-barn-notice variant="error" message={errorMessage} data-id="error-message" class="slds-var-m-bottom_small"></c-barn-notice>
          </template>
          <template lwc:if={notice}>
            <c-barn-notice variant="success" message={notice} data-id="notice" class="slds-var-m-bottom_small"></c-barn-notice>
          </template>
          <template lwc:if={detail.description}>
            <p class="slds-var-m-bottom_small slds-text-longform" data-id="description">{detail.description}</p>
          </template>

          <div class="slds-grid slds-wrap slds-gutters_x-small">
            <lightning-combobox class="slds-col slds-size_1-of-2" label={labels.status} options={statusOptions} value={value.status} data-field="status" onchange={handleField} data-id="status"></lightning-combobox>
            <lightning-combobox class="slds-col slds-size_1-of-2" label={labels.priority} options={priorityOptions} value={value.priority} data-field="priority" onchange={handleField} data-id="priority"></lightning-combobox>
            <lightning-record-picker class="slds-col slds-size_1-of-2" label={labels.owner} object-api-name="User" value={value.ownerId} data-field="ownerId" onchange={handleField} data-id="owner"></lightning-record-picker>
            <lightning-input class="slds-col slds-size_1-of-2" type="date" label={labels.due} value={value.dueDate} data-field="dueDate" onchange={handleField} data-id="due"></lightning-input>
            <lightning-record-picker class="slds-col slds-size_1-of-1" label={labels.project} object-api-name="Project__c" value={value.projectId} data-field="projectId" onchange={handleField} data-id="project"></lightning-record-picker>
            <lightning-textarea class="slds-col slds-size_1-of-1" label={labels.resolution} value={value.resolution} data-field="resolution" onchange={handleField} data-id="resolution"></lightning-textarea>
          </div>
          <div class="slds-var-m-vertical_small">
            <lightning-button variant="brand" label={labels.save} disabled={cannotSave} onclick={handleSave} data-id="save"></lightning-button>
            <lightning-button class="slds-var-m-left_x-small" label={labels.createTask} disabled={cannotCreateTask} onclick={handleCreateTask} data-id="create-task"></lightning-button>
            <lightning-button class="slds-var-m-left_x-small" label={labels.createChange} disabled={cannotCreateChange} onclick={handleCreateChange} data-id="create-change"></lightning-button>
          </div>
          <template lwc:if={detail.task}><p data-id="task">{labels.task}: {detail.task}</p></template>
          <template lwc:if={detail.changeRequest}><p data-id="change">{labels.changeRequest}: {detail.changeRequest}</p></template>

          <h3 class="slds-text-heading_small slds-var-m-top_medium slds-var-m-bottom_x-small">{labels.comments}</h3>
          <template lwc:if={hasComments}>
            <template for:each={comments} for:item="row">
              <div key={row.id} class={row.boxClass} data-id="comment">
                <p class="slds-text-color_weak">
                  {row.author}, <lightning-formatted-date-time value={row.created} year="numeric" month="short" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                  <span class="slds-badge slds-var-m-left_x-small" data-id="tag">{row.tag}</span>
                </p>
                <p class="slds-text-longform">{row.body}</p>
              </div>
            </template>
          </template>
          <template lwc:else><p class="slds-text-color_weak" data-id="no-comments">{labels.noComments}</p></template>
          <lightning-textarea label={labels.comment} value={comment} onchange={handleComment} data-id="comment-body"></lightning-textarea>
          <lightning-input type="checkbox" label={labels.share} checked={share} onchange={handleShare} data-id="share"></lightning-input>
          <lightning-button class="slds-var-m-top_x-small" label={labels.addComment} disabled={cannotComment} onclick={handleAddComment} data-id="add-comment"></lightning-button>
        </div>
      </template>
      <template lwc:elseif={errorMessage}>
        <c-barn-notice variant="error" message={errorMessage} data-id="error-message"></c-barn-notice>
      </template>
    </article>
  </template>
</template>
