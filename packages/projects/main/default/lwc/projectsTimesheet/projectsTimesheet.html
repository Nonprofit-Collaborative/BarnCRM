<template>
  <template lwc:if={helpReady}>
    <c-barn-page-shell title={labels.title} purpose={labels.intro} icon-name={icon} data-id="shell">
      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.title} size="small"></lightning-spinner>
      </template>
      <template lwc:if={errorMessage}>
        <c-barn-notice variant="error" message={errorMessage} data-id="error-message" class="slds-var-m-bottom_small"></c-barn-notice>
      </template>
      <template lwc:if={notice}>
        <c-barn-notice variant="success" message={notice} data-id="notice" class="slds-var-m-bottom_small"></c-barn-notice>
      </template>

      <template lwc:if={enabled}>
        <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-var-m-bottom_small" data-id="week-nav">
          <lightning-button label={labels.previous} onclick={handlePrevious} data-id="previous"></lightning-button>
          <lightning-button class="slds-var-m-horizontal_x-small" label={labels.thisWeek} onclick={handleThisWeek} data-id="this-week"></lightning-button>
          <lightning-button label={labels.next} onclick={handleNext} data-id="next"></lightning-button>
          <span class="slds-var-m-left_small slds-text-heading_small" data-id="week-label">{labels.weekOf}</span>
          <span class="slds-var-m-left_small slds-text-color_weak" data-id="status-line">{statusLine}</span>
        </div>

        <template lwc:if={hasRows}>
          <div class="slds-scrollable_x">
            <table class="slds-table slds-table_bordered slds-table_cell-buffer" data-wide-table data-id="grid">
              <thead>
                <tr>
                  <th scope="col">{labels.project}</th>
                  <template for:each={days} for:item="day">
                    <th key={day.iso} scope="col" class="slds-text-align_center">{day.name} {day.day}</th>
                  </template>
                  <th scope="col" class="slds-text-align_right">{labels.total}</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={grid.rows} for:item="row">
                  <tr key={row.key} data-id="row">
                    <th scope="row">{row.label}</th>
                    <template for:each={row.cells} for:item="cell">
                      <td key={cell.id}>
                        <lightning-input type="number" variant="label-hidden" label={row.label} step="0.25" min="0" max="24" value={cell.shown} disabled={cell.locked} title={cell.title} data-cell={cell.id} data-id="cell" onchange={handleCell}></lightning-input>
                      </td>
                    </template>
                    <td class="slds-text-align_right" data-id="row-total">{row.total}</td>
                  </tr>
                </template>
                <tr>
                  <th scope="row">{labels.total}</th>
                  <template for:each={grid.dayTotals} for:item="day">
                    <td key={day.iso} class="slds-text-align_center">{day.hours}</td>
                  </template>
                  <td class="slds-text-align_right" data-id="week-total">{grid.total}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>
        <template lwc:else><p class="slds-text-color_weak" data-id="no-rows">{labels.noRows}</p></template>

        <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-end slds-var-m-vertical_small" data-id="add-row">
          <lightning-combobox class="slds-col" label={labels.project} options={projectOptions} value={rowDraft.projectId} onchange={handleProject} data-id="row-project"></lightning-combobox>
          <lightning-combobox class="slds-col" label={labels.task} options={taskOptions} value={rowDraft.taskId} data-field="taskId" onchange={handleRowDraft}></lightning-combobox>
          <lightning-input class="slds-col" type="checkbox" label={labels.billable} checked={rowDraft.billable} data-field="billable" onchange={handleRowDraft}></lightning-input>
          <lightning-button class="slds-col" label={labels.addRow} onclick={handleAddRow} data-id="add-row-button"></lightning-button>
        </div>

        <div class="slds-var-m-bottom_medium">
          <lightning-button variant="brand" label={labels.save} disabled={cannotSave} onclick={handleSave} data-id="save"></lightning-button>
          <lightning-button class="slds-var-m-left_x-small" label={labels.submit} disabled={cannotSubmit} onclick={handleSubmit} data-id="submit"></lightning-button>
          <lightning-button class="slds-var-m-left_x-small" label={labels.recall} disabled={cannotRecall} onclick={handleRecall} data-id="recall"></lightning-button>
        </div>

        <template lwc:if={expensesEnabled}>
          <section data-id="expenses">
            <h2 class="slds-text-heading_small slds-var-m-bottom_x-small">{labels.expensesTitle}</h2>
            <template lwc:if={hasExpenses}>
              <ul class="slds-has-dividers_bottom-space">
                <template for:each={expenses} for:item="row">
                  <li key={row.id} class="slds-item" data-id="expense">
                    <a href={row.href}>{row.entryDate} {row.category}</a>
                    <span class="slds-var-m-left_x-small">{row.projectName}</span>
                    <lightning-formatted-number class="slds-var-m-left_x-small" value={row.amount} format-style="currency"></lightning-formatted-number>
                    <span class="slds-var-m-left_x-small slds-text-color_weak" title={row.rejectionReason}>{row.status}</span>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else><p class="slds-text-color_weak">{labels.noExpenses}</p></template>

            <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-end slds-var-m-top_small" data-id="expense-form">
              <lightning-combobox class="slds-col" label={labels.project} options={projectOptions} value={expense.projectId} data-field="projectId" onchange={handleExpense}></lightning-combobox>
              <lightning-input class="slds-col" type="date" label={labels.date} value={expense.date} data-field="date" onchange={handleExpense}></lightning-input>
              <lightning-combobox class="slds-col" label={labels.category} options={categoryOptions} value={expense.category} data-field="category" onchange={handleExpense}></lightning-combobox>
              <lightning-input class="slds-col" type="number" step="0.01" min="0" label={labels.amount} value={expense.amount} data-field="amount" onchange={handleExpense}></lightning-input>
              <lightning-input class="slds-col" type="checkbox" label={labels.billable} checked={expense.billable} data-field="billable" onchange={handleExpense}></lightning-input>
              <lightning-input class="slds-col" label={labels.description} max-length="255" value={expense.description} data-field="description" onchange={handleExpense}></lightning-input>
              <lightning-button class="slds-col" variant="brand" label={labels.addExpense} disabled={isWorking} onclick={handleAddExpense} data-id="add-expense"></lightning-button>
            </div>
            <template lwc:if={receiptFor}>
              <div class="slds-var-m-top_small" data-id="receipt">
                <lightning-file-upload label={labels.receipt} record-id={receiptFor} onuploadfinished={handleReceipt}></lightning-file-upload>
              </div>
            </template>
          </section>
        </template>
      </template>
      <template lwc:elseif={isLoading}></template>
      <template lwc:else>
        <p class="slds-text-color_weak" data-id="off">{labels.off}</p>
      </template>
    </c-barn-page-shell>
  </template>
</template>
