<template>
  <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name={icon} data-id="card">
      <div slot="actions">
        <lightning-input type="checkbox" label={labels.onlyMine} checked={onlyMine} onchange={handleOnlyMine} data-id="only-mine"></lightning-input>
      </div>
      <div class="slds-var-p-horizontal_medium">
        <template lwc:if={errorMessage}>
          <c-barn-notice variant="error" message={errorMessage} data-id="error-message"></c-barn-notice>
        </template>
        <template lwc:if={hasProjects}>
          <ul class="slds-has-dividers_bottom-space">
            <template for:each={projects} for:item="row">
              <li key={row.id} class="slds-item" data-id="row">
                <a href={row.href}>{row.name}</a>
                <span class={row.badgeClass}>{row.health}</span>
                <span class="slds-text-color_weak slds-var-m-left_x-small">{row.ownerName}</span>
                <p class="slds-text-color_weak">{row.reasons}</p>
              </li>
            </template>
          </ul>
        </template>
        <template lwc:else><p class="slds-text-color_weak" data-id="none">{labels.none}</p></template>
      </div>
    </lightning-card>
  </template>
</template>
