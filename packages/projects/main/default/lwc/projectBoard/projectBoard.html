<template>
  <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name={icon} data-id="card">
      <div slot="actions">
        <lightning-button-group>
          <lightning-button data-id="refresh" label={labels.refresh} disabled={isWorking} onclick={handleRefresh}></lightning-button>
          <lightning-button data-id="draft" label={labels.draft} disabled={isWorking} onclick={handleDraft}></lightning-button>
          <template lwc:if={canLogTime}>
            <lightning-button data-id="log-time" label={labels.logTime} disabled={isWorking} onclick={handleStartLog}></lightning-button>
          </template>
          <template lwc:if={expensesEnabled}>
            <lightning-button data-id="add-expense" label={labels.addExpense} disabled={isWorking} onclick={handleStartExpense}></lightning-button>
          </template>
        </lightning-button-group>
      </div>
      <div class="slds-var-p-horizontal_medium">
        <template lwc:if={errorMessage}>
          <c-barn-notice variant="error" message={errorMessage} data-id="error-message" class="slds-var-m-bottom_small"></c-barn-notice>
        </template>
        <template lwc:if={notice}>
          <c-barn-notice variant="success" message={notice} data-id="notice" class="slds-var-m-bottom_small"></c-barn-notice>
        </template>

        <div class="slds-var-m-bottom_small" data-id="health">
          <span class={healthClass}>{healthLabel}</span>
          <ul class="slds-var-m-top_x-small">
            <template for:each={reasons} for:item="reason">
              <li key={reason} class="slds-text-color_weak">{reason}</li>
            </template>
          </ul>
        </div>

        <div class="slds-var-m-bottom_small" data-id="progress">
          <p>{progressText}</p>
          <lightning-progress-bar value={progressPercent} size="medium"></lightning-progress-bar>
          <template lwc:if={timeTracking}>
            <p class="slds-var-m-top_x-small" data-id="hours">{hoursText}</p>
            <template lwc:if={hasBudgetAmount}>
              <p data-id="budget">
                <lightning-formatted-number value={project.Actual_Cost__c} format-style="currency"></lightning-formatted-number>
                /
                <lightning-formatted-number value={project.Budget_Amount__c} format-style="currency"></lightning-formatted-number>
              </p>
            </template>
          </template>
        </div>

        <template lwc:if={logging}>
          <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-end slds-var-m-bottom_small" data-id="time-form">
            <lightning-input class="slds-col" type="date" label={labels.date} value={entry.date} data-field="date" onchange={handleEntry}></lightning-input>
            <lightning-input class="slds-col" type="number" step="0.25" min="0" max="24" label={labels.hours} value={entry.hours} data-field="hours" onchange={handleEntry}></lightning-input>
            <lightning-combobox class="slds-col" label={labels.task} value={entry.taskId} options={taskOptions} data-field="taskId" onchange={handleEntry}></lightning-combobox>
            <lightning-input class="slds-col" type="checkbox" label={labels.billable} checked={entry.billable} data-field="billable" onchange={handleEntry}></lightning-input>
            <lightning-input class="slds-col" label={labels.notes} value={entry.notes} max-length="255" data-field="notes" onchange={handleEntry}></lightning-input>
            <lightning-button class="slds-col" variant="brand" label={labels.save} disabled={isWorking} onclick={handleSaveTime} data-id="save-time"></lightning-button>
            <lightning-button class="slds-col" label={labels.cancel} onclick={handleCancel}></lightning-button>
          </div>
        </template>

        <template lwc:if={spending}>
          <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-end slds-var-m-bottom_small" data-id="expense-form">
            <lightning-input class="slds-col" type="date" label={labels.date} value={expense.date} data-field="date" onchange={handleExpense}></lightning-input>
            <lightning-combobox class="slds-col" label={labels.category} value={expense.category} options={categoryOptions} data-field="category" onchange={handleExpense}></lightning-combobox>
            <lightning-input class="slds-col" type="number" step="0.01" min="0" label={labels.amount} value={expense.amount} data-field="amount" onchange={handleExpense}></lightning-input>
            <lightning-input class="slds-col" type="checkbox" label={labels.billable} checked={expense.billable} data-field="billable" onchange={handleExpense}></lightning-input>
            <lightning-input class="slds-col" label={labels.description} value={expense.description} max-length="255" data-field="description" onchange={handleExpense}></lightning-input>
            <lightning-button class="slds-col" variant="brand" label={labels.save} disabled={isWorking} onclick={handleSaveExpense} data-id="save-expense"></lightning-button>
            <lightning-button class="slds-col" label={labels.cancel} onclick={handleCancel}></lightning-button>
          </div>
        </template>

        <h2 class="slds-text-heading_small slds-var-m-vertical_x-small">{labels.timeline}</h2>
        <template for:each={groups} for:item="group">
          <section key={group.key} class="phase slds-var-m-bottom_small" data-id="phase">
            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
              <h3 class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-text-title_bold">{group.name}</h3>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-4 track">
                <template lwc:if={group.barStyle}>
                  <span class="bar" style={group.barStyle}></span>
                </template>
                <template lwc:if={todayStyle}>
                  <span class="today" style={todayStyle} title={labels.today}></span>
                </template>
              </div>
              <span class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-text-align_right">{group.done}/{group.total} ({group.percent}%)</span>
            </div>
            <template lwc:if={group.hasTasks}>
              <ul class="slds-has-dividers_bottom-space">
                <template for:each={group.tasks} for:item="task">
                  <li key={task.Id} class="slds-item slds-grid slds-wrap slds-grid_vertical-align-center" data-id="task">
                    <span class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                      <a href={task.href}>{task.Name}</a>
                      <template lwc:if={task.Milestone__c}><span class="slds-badge slds-var-m-left_x-small">{labels.milestone}</span></template>
                      <span class="slds-text-color_weak slds-var-m-left_x-small">{task.owner}</span>
                    </span>
                    <span class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                      <template lwc:if={task.late}><span class="slds-text-color_error">{task.Due_Date__c}</span></template>
                      <template lwc:else>{task.Due_Date__c}</template>
                    </span>
                    <lightning-combobox class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4" label={labels.status} variant="label-hidden" value={task.Status__c} options={task.options} data-task={task.Id} onchange={handleStatus} disabled={isWorking}></lightning-combobox>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else><p class="slds-text-color_weak">{labels.noTasks}</p></template>
            <template lwc:if={group.isAdding}>
              <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-end" data-id="task-form">
                <lightning-input class="slds-col" label={labels.taskName} max-length="80" data-field="name" onchange={handleNewTask}></lightning-input>
                <lightning-input class="slds-col" type="date" label={labels.dueDate} data-field="due" onchange={handleNewTask}></lightning-input>
                <lightning-input class="slds-col" type="checkbox" label={labels.milestone} data-field="milestone" onchange={handleNewTask}></lightning-input>
                <lightning-button class="slds-col" variant="brand" label={labels.save} disabled={isWorking} onclick={handleSaveTask} data-id="save-task"></lightning-button>
                <lightning-button class="slds-col" label={labels.cancel} onclick={handleCancel}></lightning-button>
              </div>
            </template>
            <template lwc:else>
              <lightning-button variant="base" label={labels.addTask} data-phase={group.key} onclick={handleStartAdd} data-id="add-task"></lightning-button>
            </template>
          </section>
        </template>
      </div>
    </lightning-card>
  </template>
</template>
