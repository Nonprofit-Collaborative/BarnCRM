<template>
  <template lwc:if={block.title}>
    <h3 class="slds-text-title_bold slds-var-m-bottom_x-small" data-id="title">{block.title}</h3>
  </template>
  <template lwc:if={errorMessage}>
    <c-barn-notice variant="error" message={errorMessage} data-id="error-message"></c-barn-notice>
  </template>
  <template lwc:if={isLoading}>
    <lightning-spinner size="small" alternative-text={block.title}></lightning-spinner>
  </template>

  <template lwc:if={isFields}>
    <template lwc:if={hasRecord}>
      <lightning-record-view-form record-id={recordId} object-api-name={objectApiName} data-id="fields">
        <div class="slds-grid slds-wrap">
          <template for:each={fieldNames} for:item="field">
            <div key={field.key} class={fieldCss}>
              <lightning-output-field field-name={field.name}></lightning-output-field>
            </div>
          </template>
        </div>
      </lightning-record-view-form>
    </template>
    <template lwc:else>
      <p class="slds-text-color_weak" data-id="needs-record">{noRecordText}</p>
    </template>
  </template>

  <template lwc:if={isList}>
    <template lwc:if={hasRows}>
      <lightning-datatable
        key-field="Id"
        data={rows}
        columns={columns}
        hide-checkbox-column
        data-id="list"
      ></lightning-datatable>
    </template>
    <template lwc:elseif={showNoRows}>
      <p class="slds-text-color_weak" data-id="no-rows">{noRowsText}</p>
    </template>
  </template>

  <template lwc:if={isChart}>
    <template lwc:if={chart}>
      <div class="slds-grid slds-grid_align-spread slds-var-m-bottom_x-small">
        <p class="slds-text-color_weak" data-id="chart-title">{chart.caption}</p>
        <lightning-button variant="base" label={tableToggleLabel} onclick={toggleTable} data-id="chart-toggle"></lightning-button>
      </div>
      <template lwc:if={showChart}>
        <div aria-hidden="true" data-id="chart">
          <template lwc:if={chart.legend.length}>
            <ul class="slds-list_horizontal slds-wrap slds-var-m-bottom_x-small" data-id="legend">
              <template for:each={chart.legend} for:item="entry">
                <li key={entry.key} class="slds-var-m-right_small"><span class={entry.swatch}></span>{entry.label}</li>
              </template>
            </ul>
          </template>
          <template for:each={chart.groups} for:item="group">
            <div key={group.key} class="slds-var-m-bottom_small">
              <p class="slds-text-title_bold">{group.label}</p>
              <template for:each={group.measures} for:item="measure">
                <div key={measure.key}>
                  <template lwc:if={chart.showMeasureNames}>
                    <p class="slds-text-body_small slds-text-color_weak">{measure.label}</p>
                  </template>
                  <template for:each={measure.tracks} for:item="track">
                    <div key={track.key} class="slds-grid slds-grid_vertical-align-center slds-var-m-bottom_xx-small">
                      <span class="lane slds-truncate slds-size_1-of-4">{track.label}</span>
                      <span class="track slds-col">
                        <template for:each={track.segments} for:item="segment">
                          <span key={segment.key} class={segment.css} style={segment.style}></span>
                        </template>
                      </span>
                      <span class="slds-var-p-left_x-small">{track.value}</span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
      <table class={tableCss} data-id="chart-table">
        <thead>
          <tr>
            <th scope="col"><span class="slds-assistive-text">{chart.title}</span></th>
            <template for:each={chart.table.headers} for:item="header">
              <th key={header.key} scope="col">{header.label}</th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template for:each={chart.table.rows} for:item="row">
            <tr key={row.key}>
              <th scope="row">{row.label}</th>
              <template for:each={row.cells} for:item="cell">
                <td key={cell.key}>{cell.value}</td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
  </template>

  <template lwc:if={isText}>
    <lightning-formatted-rich-text value={block.body} data-id="text"></lightning-formatted-rich-text>
  </template>

  <template lwc:if={isImage}>
    <img src={block.url} alt={block.altText} class="slds-max-full-width" data-id="image" />
  </template>

  <template lwc:if={isAction}>
    <lightning-button label={block.label} onclick={handleAction} data-id="action"></lightning-button>
    <template lwc:if={showFlow}>
      <div class="slds-var-m-top_small" data-id="flow">
        <lightning-flow
          flow-api-name={block.flowName}
          flow-input-variables={flowInputs}
          onstatuschange={handleFlowStatus}
        ></lightning-flow>
      </div>
    </template>
  </template>
</template>
