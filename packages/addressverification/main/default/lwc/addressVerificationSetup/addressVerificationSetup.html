<template>
    <template lwc:if={helpReady}>
    <!-- The App Page prints the name above this component, so the shell's title is for screen readers only. -->
    <c-barn-page-shell
        title={labels.title}
        purpose={labels.intro}
        icon-name={icons.page}
        data-id="shell"
    >
        <div class="slds-is-relative">
            <template lwc:if={loading}>
                <lightning-spinner alternative-text={labels.title} size="small" data-id="loading"></lightning-spinner>
            </template>
            <template lwc:if={loaded}>
                <p class="slds-var-m-bottom_medium" data-id="provider">{providerText}</p>
                <template lwc:if={noManageShown}>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="info" message={labels.noManage} data-id="no-manage"></c-barn-notice>
                </template>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={credentials} for:item="credential">
                        <div key={credential.provider} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" data-id={credential.dataId}>
                            <h2 class="slds-text-title_bold slds-var-m-bottom_x-small">{credential.heading}</h2>
                            <p class="slds-var-m-bottom_x-small" data-id={credential.statusId}>{credential.status}</p>
                            <p class="slds-var-m-bottom_small slds-text-body_small" data-id={credential.stepsId}>{credential.steps}</p>
                            <lightning-button
                                class="slds-var-m-right_small"
                                label={labels.check}
                                data-provider={credential.provider}
                                data-id={credential.checkId}
                                disabled={locked}
                                onclick={handleCheck}
                            ></lightning-button>
                            <!-- Disconnect forgets a connection, so it shows only on the connected provider. -->
                            <template lwc:if={credential.connected}>
                                <lightning-button
                                    label={labels.clear}
                                    data-provider={credential.provider}
                                    data-id={credential.clearId}
                                    disabled={locked}
                                    onclick={handleClear}
                                ></lightning-button>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="slds-var-m-vertical_medium">
                    <lightning-button variant="brand" label={labels.verify} onclick={handleVerify} disabled={verifyLocked} data-id="verify"></lightning-button>
                </div>
                <template lwc:if={message}>
                    <c-barn-notice class="slds-var-m-bottom_medium" variant={messageVariant} message={message} data-id="message"></c-barn-notice>
                </template>
            </template>
            <template lwc:if={error}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="error" message={error} data-id="error"></c-barn-notice>
            </template>
        </div>
    </c-barn-page-shell>
    </template>
</template>
