<template>
  <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name="custom:custom62">
      <template lwc:if={canEdit}>
        <lightning-button
          slot="actions"
          data-id="download-results"
          label={labels.downloadResults}
          icon-name="utility:download"
          disabled={busy}
          onclick={handleDownloadResults}
        ></lightning-button>
      </template>
      <div class="slds-var-p-horizontal_medium slds-is-relative">
        <template lwc:if={showSpinner}>
          <lightning-spinner
            alternative-text={labels.loading}
            size="small"
            data-id="loading"
          ></lightning-spinner>
        </template>

        <template lwc:if={hasError}>
          <div tabindex="-1" data-id="error-message" class="slds-var-m-bottom_small">
            <c-barn-notice variant="error" message={errorMessage}></c-barn-notice>
          </div>
        </template>
        <p role="status" tabindex="-1" data-id="result" class="slds-assistive-text">
          {resultMessage}
        </p>

        <template lwc:if={loaded}>
          <div
            class="slds-grid slds-wrap slds-grid_vertical-align-center slds-var-m-bottom_small"
            data-id="scope"
          >
            <span class="slds-text-title_bold slds-var-m-right_x-small">{labels.forLabel}</span>
            <span class="slds-text-body_regular slds-var-m-right_small" data-id="scope-name"
              >{scopeName}</span
            >
            <template lwc:if={canChangeScope}>
              <lightning-button
                data-id="change-scope"
                label={labels.change}
                variant="base"
                disabled={busy}
                onclick={handleChangeScope}
              ></lightning-button>
            </template>
          </div>
          <template lwc:if={changingScope}>
            <div class="slds-box slds-var-m-bottom_small" data-id="scope-form">
              <lightning-combobox
                data-id="scope-picker"
                label={labels.forLabel}
                value={draftProgramId}
                options={scopeOptions}
                onchange={handleScopePick}
              ></lightning-combobox>
              <div class="slds-var-m-top_small">
                <lightning-button
                  data-id="scope-save"
                  variant="brand"
                  label={labels.save}
                  disabled={busy}
                  onclick={handleScopeSave}
                  class="slds-var-m-right_x-small"
                ></lightning-button>
                <lightning-button
                  data-id="scope-cancel"
                  label={labels.cancel}
                  onclick={handleScopeCancel}
                ></lightning-button>
              </div>
            </div>
          </template>

          <div class="diagram slds-var-m-bottom_small" data-id="columns">
            <template for:each={columns} for:item="column">
              <div key={column.key} class="diagram__step">
                <template lwc:if={column.showSeparator}>
                  <div class="separator" aria-hidden="true">
                    <lightning-icon
                      class="separator__across"
                      icon-name="utility:chevronright"
                      size="x-small"
                    ></lightning-icon>
                    <lightning-icon
                      class="separator__down"
                      icon-name="utility:chevrondown"
                      size="x-small"
                    ></lightning-icon>
                  </div>
                </template>
                <section
                  class={column.columnClass}
                  data-id="column"
                  data-stage={column.key}
                  data-move-zone="true"
                  data-drop-zone={column.key}
                  data-drop-label={column.name}
                >
                  <h3 class="slds-text-title_bold slds-var-m-bottom_x-small column__heading">
                    <span>{column.name}</span>
                    <lightning-badge
                      class="slds-var-m-left_xx-small"
                      label={column.count}
                      data-id="column-count"
                    ></lightning-badge>
                  </h3>
                  <template lwc:if={column.empty}>
                    <p class="slds-text-color_weak slds-text-body_small slds-var-m-bottom_x-small">
                      {labels.emptyColumn}
                    </p>
                  </template>
                  <template for:each={column.elements} for:item="element">
                    <div
                      key={element.id}
                      class={element.rowClass}
                      data-id="part-row"
                      data-arrow-zone="true"
                      data-drop-zone={element.id}
                      data-drop-label={element.name}
                    >
                      <template lwc:if={canEdit}>
                        <span
                          class="part-row__handle"
                          role="button"
                          tabindex="0"
                          title={element.moveLabel}
                          aria-label={element.moveLabel}
                          aria-describedby="move-drag-help"
                          data-id="move-handle"
                          data-move-handle="true"
                          data-drag-id={element.id}
                          data-drag-label={element.name}
                          onpointerdown={handleMovePointerDown}
                          onkeydown={handleMoveKey}
                        >
                          <lightning-icon
                            icon-name="utility:drag_and_drop"
                            size="xx-small"
                          ></lightning-icon>
                        </span>
                      </template>
                      <button
                        type="button"
                        class={element.className}
                        title={element.name}
                        aria-pressed={element.pressed}
                        data-id="part"
                        data-record-id={element.id}
                        data-drag-id={element.id}
                        onclick={handleSelect}
                        onpointerdown={handleMovePointerDown}
                      >
                        <span class="part__name">{element.name}</span>
                      </button>
                      <template lwc:if={element.canDrawArrow}>
                        <span
                          class="part-row__handle part-row__arrow"
                          role="button"
                          tabindex="0"
                          title={element.arrowLabel}
                          aria-label={element.arrowLabel}
                          aria-describedby="arrow-drag-help"
                          data-id="arrow-handle"
                          data-arrow-handle="true"
                          data-drag-id={element.id}
                          data-drag-label={element.name}
                          onpointerdown={handleArrowPointerDown}
                          onkeydown={handleArrowKey}
                        >
                          <lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon>
                        </span>
                      </template>
                    </div>
                  </template>
                  <template lwc:if={canEdit}>
                    <template lwc:if={column.adding}>
                      <div data-id="add-form">
                        <lightning-input
                          data-id="draft-name"
                          label={labels.name}
                          value={draftName}
                          max-length="80"
                          required
                          onchange={handleDraftName}
                        ></lightning-input>
                        <div class="slds-var-m-top_x-small">
                          <lightning-button
                            data-id="add-save"
                            variant="brand"
                            label={labels.save}
                            disabled={addDisabled}
                            onclick={handleAddSave}
                            class="slds-var-m-right_x-small"
                          ></lightning-button>
                          <lightning-button
                            data-id="add-cancel"
                            label={labels.cancel}
                            onclick={handleAddCancel}
                          ></lightning-button>
                        </div>
                      </div>
                    </template>
                    <template lwc:else>
                      <lightning-button
                        data-id="add"
                        data-stage={column.key}
                        label={column.addLabel}
                        icon-name="utility:add"
                        variant="base"
                        disabled={busy}
                        onclick={handleAdd}
                      ></lightning-button>
                    </template>
                  </template>
                </section>
              </div>
            </template>
          </div>

          <template lwc:if={canEdit}>
            <p
              class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small drag-hint"
              data-id="drag-hint"
            >
              {dragHint}
            </p>
            <span id="move-drag-help" class="slds-assistive-text">{dragInstructions}</span>
            <span id="arrow-drag-help" class="slds-assistive-text">{arrowInstructions}</span>
          </template>
          <p aria-live="polite" class="slds-assistive-text" data-id="drag-announcement">
            {dragAnnouncement}
          </p>

          <template lwc:if={hasSelection}>
            <c-logic-model-part
              data-id="selected-part"
              model={model}
              element-id={selectedId}
              can-edit={canEdit}
              can-delete={canDelete}
              onmodelchange={handleModelChange}
              onfailure={handleChildError}
              onback={handleBack}
            ></c-logic-model-part>
          </template>
          <template lwc:else>
            <p
              class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small"
              data-id="select-hint"
            >
              {labels.selectHint}
            </p>
          </template>

          <c-logic-model-periods
            data-id="model-periods"
            model={model}
            can-edit={canEdit}
            onmodelchange={handleModelChange}
            onfailure={handleChildError}
          ></c-logic-model-periods>

          <h3 class="slds-text-heading_small slds-var-m-vertical_small">{labels.lookAt}</h3>
          <template lwc:if={hasFindings}>
            <ul class="slds-list_dotted slds-var-m-bottom_small" data-id="findings">
              <template for:each={findings} for:item="finding">
                <li key={finding.key}>{finding.text}</li>
              </template>
            </ul>
          </template>
          <template lwc:else>
            <c-barn-empty-state
              data-id="no-findings"
              size="compact"
              illustration="all-clear"
              heading={labels.lookAtNone}
            ></c-barn-empty-state>
          </template>

          <c-logic-model-report
            data-id="report-panel"
            model={model}
            scope-name={scopeName}
          ></c-logic-model-report>
        </template>
      </div>
    </lightning-card>
  </template>
</template>
