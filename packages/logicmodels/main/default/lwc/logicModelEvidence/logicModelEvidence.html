<template>
  <div class="slds-var-m-left_medium slds-var-m-top_xx-small">
    <lightning-button
      data-id="evidence-toggle"
      variant="base"
      label={toggleLabel}
      icon-name={toggleIcon}
      aria-expanded={expanded}
      onclick={handleToggle}
    ></lightning-button>
    <template lwc:if={open}>
      <div data-id="evidence" class="slds-var-p-around_x-small">
        <template lwc:if={isEmpty}>
          <p class="slds-text-body_small slds-text-color_weak">{labels.noEvidence}</p>
        </template>
        <ul>
          <template for:each={entries} for:item="entry">
            <li key={entry.id} data-id="evidence-entry" class="slds-var-m-bottom_x-small">
              <span class="slds-badge slds-var-m-right_x-small">{entry.strengthLabel}</span>
              <span>{entry.summary}</span>
              <template lwc:if={entry.source}>
                <span class="slds-text-body_small slds-text-color_weak slds-var-m-left_x-small"
                  >{entry.source}</span
                >
              </template>
              <template lwc:if={entry.date}>
                <lightning-formatted-date-time
                  class="slds-text-body_small slds-text-color_weak slds-var-m-left_x-small"
                  value={entry.date}
                  time-zone="UTC"
                ></lightning-formatted-date-time>
              </template>
              <template lwc:if={entry.sourceUrl}>
                <lightning-formatted-url
                  class="slds-var-m-left_x-small"
                  value={entry.sourceUrl}
                  label={text.sourceUrl}
                  target="_blank"
                ></lightning-formatted-url>
              </template>
              <template lwc:if={canEdit}>
                <lightning-button
                  data-id="evidence-edit"
                  data-record-id={entry.id}
                  variant="base"
                  label={labels.edit}
                  disabled={busy}
                  onclick={handleEdit}
                  class="slds-var-m-left_x-small"
                ></lightning-button>
              </template>
              <template lwc:if={canDelete}>
                <lightning-button
                  data-id="evidence-remove"
                  data-record-id={entry.id}
                  variant="base"
                  label={labels.remove}
                  disabled={busy}
                  onclick={handleRemove}
                  class="slds-var-m-left_x-small"
                ></lightning-button>
              </template>
            </li>
          </template>
        </ul>
        <template lwc:if={editing}>
          <lightning-input
            data-field="summary"
            label={text.summary}
            value={draft.summary}
            max-length="255"
            required
            onchange={handleDraft}
          ></lightning-input>
          <lightning-input
            data-field="source"
            label={text.source}
            value={draft.source}
            max-length="255"
            onchange={handleDraft}
          ></lightning-input>
          <lightning-input
            data-field="sourceUrl"
            type="url"
            label={text.sourceUrl}
            value={draft.sourceUrl}
            onchange={handleDraft}
          ></lightning-input>
          <lightning-input
            data-field="date"
            type="date"
            label={text.date}
            value={draft.date}
            onchange={handleDraft}
          ></lightning-input>
          <lightning-combobox
            data-field="strength"
            label={text.strength}
            value={draft.strength}
            options={strengths}
            required
            onchange={handleDraft}
          ></lightning-combobox>
          <div class="slds-var-m-top_x-small">
            <lightning-button
              data-id="evidence-save"
              variant="brand"
              label={labels.save}
              disabled={busy}
              onclick={handleSave}
              class="slds-var-m-right_x-small"
            ></lightning-button>
            <lightning-button
              data-id="evidence-cancel"
              label={labels.cancel}
              onclick={handleCancel}
            ></lightning-button>
          </div>
        </template>
        <template lwc:elseif={canEdit}>
          <lightning-button
            data-id="evidence-add"
            label={labels.add}
            icon-name="utility:add"
            disabled={busy}
            onclick={handleAdd}
          ></lightning-button>
        </template>
      </div>
    </template>
  </div>
</template>
