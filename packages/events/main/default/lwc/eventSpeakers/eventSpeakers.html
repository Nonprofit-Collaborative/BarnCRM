<template>
  <template lwc:if={helpReady}>
    <p class="slds-var-m-bottom_small slds-text-color_weak" data-id="intro">{labels.intro}</p>
    <template lwc:if={canAdd}>
      <lightning-record-picker
        data-id="add-speaker"
        class="slds-var-m-bottom_small"
        label={labels.addSpeaker}
        placeholder={labels.addSpeaker}
        object-api-name="Contact"
        disabled={busy}
        onchange={handlePick}
      ></lightning-record-picker>
    </template>

    <template lwc:if={isLoading}>
      <lightning-spinner alternative-text={labels.speakers} size="small"></lightning-spinner>
    </template>

    <template lwc:if={hasError}>
      <c-barn-notice variant="error" message={errorMessage} data-id="error-message"></c-barn-notice>
    </template>

    <template lwc:if={showEmpty}>
      <c-barn-empty-state data-id="empty-state" size="compact" heading={labels.emptyHeading} message={labels.empty}></c-barn-empty-state>
    </template>

    <template lwc:if={hasRows}>
      <table
        class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_stacked-horizontal"
        data-id="speakers"
      >
        <thead>
          <tr class="slds-line-height_reset">
            <th scope="col">{fieldLabels.Name}</th>
            <th scope="col">{fieldLabels.Headline__c}</th>
            <th scope="col">{fieldLabels.Status__c}</th>
            <th scope="col">{fieldLabels.Sessions}</th>
            <th scope="col"><span class="slds-assistive-text">{labels.actions}</span></th>
          </tr>
        </thead>
        <tbody>
          <template for:each={rows} for:item="row">
            <tr key={row.id} data-id="speaker-row">
              <th scope="row" data-label={fieldLabels.Name}>
                <template lwc:if={row.href}>
                  <a href={row.href}>{row.name}</a>
                </template>
                <template lwc:else>{row.name}</template>
              </th>
              <td data-label={fieldLabels.Headline__c}>
                {row.headline}
                <template lwc:if={row.ratingText}>
                  <p class="slds-text-body_small slds-text-color_weak" data-id="rating">
                    {row.ratingText}
                  </p>
                </template>
              </td>
              <td data-label={fieldLabels.Status__c}>
                <c-barn-status-badge status={row.statusWord} label={row.status}></c-barn-status-badge>
              </td>
              <td data-label={fieldLabels.Sessions}>
                <ul>
                  <template for:each={row.assignments} for:item="assignment">
                    <li key={assignment.id} data-id="assignment">
                      {assignment.text}
                      <lightning-button-icon
                        data-id={assignment.id}
                        icon-name="utility:close"
                        variant="bare"
                        size="small"
                        alternative-text={assignment.removeLabel}
                        title={assignment.removeLabel}
                        disabled={busy}
                        onclick={handleUnassign}
                      ></lightning-button-icon>
                    </li>
                  </template>
                </ul>
                <template lwc:if={row.isAssigning}>
                  <div class="slds-var-m-top_x-small" data-id="assign-form">
                    <lightning-combobox
                      data-id="assign-session"
                      label={fieldLabels.Event_Session__c}
                      options={sessionOptions}
                      onchange={handleSession}
                    ></lightning-combobox>
                    <lightning-combobox
                      data-id="assign-role"
                      label={fieldLabels.Role__c}
                      options={roleOptions}
                      value={assigning.role}
                      onchange={handleRole}
                    ></lightning-combobox>
                    <div class="slds-var-m-top_x-small">
                      <lightning-button
                        data-id="assign-cancel"
                        label={labels.cancel}
                        onclick={handleAssignCancel}
                      ></lightning-button>
                      <lightning-button
                        data-id="assign-save"
                        class="slds-var-m-left_x-small"
                        variant="brand"
                        label={labels.save}
                        disabled={cannotAssign}
                        onclick={handleAssignSave}
                      ></lightning-button>
                    </div>
                  </div>
                </template>
              </td>
              <td>
                <lightning-button-menu
                  data-id={row.id}
                  alternative-text={row.menuLabel}
                  icon-size="x-small"
                  menu-alignment="right"
                  onselect={handleMenu}
                >
                  <template for:each={row.menuItems} for:item="item">
                    <lightning-menu-item
                      key={item.value}
                      label={item.label}
                      value={item.value}
                    ></lightning-menu-item>
                  </template>
                </lightning-button-menu>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
  </template>
</template>
