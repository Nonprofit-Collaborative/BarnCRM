<template>
  <lightning-modal-header label={label}></lightning-modal-header>
  <lightning-modal-body>
    <lightning-record-edit-form
      object-api-name={objectApiName}
      record-id={recordId}
      onsuccess={handleSuccess}
      onerror={handleError}
    >
      <lightning-messages></lightning-messages>
      <template for:each={visibleFields} for:item="field">
        <lightning-input-field
          key={field.name}
          data-id="field"
          field-name={field.name}
          value={field.value}
        ></lightning-input-field>
      </template>
      <template for:each={hiddenFields} for:item="field">
        <lightning-input-field
          key={field.name}
          class="slds-hide"
          data-id="hidden-field"
          field-name={field.name}
          value={field.value}
        ></lightning-input-field>
      </template>
    </lightning-record-edit-form>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button
      data-id="record-cancel"
      label={labels.cancel}
      onclick={handleCancel}
    ></lightning-button>
    <lightning-button
      data-id="record-save"
      class="slds-var-m-left_x-small"
      variant="brand"
      label={labels.save}
      disabled={busy}
      onclick={handleSave}
    ></lightning-button>
  </lightning-modal-footer>
</template>
