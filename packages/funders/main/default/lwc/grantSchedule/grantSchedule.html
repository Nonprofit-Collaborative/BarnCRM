<template>
  <lightning-card title={labels.title} icon-name="standard:currency">
    <div class="slds-var-p-horizontal_medium">
      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.title} size="small"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <c-barn-notice
          variant="error"
          message={errorMessage}
          data-id="error-message"
          class="slds-var-m-bottom_small"
        ></c-barn-notice>
      </template>

      <template lwc:if={hasSchedule}>
        <div class="slds-grid slds-wrap slds-gutters_x-small" data-id="totals">
          <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-3 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              data-id="awarded"
              label={heading.awarded}
              value={schedule.amountAwarded}
              format-style="currency"
              bordered
              align="start"
            ></c-barn-stat-tile>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-3 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              data-id="scheduled"
              label={heading.scheduled}
              value={schedule.amountScheduled}
              format-style="currency"
              bordered
              align="start"
            ></c-barn-stat-tile>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-3 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              data-id="received"
              label={heading.received}
              value={schedule.amountReceived}
              format-style="currency"
              bordered
              align="start"
            ></c-barn-stat-tile>
          </div>
        </div>

        <template lwc:if={showReceivedMeter}>
          <c-barn-meter
            data-id="received-meter"
            class="slds-var-m-bottom_small"
            label={heading.received}
            value={receivedPercent}
            value-text={receivedPercentText}
            size="small"
          ></c-barn-meter>
        </template>

        <template lwc:if={showUndo}>
          <c-barn-notice
            variant="success"
            message={labels.saved}
            action-label={labels.undo}
            onaction={handleUndoReceived}
            data-id="undo-received"
            class="slds-var-m-bottom_small"
          ></c-barn-notice>
        </template>

        <template lwc:if={hasPayments}>
          <table
            class="slds-table slds-table_cell-buffer slds-table_bordered slds-max-medium-table_stacked"
            data-id="payments"
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{heading.dueDate}</th>
                <th scope="col" class="slds-text-align_right">{heading.amount}</th>
                <th scope="col">{heading.status}</th>
                <th scope="col"><span class="slds-assistive-text">{labels.markReceived}</span></th>
              </tr>
            </thead>
            <tbody>
              <template for:each={payments} for:item="payment">
                <tr key={payment.id} data-id="payment">
                  <td data-label={heading.dueDate}>
                    <lightning-formatted-date-time
                      value={payment.dueDate}
                      time-zone="UTC"
                    ></lightning-formatted-date-time>
                  </td>
                  <td data-label={heading.amount} class="slds-text-align_right">
                    <lightning-formatted-number
                      value={payment.amount}
                      format-style="currency"
                    ></lightning-formatted-number>
                  </td>
                  <td data-label={heading.status}>{payment.status}</td>
                  <td>
                    <template lwc:if={payment.canMarkReceived}>
                      <lightning-button
                        data-id="mark-received"
                        data-payment-id={payment.id}
                        label={labels.markReceived}
                        disabled={isSaving}
                        onclick={handleMarkReceived}
                      ></lightning-button>
                    </template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>

        <template lwc:if={showCannotBuild}>
          <p data-id="cannot-build" class="slds-text-body_regular">{cannotBuildText}</p>
        </template>

        <template lwc:if={canBuild}>
          <div data-id="build">
            <lightning-combobox
              data-id="frequency"
              label={heading.frequency}
              options={frequencyOptions}
              value={frequency}
              onchange={handleFrequency}
            ></lightning-combobox>
            <template lwc:if={hasPreview}>
              <table
                class="slds-table slds-table_cell-buffer slds-var-m-top_x-small slds-max-medium-table_stacked"
                data-id="preview"
              >
                <thead>
                  <tr class="slds-line-height_reset">
                    <th scope="col">{heading.dueDate}</th>
                    <th scope="col" class="slds-text-align_right">{heading.amount}</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={preview} for:item="row">
                    <tr key={row.key} data-id="preview-row">
                      <td data-label={heading.dueDate}>
                        <lightning-formatted-date-time
                          value={row.dueDate}
                          time-zone="UTC"
                        ></lightning-formatted-date-time>
                      </td>
                      <td data-label={heading.amount} class="slds-text-align_right">
                        <lightning-formatted-number
                          value={row.amount}
                          format-style="currency"
                        ></lightning-formatted-number>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
            <lightning-button
              data-id="build-schedule"
              class="slds-var-m-top_small"
              variant="brand"
              label={labels.build}
              disabled={buildDisabled}
              onclick={handleBuild}
            ></lightning-button>
          </div>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
