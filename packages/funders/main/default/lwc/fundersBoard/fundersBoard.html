<template>
  <template lwc:if={helpReady}>
    <c-barn-page-shell
      title={labels.title}
      purpose={labels.help}
      icon-name={icon}
      title-hidden
      data-id="shell"
    >
      <div slot="actions" class="barn-print-hide">
        <lightning-button
          data-id="print"
          label={labels.print}
          icon-name="utility:print"
          onclick={handlePrint}
        ></lightning-button>
      </div>

      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.title} size="small"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <c-barn-notice
          variant="error"
          message={errorMessage}
          data-id="error-message"
          class="slds-var-m-bottom_small"
        ></c-barn-notice>
      </template>

      <template lwc:if={board}>
        <div class="slds-grid slds-wrap slds-gutters_x-small" data-id="tiles">
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              data-id="revenue"
              label={labels.revenue}
              value={revenueTotal}
              format-style="currency"
              currency-code={currencyCode}
              bordered
              align="start"
            ></c-barn-stat-tile>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              data-id="awarded"
              label={labels.awarded}
              value={awardedTotal}
              format-style="currency"
              currency-code={currencyCode}
              bordered
              align="start"
            ></c-barn-stat-tile>
          </div>
          <template lwc:if={showGifts}>
            <div
              class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small"
            >
              <c-barn-stat-tile
                data-id="gifts"
                label={labels.gifts}
                value={giftsTotal}
                format-style="currency"
                currency-code={currencyCode}
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
          </template>
          <template lwc:if={showRestrictedTile}>
            <div
              class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small"
            >
              <c-barn-stat-tile
                data-id="restricted-total"
                label={labels.grants}
                value={restrictedTotal}
                format-style="currency"
                currency-code={currencyCode}
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
          </template>
        </div>
      </template>

      <c-barn-tool-grid
        class="barn-print-hide"
        groups={toolGroups}
        onselect={handleTool}
        data-id="tools"
      ></c-barn-tool-grid>

      <template lwc:if={board}>
        <div class="slds-grid slds-wrap slds-gutters">
          <section
            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-m-bottom_medium"
          >
            <h2 class="slds-text-heading_medium slds-var-m-bottom_x-small">{labels.mix}</h2>
            <template lwc:if={hasMix}>
              <ul data-id="mix">
                <template for:each={mixRows} for:item="row">
                  <li key={row.key} class="slds-var-m-bottom_x-small" data-id="mix-row">
                    <c-barn-meter
                      label={row.label}
                      value={row.percent}
                      value-text={row.share}
                      size="small"
                    ></c-barn-meter>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else>
              <c-barn-empty-state
                data-id="mix-empty"
                size="compact"
                heading={labels.nothingYet}
                message={labels.empty}
              ></c-barn-empty-state>
            </template>
          </section>

          <section
            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-var-m-bottom_medium"
          >
            <h2 class="slds-text-heading_medium slds-var-m-bottom_x-small">
              {labels.concentration}
            </h2>
            <template lwc:if={hasMix}>
              <template lwc:if={hasFlags}>
                <c-barn-notice variant="warning" data-id="flags" class="slds-var-m-bottom_small">
                  <template for:each={flags} for:item="flag">
                    <p key={flag.key} data-id="flag">{flag.text}</p>
                  </template>
                </c-barn-notice>
              </template>
              <template lwc:else>
                <p data-id="no-risk" class="slds-var-m-bottom_x-small">{noRiskText}</p>
              </template>
              <ul data-id="sources">
                <template for:each={sourceRows} for:item="row">
                  <li key={row.key} class="slds-var-m-bottom_x-small" data-id="source-row">
                    <c-barn-meter
                      label={row.label}
                      value={row.percent}
                      value-text={row.share}
                      size="small"
                    ></c-barn-meter>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else>
              <c-barn-empty-state
                size="compact"
                heading={labels.nothingYet}
                message={labels.empty}
              ></c-barn-empty-state>
            </template>
          </section>

          <section class="slds-col slds-size_1-of-1 slds-var-m-bottom_medium">
            <h2 class="slds-text-heading_medium slds-var-m-bottom_x-small">
              {labels.restricted}
            </h2>
            <template lwc:if={hasFunds}>
              <h3 class="slds-text-heading_small slds-var-m-vertical_x-small">{labels.funds}</h3>
              <table
                class="slds-table slds-table_cell-buffer slds-table_bordered slds-max-medium-table_stacked"
                data-id="funds"
              >
                <tbody>
                  <template for:each={fundRows} for:item="row">
                    <tr key={row.key}>
                      <th scope="row" data-label={labels.name}>{row.name}</th>
                      <td class="slds-text-align_right" data-label={labels.funds}>
                        {row.amount}
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
            <template lwc:if={hasGrants}>
              <h3 class="slds-text-heading_small slds-var-m-vertical_x-small">{labels.grants}</h3>
              <table
                class="slds-table slds-table_cell-buffer slds-table_bordered slds-max-medium-table_stacked"
                data-id="grants"
              >
                <tbody>
                  <template for:each={grantRows} for:item="row">
                    <tr key={row.key}>
                      <th scope="row" data-label={labels.name}>{row.name}</th>
                      <td class="slds-text-align_right" data-label={labels.grants}>
                        {row.amount}
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
            <template lwc:if={noRestricted}>
              <c-barn-empty-state
                data-id="restricted-empty"
                size="compact"
                heading={labels.nothingYet}
                message={labels.empty}
              ></c-barn-empty-state>
            </template>
          </section>
        </div>
      </template>
    </c-barn-page-shell>
  </template>
</template>
