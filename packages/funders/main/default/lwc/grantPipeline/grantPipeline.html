<template>
  <template lwc:if={helpReady}>
    <c-barn-page-shell
      title={labels.title}
      purpose={labels.intro}
      icon-name={icon}
      title-hidden
      data-id="shell"
    >
      <div slot="actions" class="slds-grid slds-grid_vertical-align-center slds-wrap">
        <lightning-radio-group
          data-id="scope"
          class="slds-var-m-right_small"
          name="scope"
          label={labels.scopeEveryone}
          variant="label-hidden"
          type="button"
          options={scopeOptions}
          value={scope}
          onchange={handleScope}
        ></lightning-radio-group>
        <template lwc:if={canCreate}>
          <lightning-button
            data-id="new-grant"
            label={labels.newGrant}
            onclick={handleNewGrant}
          ></lightning-button>
        </template>
      </div>

      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.title} size="small"></lightning-spinner>
      </template>

      <template lwc:if={hasError}>
        <c-barn-notice
          variant="error"
          message={errorMessage}
          data-id="error-message"
          class="slds-var-m-bottom_small"
        ></c-barn-notice>
      </template>

      <template lwc:if={showReadOnly}>
        <c-barn-notice
          message={labels.readOnly}
          data-id="read-only"
          class="slds-var-m-bottom_small"
        ></c-barn-notice>
      </template>

      <template lwc:if={hasBoard}>
        <div class="slds-grid slds-wrap slds-gutters_x-small" data-id="totals">
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              data-id="open-count"
              label={labels.tileOpen}
              value={board.openCount}
              bordered
              align="start"
            ></c-barn-stat-tile>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              data-id="open-amount"
              label={labels.tileRequested}
              value={board.openAmount}
              format-style="currency"
              bordered
              align="start"
            ></c-barn-stat-tile>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              data-id="awarded-amount"
              label={labels.tileAwarded}
              value={board.awardedAmount}
              format-style="currency"
              bordered
              align="start"
            ></c-barn-stat-tile>
          </div>
        </div>
        <p
          class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small"
          data-id="awarded-count"
        >
          {awardedDetail}
        </p>

        <template lwc:if={truncatedMessage}>
          <c-barn-notice
            message={truncatedMessage}
            data-id="truncated"
            class="slds-var-m-bottom_small"
          ></c-barn-notice>
        </template>
      </template>

      <template lwc:if={isEmpty}>
        <c-barn-empty-state
          data-id="empty-state"
          heading={labels.noGrants}
          message={labels.empty}
          class="slds-var-m-bottom_medium"
        >
          <template lwc:if={canCreate}>
            <lightning-button
              data-id="empty-new-grant"
              variant="brand"
              label={labels.newGrant}
              onclick={handleNewGrant}
            ></lightning-button>
          </template>
        </c-barn-empty-state>
      </template>

      <template lwc:if={showColumns}>
        <span id="grant-drag-help" class="slds-assistive-text">{dragHelp}</span>
        <div class="grant-board" data-id="board">
          <template for:each={boardColumns} for:item="column">
            <section
              key={column.key}
              class={column.zoneClass}
              data-id="column"
              data-stage={column.stage}
              data-drop-zone={column.stage}
              data-drop-label={column.stage}
              aria-label={column.stage}
            >
              <header class="slds-var-m-bottom_x-small">
                <h2 class="slds-text-heading_small slds-truncate" title={column.stage}>
                  {column.stage}
                </h2>
                <p class="slds-text-body_small slds-text-color_weak" data-id="column-total">
                  <lightning-formatted-number value={column.count}></lightning-formatted-number>
                  <span class="slds-var-m-horizontal_xx-small" aria-hidden="true">|</span>
                  <lightning-formatted-number
                    value={column.amount}
                    format-style="currency"
                  ></lightning-formatted-number>
                </p>
              </header>
              <template lwc:if={column.isEmpty}>
                <p class="slds-text-body_small slds-text-color_weak">{labels.columnEmpty}</p>
              </template>
              <ul class="slds-has-dividers_around-space">
                <template for:each={column.cards} for:item="card">
                  <li key={card.id} class={card.cardClass} data-id={card.id} data-card>
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
                      <template lwc:if={canEdit}>
                        <span
                          class="grant-handle slds-var-m-right_xx-small"
                          role="button"
                          tabindex="0"
                          title={dragHelp}
                          aria-label={card.name}
                          aria-describedby="grant-drag-help"
                          data-drag-id={card.id}
                          data-drag-label={card.name}
                          onpointerdown={handleDragPointerDown}
                          onkeydown={handleDragKeyDown}
                        >
                          <lightning-icon
                            icon-name="utility:drag_and_drop"
                            size="x-small"
                          ></lightning-icon>
                        </span>
                      </template>
                      <h3 class="slds-col slds-text-title_bold slds-truncate" title={card.name}>
                        <a
                          href={card.href}
                          data-id={card.id}
                          data-name-link
                          onclick={handleOpenCard}
                          >{card.name}</a
                        >
                      </h3>
                      <lightning-button-menu
                        data-id={card.id}
                        alternative-text={card.menuLabel}
                        icon-size="x-small"
                        menu-alignment="right"
                        onselect={handleCardMenu}
                      >
                        <template for:each={card.menuItems} for:item="item">
                          <lightning-menu-item
                            key={item.key}
                            label={item.label}
                            value={item.value}
                          ></lightning-menu-item>
                        </template>
                      </lightning-button-menu>
                    </div>
                    <p class="slds-text-heading_small" data-id="card-amount">
                      <lightning-formatted-number
                        value={card.amountRequested}
                        format-style="currency"
                      ></lightning-formatted-number>
                    </p>
                    <p
                      class="slds-text-body_regular slds-truncate"
                      title={card.funderLabel}
                    >
                      {card.funderLabel}
                    </p>
                    <template lwc:if={card.deadline}>
                      <p class="slds-text-body_small slds-text-color_weak">
                        <lightning-formatted-date-time
                          value={card.deadline}
                          time-zone="UTC"
                        ></lightning-formatted-date-time>
                      </p>
                      <template lwc:if={card.isUrgent}>
                        <c-barn-status-badge
                          data-id="card-urgency"
                          status={card.urgencyStatus}
                          label={card.whenText}
                        ></c-barn-status-badge>
                      </template>
                    </template>
                    <template lwc:if={card.nextStep}>
                      <p class="slds-text-body_small">{card.nextStep}</p>
                    </template>
                    <template lwc:if={card.ownerName}>
                      <div
                        class="slds-grid slds-grid_vertical-align-center slds-var-m-top_xx-small"
                        data-id="owner"
                      >
                        <lightning-avatar
                          size="x-small"
                          variant="circle"
                          initials={card.ownerInitials}
                          fallback-icon-name="standard:user"
                          alternative-text={card.ownerName}
                          class="slds-var-m-right_xx-small"
                        ></lightning-avatar>
                        <span class="slds-text-body_small slds-text-color_weak slds-truncate">
                          {card.ownerName}
                        </span>
                      </div>
                    </template>
                  </li>
                </template>
              </ul>
            </section>
          </template>
          <template for:each={dropZones} for:item="zone">
            <section
              key={zone.key}
              class={zone.zoneClass}
              data-id="drop-zone"
              data-drop-zone={zone.stage}
              data-drop-label={zone.stage}
              aria-label={zone.stage}
            >
              <h2 class="slds-text-heading_small slds-truncate" title={zone.stage}>
                {zone.stage}
              </h2>
            </section>
          </template>
        </div>
        <div aria-live="polite" class="slds-assistive-text" data-id="drag-announcer">
          {liveText}
        </div>
      </template>

      <template lwc:if={hasBoard}>
        <h2 class="slds-text-heading_medium slds-var-m-top_medium slds-var-m-bottom_x-small">
          {labels.deadlines}
        </h2>
        <template lwc:if={showUndo}>
          <c-barn-notice
            variant="success"
            message={labels.markedSubmitted}
            action-label={labels.undo}
            onaction={handleUndoMarked}
            data-id="undo-marked"
            class="slds-var-m-bottom_small"
          ></c-barn-notice>
        </template>
        <template lwc:if={hasDeadlines}>
          <ul class="slds-has-dividers_bottom-space slds-var-m-bottom_medium" data-id="deadlines">
            <template for:each={deadlines} for:item="row">
              <li key={row.id} class="slds-item" data-deadline>
                <div
                  class="slds-grid slds-wrap slds-grid_vertical-align-center slds-gutters_x-small"
                >
                  <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                    <button
                      type="button"
                      class="slds-button slds-text-link"
                      data-id={row.id}
                      data-object={row.objectApiName}
                      onclick={handleOpenDeadline}
                    >
                      {row.name}
                    </button>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="what">
                      {row.whatText}
                    </p>
                  </div>
                  <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-truncate">
                    {row.funderLabel}
                  </div>
                  <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                    <lightning-formatted-date-time
                      value={row.deadline}
                      time-zone="UTC"
                    ></lightning-formatted-date-time>
                    <template lwc:if={row.isUrgent}>
                      <c-barn-status-badge
                        class="slds-var-m-left_xx-small"
                        data-id="when"
                        status={row.urgencyStatus}
                        label={row.whenText}
                      ></c-barn-status-badge>
                    </template>
                    <template lwc:else>
                      <span class="slds-text-body_small slds-text-color_weak" data-id="when">
                        <span class="slds-var-m-horizontal_xx-small" aria-hidden="true">|</span
                        >{row.whenText}</span
                      >
                    </template>
                  </div>
                  <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                    <template lwc:if={row.showMark}>
                      <lightning-button
                        data-id={row.id}
                        data-mark
                        label={labels.markSubmitted}
                        onclick={handleMarkSubmitted}
                      ></lightning-button>
                    </template>
                  </div>
                </div>
              </li>
            </template>
          </ul>
        </template>
        <template lwc:else>
          <c-barn-empty-state
            data-id="deadlines-empty"
            size="compact"
            illustration="all-clear"
            heading={labels.noDeadlines}
            message={labels.deadlinesEmpty}
            heading-level="3"
          ></c-barn-empty-state>
        </template>
      </template>
    </c-barn-page-shell>
  </template>
</template>
