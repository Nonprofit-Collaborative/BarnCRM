<template>
    <lightning-progress-indicator current-step={stepValue} type="path" variant="base">
        <template for:each={steps} for:item="item">
            <lightning-progress-step key={item.value} label={item.label} value={item.value}></lightning-progress-step>
        </template>
    </lightning-progress-indicator>
    <div class="slds-box slds-box_x-small slds-theme_shade slds-var-m-top_small" data-id="builder-sentence">
        <p>
            <template for:each={sentenceParts} for:item="part">
                <span key={part.key}>
                    <template lwc:if={part.isText}>{part.text}</template>
                    <template lwc:else>
                        <lightning-button
                            variant="base"
                            data-id="sentence-part"
                            data-step={part.step}
                            label={part.text}
                            disabled={part.disabled}
                            onclick={handleSentencePart}
                        ></lightning-button>
                    </template>
                </span>
            </template>
        </p>
        <p class="slds-text-body_small slds-text-color_weak">{labels.sentenceHelp}</p>
    </div>
    <h3 class="slds-text-heading_small slds-var-m-vertical_small" data-id="step-title">{stepTitle}</h3>

    <template lwc:if={hasError}>
        <div class="slds-box slds-box_x-small slds-theme_error slds-var-m-bottom_small" role="alert">
            <span data-id="error-message">{error}</span>
        </div>
    </template>

    <template lwc:if={isStep1}>
        <lightning-input
            type="search"
            data-id="target-search"
            label={labels.targetSearch}
            value={targetSearch}
            field-level-help={labels.targetSearchHelp}
            onchange={handleTargetSearch}
        ></lightning-input>
        <lightning-combobox
            name="targetObject"
            data-id="target-object"
            label={labels.targetObject}
            value={draft.targetObject}
            options={targetOptions}
            onchange={handleTargetObject}
        ></lightning-combobox>
        <lightning-combobox
            name="targetField"
            data-id="target-field"
            label={labels.targetField}
            value={draft.targetField}
            options={targetFieldOptions}
            field-level-help={labels.targetFieldHelp}
            onchange={handleInput}
        ></lightning-combobox>
        <lightning-button
            variant="base"
            data-id="open-create-field"
            label={labels.createField}
            onclick={handleOpenCreateField}
        ></lightning-button>
        <template lwc:if={creatingField}>
            <div class="slds-box slds-box_x-small slds-var-m-top_x-small" data-id="create-field">
                <h4 class="slds-text-title_bold">{labels.createField}</h4>
                <p class="slds-text-body_small slds-var-m-bottom_x-small">{labels.createFieldWhy}</p>
                <lightning-input
                    data-id="new-field-label"
                    label={labels.newFieldLabel}
                    max-length="40"
                    value={newFieldLabel}
                    onchange={handleNewFieldLabel}
                ></lightning-input>
                <lightning-combobox
                    data-id="new-field-kind"
                    label={labels.newFieldKind}
                    value={newFieldKind}
                    options={kindOptions}
                    field-level-help={labels.kindHelp}
                    onchange={handleNewFieldKind}
                ></lightning-combobox>
                <lightning-button
                    class="slds-var-m-top_x-small"
                    data-id="write-field"
                    label={labels.writeField}
                    disabled={cannotWriteField}
                    onclick={handleWriteField}
                ></lightning-button>
                <template lwc:if={generatedField}>
                    <ol class="slds-list_ordered slds-var-m-vertical_x-small" data-id="field-steps">
                        <template for:each={generatedField.steps} for:item="fieldStep">
                            <li key={fieldStep}>{fieldStep}</li>
                        </template>
                    </ol>
                    <p class="slds-text-body_small" data-id="field-path">{generatedField.fieldPath}</p>
                    <pre class="slds-box slds-box_x-small slds-scrollable_x" data-id="field-xml">{generatedField.fieldXml}</pre>
                    <div class="slds-var-m-vertical_x-small">
                        <lightning-button data-id="copy-field" label={labels.copy} onclick={handleCopyField}></lightning-button>
                        <a class="slds-button slds-button_neutral slds-var-m-left_x-small" data-id="download-field" href={fieldHref} download={generatedField.fileName}>{labels.downloadField}</a>
                    </div>
                    <template lwc:if={fieldNotice}>
                        <p class="slds-text-body_small" data-id="field-notice">{fieldNotice}</p>
                    </template>
                    <p class="slds-text-body_small" data-id="field-deploy">{fieldDeployText}</p>
                </template>
                <lightning-button
                    class="slds-var-m-top_x-small"
                    data-id="refresh-fields"
                    label={labels.refreshFields}
                    onclick={handleRefreshFields}
                ></lightning-button>
            </div>
        </template>
    </template>

    <template lwc:if={isStep2}>
        <lightning-combobox
            data-id="source"
            label={labels.source}
            value={sourceValue}
            options={sourceOptions}
            onchange={handleSource}
        ></lightning-combobox>
    </template>

    <template lwc:if={isStep3}>
        <lightning-combobox
            name="aggregate"
            data-id="aggregate"
            label={labels.aggregate}
            value={draft.aggregate}
            options={aggregateOptions}
            onchange={handleInput}
        ></lightning-combobox>
        <template lwc:if={unavailableNotice}>
            <p class="slds-text-body_small slds-text-color_weak" data-id="unavailable">{unavailableNotice}</p>
        </template>
        <template lwc:if={needsSourceField}>
            <lightning-combobox
                name="sourceField"
                data-id="source-field"
                label={labels.sourceField}
                value={draft.sourceField}
                options={copyFieldOptions}
                onchange={handleInput}
            ></lightning-combobox>
            <template lwc:if={fieldGuidance}>
                <p class="slds-text-body_small slds-text-color_weak" data-id="field-guidance">{fieldGuidance}</p>
            </template>
        </template>
        <template lwc:if={takesRowLimit}>
            <lightning-input
                type="number"
                name="rowLimit"
                data-id="row-limit"
                label={labels.rowLimit}
                field-level-help={labels.rowLimitHelp}
                min="1"
                step="1"
                value={draft.rowLimit}
                onchange={handleInput}
            ></lightning-input>
        </template>
        <template lwc:if={needsOrderBy}>
            <lightning-combobox
                name="orderByField"
                data-id="order-by"
                label={labels.orderBy}
                value={draft.orderByField}
                options={sourceFieldOptions}
                onchange={handleInput}
            ></lightning-combobox>
        </template>
        <template lwc:if={takesDirection}>
            <lightning-combobox
                name="orderDirection"
                data-id="order-direction"
                label={labels.orderDirection}
                value={orderDirection}
                options={directionOptions}
                onchange={handleInput}
            ></lightning-combobox>
        </template>
        <template lwc:if={isTextList}>
            <lightning-combobox
                name="delimiter"
                label={labels.delimiter}
                value={draft.delimiter}
                options={delimiterOptions}
                onchange={handleInput}
            ></lightning-combobox>
            <template lwc:if={isCustomDelimiter}>
                <lightning-input
                    name="customDelimiter"
                    data-id="custom-delimiter"
                    label={labels.customDelimiter}
                    max-length="10"
                    value={draft.customDelimiter}
                    onchange={handleInput}
                ></lightning-input>
            </template>
        </template>
        <lightning-radio-group
            data-id="window"
            label={labels.window}
            value={windowValue}
            options={windowOptions}
            onchange={handleWindow}
        ></lightning-radio-group>
        <template lwc:if={hasWindow}>
            <lightning-combobox
                name="fiscalDateField"
                data-id="window-date"
                label={labels.windowDate}
                value={draft.fiscalDateField}
                options={dateFieldOptions}
                onchange={handleInput}
            ></lightning-combobox>
        </template>
        <template lwc:if={currencyWarning}>
            <div class="slds-box slds-box_x-small slds-theme_warning slds-var-m-top_small" role="status">
                <span data-id="currency-warning">{currencyWarning}</span>
            </div>
        </template>
    </template>

    <template lwc:if={isStep4}>
        <c-rollup-filter-builder
            data-name="filterJson"
            label={labels.filter}
            fields={filterFields}
            records-label={recordsLabel}
            value={draft.filterJson}
            onchange={handleFilter}
        ></c-rollup-filter-builder>
        <template lwc:if={readsParentField}>
            <p class="slds-var-m-top_x-small slds-text-color_weak" data-id="parent-field-note">{labels.parentFieldNote}</p>
        </template>
        <lightning-input
            type="checkbox"
            class="slds-var-m-top_small"
            name="includeDeleted"
            data-id="include-deleted"
            label={labels.includeDeleted}
            field-level-help={labels.includeDeletedHelp}
            checked={draft.includeDeleted}
            onchange={handleInput}
        ></lightning-input>
        <div class="slds-var-m-top_medium">
            <c-rollup-filter-builder
                data-name="targetFilterJson"
                label={labels.targetFilter}
                fields={targetEntityFields}
                records-label={targetLabel}
                value={draft.targetFilterJson}
                onchange={handleFilter}
            ></c-rollup-filter-builder>
        </div>
    </template>

    <template lwc:if={isStep5}>
        <p class="slds-var-m-bottom_small" data-id="summary">{summary}</p>
        <p data-id="maintains">{maintains}</p>
        <lightning-record-picker data-id="preview-record" label={labels.previewRecord} object-api-name={draft.targetObject} value={previewRecordId} onchange={handlePreviewRecord}></lightning-record-picker>
        <template lwc:if={previewResult}>
            <p class="slds-var-m-bottom_small" data-id="preview-result">{previewResult}</p>
        </template>
        <template lwc:if={hasRowDetail}>
            <div class="slds-var-m-bottom_small" data-id="preview-rows">
                <h4 class="slds-text-title_bold">{labels.rowsHeading}</h4>
                <template lwc:if={previewRows.summary}>
                    <p class="slds-text-body_small" data-id="rows-summary">{previewRows.summary}</p>
                </template>
                <ul class="slds-list_dotted">
                    <template for:each={rowList} for:item="row">
                        <li key={row.recordId} data-id="preview-row">
                            <a href={row.url} target="_blank">{row.name}</a>:
                            <span class={row.outcomeClass}> {row.reason}</span>
                        </li>
                    </template>
                </ul>
                <template lwc:if={previewRows.note}>
                    <p class="slds-text-body_small" data-id="rows-note">{previewRows.note}</p>
                </template>
            </div>
        </template>
        <div class="slds-var-m-bottom_small" data-id="samples">
            <lightning-button data-id="pick-samples" label={labels.pickSamples} onclick={handlePickSamples}></lightning-button>
            <p class="slds-text-body_small slds-var-m-top_xx-small">{labels.pickSamplesHelp}</p>
            <template lwc:if={hasSamples}>
                <h4 class="slds-text-title_bold slds-var-m-top_x-small">{labels.samplesHeading}</h4>
                <ul class="slds-list_dotted">
                    <template for:each={samples} for:item="sample">
                        <li key={sample.recordId} data-id="sample">
                            <strong>{sample.name}</strong>: {sample.result}
                            <lightning-button variant="base" class="slds-var-m-left_x-small" data-id="show-rows" data-record-id={sample.recordId} label={labels.showRows} onclick={handleShowRows}></lightning-button>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:if={noSamples}>
                <p data-id="samples-none">{labels.samplesNone}</p>
            </template>
        </div>
        <lightning-input name="name" data-id="name" label={labels.name} value={draft.name} required onchange={handleInput}></lightning-input>
        <lightning-textarea name="description" label={labels.description} value={draft.description} onchange={handleInput}></lightning-textarea>
        <template lwc:if={noInstantNotice}>
            <div class="slds-box slds-box_x-small slds-theme_info slds-var-m-vertical_small" role="status">
                <span data-id="no-instant">{noInstantNotice}</span>
            </div>
        </template>
        <lightning-radio-group name="mode" data-id="mode" label={labels.mode} value={draft.mode} options={modeOptions} onchange={handleInput}></lightning-radio-group>
        <div class="slds-var-m-vertical_x-small" data-id="mode-consequences">
            <h4 class="slds-text-title_bold">{labels.modeHeading}</h4>
            <ul class="slds-list_dotted">
                <template for:each={modeConsequences} for:item="consequence">
                    <li key={consequence.key} data-id={consequence.key}>{consequence.text}</li>
                </template>
            </ul>
        </div>
        <template lwc:if={instantObject}>
            <c-rollup-instant-totals object-api-name={instantObject} can-manage={canManageInstant}></c-rollup-instant-totals>
        </template>
        <lightning-input type="toggle" name="active" label={labels.active} checked={draft.active} onchange={handleInput}></lightning-input>
        <lightning-input
            name="bypassPermission"
            data-id="bypass-permission"
            label={labels.bypassPermission}
            field-level-help={labels.bypassPermissionHelp}
            value={draft.bypassPermission}
            onchange={handleInput}
        ></lightning-input>
    </template>

    <div class="slds-var-m-top_medium slds-clearfix">
        <lightning-button data-id="cancel" label={labels.cancel} onclick={handleCancel}></lightning-button>
        <div class="slds-float_right">
            <template lwc:if={showBack}>
                <lightning-button data-id="back" label={labels.back} onclick={handleBack}></lightning-button>
            </template>
            <template lwc:if={isStep5}>
                <lightning-button
                    class="slds-var-m-left_x-small"
                    data-id="save"
                    label={labels.save}
                    disabled={busy}
                    onclick={handleSave}
                ></lightning-button>
                <lightning-button
                    class="slds-var-m-left_x-small"
                    variant="brand"
                    data-id="save-and-calculate"
                    label={labels.saveAndCalculate}
                    disabled={busy}
                    onclick={handleSave}
                ></lightning-button>
            </template>
            <template lwc:else>
                <lightning-button
                    class="slds-var-m-left_x-small"
                    variant="brand"
                    data-id="next"
                    label={labels.next}
                    onclick={handleNext}
                ></lightning-button>
            </template>
        </div>
    </div>
</template>
