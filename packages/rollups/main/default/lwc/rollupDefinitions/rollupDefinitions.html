<template>
    <lightning-card title={labels.title} icon-name="utility:number_input">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <p class="slds-var-m-bottom_small">{labels.intro}</p>

            <template lwc:if={isReadOnly}>
                <div class="slds-box slds-box_x-small slds-theme_shade slds-var-m-bottom_small">
                    <p data-id="read-only-notice">{labels.readOnly}</p>
                </div>
            </template>

            <template lwc:if={hasError}>
                <div
                    class="slds-box slds-box_x-small slds-theme_error slds-var-m-bottom_small"
                    role="alert"
                >
                    <span data-id="error-message">{errorMessage}</span>
                </div>
            </template>

            <template lwc:if={hasNotice}>
                <div
                    class="slds-box slds-box_x-small slds-theme_success slds-var-m-bottom_small"
                    role="status"
                    aria-live="polite"
                >
                    <span data-id="notice-message">{noticeMessage}</span>
                </div>
            </template>

            <template lwc:if={deleting}>
                <div
                    class="slds-box slds-theme_warning slds-var-m-bottom_small"
                    role="dialog"
                    aria-labelledby="delete-heading"
                    data-id="delete-panel"
                >
                    <h3 id="delete-heading" class="slds-text-heading_small">{labels.deleteHeading}</h3>
                    <p class="slds-var-m-vertical_x-small" data-id="delete-question">{deleteQuestion}</p>
                    <lightning-radio-group
                        name="deleteChoice"
                        data-id="delete-choice"
                        label={labels.deleteChoice}
                        options={deleteOptions}
                        value={deleteChoice}
                        onchange={handleDeleteChoice}
                    ></lightning-radio-group>
                    <div class="slds-var-m-top_small">
                        <lightning-button
                            data-id="delete-cancel"
                            label={labels.cancel}
                            onclick={handleCancelDelete}
                        ></lightning-button>
                        <lightning-button
                            class="slds-var-m-left_x-small"
                            variant="destructive"
                            data-id="delete-confirm"
                            label={labels.deleteRollup}
                            disabled={controlsDisabled}
                            onclick={handleConfirmDelete}
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <div class="slds-box slds-box_x-small slds-var-m-bottom_small">
                <p>
                    <strong>{labels.freshnessTitle}:</strong>
                    <template lwc:if={lastCalculated}>
                        <lightning-formatted-date-time
                            data-id="last-calculated"
                            value={lastCalculated}
                            year="numeric"
                            month="short"
                            day="2-digit"
                            hour="2-digit"
                            minute="2-digit"
                        ></lightning-formatted-date-time>
                    </template>
                    <template lwc:else>
                        <span data-id="never-calculated">{labels.neverCalculated}</span>
                    </template>
                </p>
                <template lwc:if={isStale}>
                    <p class="slds-text-color_error" data-id="stale-warning">
                        {labels.freshnessStale}
                    </p>
                </template>
                <p data-id="schedule-message">{scheduleMessage}</p>
                <div class="slds-var-m-top_x-small">
                    <lightning-button
                        data-id="schedule-button"
                        label={scheduleButtonLabel}
                        disabled={controlsDisabled}
                        onclick={handleSchedule}
                    ></lightning-button>
                    <lightning-button
                        class="slds-var-m-left_x-small"
                        data-id="recalculate-all"
                        label={labels.recalculateAll}
                        disabled={controlsDisabled}
                        onclick={handleRecalculateAll}
                    ></lightning-button>
                    <lightning-button
                        class="slds-var-m-left_x-small"
                        data-id="restore-defaults"
                        label={labels.restoreDefaults}
                        disabled={controlsDisabled}
                        onclick={handleRestoreDefaults}
                    ></lightning-button>
                    <template lwc:if={builder}>
                        <lightning-button
                            class="slds-var-m-left_x-small"
                            variant="brand"
                            data-id="new-rollup"
                            label={labels.newRollup}
                            disabled={controlsDisabled}
                            onclick={handleNew}
                        ></lightning-button>
                        <lightning-button
                            class="slds-var-m-left_x-small"
                            data-id="export"
                            label={labels.exportRollups}
                            disabled={controlsDisabled}
                            onclick={handleExport}
                        ></lightning-button>
                    </template>
                    <template lwc:if={showBuilderLink}>
                        <lightning-button
                            class="slds-var-m-left_x-small"
                            variant="base"
                            data-id="open-builder"
                            label={labels.openBuilder}
                            onclick={handleOpenBuilder}
                        ></lightning-button>
                    </template>
                </div>
                <template lwc:if={estimate}>
                    <div class="slds-box slds-var-m-top_small" data-id="estimate">
                        <p role="status" data-id="estimate-summary">{estimate.summary}</p>
                        <template lwc:if={estimate.workingHours}>
                            <p class="slds-text-color_error" data-id="working-hours">
                                {labels.workingHours}
                            </p>
                        </template>
                        <div class="slds-var-m-top_x-small">
                            <lightning-button
                                data-id="cancel-estimate"
                                label={labels.cancel}
                                onclick={handleCancelEstimate}
                            ></lightning-button>
                            <lightning-button
                                class="slds-var-m-left_x-small"
                                data-id="start-now"
                                label={labels.startNow}
                                disabled={controlsDisabled}
                                onclick={handleStartNow}
                            ></lightning-button>
                            <lightning-button
                                class="slds-var-m-left_x-small"
                                variant="brand"
                                data-id="run-tonight"
                                label={labels.runTonight}
                                disabled={controlsDisabled}
                                onclick={handleRunTonight}
                            ></lightning-button>
                        </div>
                    </div>
                </template>
                <template lwc:if={builder}>
                    <lightning-input
                        class="slds-var-m-top_small"
                        type="file"
                        data-id="import-file"
                        label={labels.importFile}
                        accept=".json"
                        disabled={controlsDisabled}
                        onchange={handleImportFile}
                    ></lightning-input>
                </template>
                <template lwc:if={importRows}>
                    <div class="slds-box slds-var-m-top_small" data-id="import">
                        <table
                            class="slds-table slds-table_cell-buffer slds-table_bordered"
                            aria-label={labels.importFile}
                        >
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">{labels.columnRollup}</th>
                                    <th scope="col">{labels.importColumn}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={importRows} for:item="row">
                                    <tr key={row.key} data-id="import-row">
                                        <th scope="row">{row.name}</th>
                                        <td>{row.text}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <template lwc:if={importText}>
                            <div class="slds-var-m-top_x-small">
                                <lightning-button
                                    data-id="cancel-import"
                                    label={labels.cancel}
                                    onclick={handleCancelImport}
                                ></lightning-button>
                                <lightning-button
                                    class="slds-var-m-left_x-small"
                                    variant="brand"
                                    data-id="apply-import"
                                    label={labels.importApply}
                                    disabled={importApplyDisabled}
                                    onclick={handleApplyImport}
                                ></lightning-button>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <template lwc:if={isEmpty}>
                <p data-id="empty-message">{labels.emptyList}</p>
            </template>

            <template lwc:if={hasAnyRollup}>
                <lightning-input
                    class="slds-var-m-bottom_small"
                    type="search"
                    data-id="search"
                    label={labels.search}
                    field-level-help={labels.searchHelp}
                    value={searchTerm}
                    onchange={handleSearch}
                ></lightning-input>
            </template>
            <template lwc:if={noMatches}>
                <p data-id="no-matches">{labels.noMatches}</p>
            </template>

            <template lwc:if={hasRows}>
                <div class="slds-scrollable_x">
                    <table
                        class="slds-table slds-table_cell-buffer slds-table_bordered"
                        aria-label={labels.title}
                    >
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">{labels.columnRollup}</th>
                                <th scope="col">{labels.columnCounts}</th>
                                <th scope="col">{labels.columnStatus}</th>
                                <th scope="col">{labels.columnMode}</th>
                                <th scope="col">{labels.columnLastCalculated}</th>
                                <th scope="col">{labels.columnActive}</th>
                                <th scope="col">
                                    <span class="slds-assistive-text">{labels.recalculate}</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={groups} for:item="group">
                                <tr key={group.key} class="slds-theme_shade" data-id="group-row">
                                    <th scope="colgroup" colspan="7">
                                        <strong>{group.heading}</strong>
                                    </th>
                                </tr>
                            <template for:each={group.rows} for:item="row">
                                <tr key={row.recordId} data-id="rollup-row">
                                    <th scope="row">
                                        <template lwc:if={row.exportable}>
                                            <lightning-input
                                                type="checkbox"
                                                data-id={row.recordId}
                                                data-action="select"
                                                label={labels.exportSelect}
                                                variant="label-hidden"
                                                checked={row.selected}
                                                disabled={controlsDisabled}
                                                onchange={handleSelect}
                                            ></lightning-input>
                                        </template>
                                        <div>{row.name}</div>
                                        <div class="slds-text-body_small">{row.description}</div>
                                        <template for:each={row.conflicts} for:item="conflict">
                                            <div
                                                key={conflict.key}
                                                class="slds-text-body_small slds-text-color_error"
                                                data-id="conflict"
                                            >
                                                {conflict.text}
                                            </div>
                                        </template>
                                    </th>
                                    <td class="slds-cell-wrap">
                                        <div data-id="sentence">{row.sentence}</div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            {row.counts}: {row.target}
                                        </div>
                                    </td>
                                    <td class={row.statusClass} data-id="status">{row.status}</td>
                                    <td>
                                        <lightning-combobox
                                            data-id={row.recordId}
                                            label={labels.columnMode}
                                            variant="label-hidden"
                                            value={row.mode}
                                            options={modeOptions}
                                            disabled={controlsDisabled}
                                            onchange={handleModeChange}
                                        ></lightning-combobox>
                                    </td>
                                    <td>
                                        <template lwc:if={row.hasLastCalculated}>
                                            <lightning-formatted-date-time
                                                value={row.lastCalculated}
                                                year="numeric"
                                                month="short"
                                                day="2-digit"
                                                hour="2-digit"
                                                minute="2-digit"
                                            ></lightning-formatted-date-time>
                                        </template>
                                        <template lwc:else>
                                            {labels.neverCalculated}
                                        </template>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="toggle"
                                            data-id={row.recordId}
                                            label={labels.columnActive}
                                            variant="label-hidden"
                                            checked={row.active}
                                            disabled={controlsDisabled}
                                            onchange={handleActiveToggle}
                                        ></lightning-input>
                                    </td>
                                    <td>
                                        <lightning-button
                                            data-id={row.recordId}
                                            label={labels.recalculate}
                                            disabled={controlsDisabled}
                                            onclick={handleRecalculate}
                                        ></lightning-button>
                                        <template lwc:if={builder}>
                                            <lightning-button
                                                class="slds-var-m-left_x-small"
                                                data-id={row.recordId}
                                                data-action="edit"
                                                label={labels.edit}
                                                disabled={controlsDisabled}
                                                onclick={handleEdit}
                                            ></lightning-button>
                                            <lightning-button
                                                class="slds-var-m-left_x-small"
                                                data-id={row.recordId}
                                                data-action="copy"
                                                label={labels.copy}
                                                disabled={controlsDisabled}
                                                onclick={handleCopy}
                                            ></lightning-button>
                                            <lightning-button
                                                class="slds-var-m-left_x-small"
                                                data-id={row.recordId}
                                                data-action="delete"
                                                label={labels.deleteRollup}
                                                disabled={controlsDisabled}
                                                onclick={handleDelete}
                                            ></lightning-button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
