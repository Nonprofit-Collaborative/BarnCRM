<template>
    <lightning-card title={labels.title} icon-name={icons.rollups}>
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={hasOtherTools}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    variant="info"
                    title={labels.otherTools}
                    data-id="other-rollup-tools"
                >
                    <template for:each={otherToolNotices} for:item="otherTool">
                        <p key={otherTool} class="slds-text-body_small">{otherTool}</p>
                    </template>
                    <template lwc:if={showImport}>
                        <lightning-button
                            class="slds-var-m-top_x-small"
                            data-id="import-from-dlrs"
                            label={labels.importFromDlrs}
                            onclick={handleImport}
                        ></lightning-button>
                    </template>
                    <template lwc:if={showNpspImport}>
                        <lightning-button
                            class="slds-var-m-top_x-small slds-var-m-left_x-small"
                            data-id="import-from-npsp"
                            data-tool="npsp"
                            label={labels.importFromNpsp}
                            onclick={handleImport}
                        ></lightning-button>
                    </template>
                </c-barn-notice>
            </template>
            <template lwc:if={notice}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    variant="success"
                    message={notice}
                    data-id="notice"
                ></c-barn-notice>
            </template>
            <template lwc:if={error}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    variant="error"
                    message={error}
                    data-id="error"
                ></c-barn-notice>
            </template>
            <template lwc:if={editing}>
                <c-rollup-wizard model={model} draft={draft} onsaved={handleSaved} oncancel={handleCancel}></c-rollup-wizard>
            </template>
            <template lwc:if={importing}>
                <c-rollup-dlrs-import model={model} tool={importTool} onclose={handleImportClosed}></c-rollup-dlrs-import>
            </template>
        </div>
        <div class={listClass}>
            <c-rollup-needs-attention></c-rollup-needs-attention>
            <c-rollup-templates can-manage={canManage} onopen={handleTemplateOpen} onadded={handleTemplatesAdded}></c-rollup-templates>
            <c-rollup-definitions builder onnew={handleNew} onedit={handleEdit} oncopy={handleCopy}></c-rollup-definitions>
            <lightning-accordion class="slds-var-m-horizontal_medium" data-id="advanced" allow-multiple-sections-open>
                <lightning-accordion-section name="advanced" label={labels.advanced}>
                    <c-rollup-instant-totals can-manage={canManage}></c-rollup-instant-totals>
                </lightning-accordion-section>
            </lightning-accordion>
        </div>
    </lightning-card>
</template>
