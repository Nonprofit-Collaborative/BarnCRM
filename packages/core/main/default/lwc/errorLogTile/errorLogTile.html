<template>
    <lightning-card title={labels.title} icon-name="utility:warning">
        <span slot="actions">
            <lightning-badge data-id="new-count" label={newCountLabel}></lightning-badge>
        </span>

        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <template lwc:if={hasError}>
                <div
                    class="slds-box slds-box_x-small slds-theme_error slds-var-m-bottom_small"
                    role="alert"
                >
                    <lightning-icon
                        icon-name="utility:error"
                        size="x-small"
                        alternative-text={labels.title}
                    ></lightning-icon>
                    <span data-id="error-message">{errorMessage}</span>
                </div>
            </template>

            <template lwc:if={isReadOnly}>
                <p class="slds-text-body_small slds-var-m-bottom_small" data-id="read-only-notice">
                    {labels.readOnly}
                </p>
            </template>

            <template lwc:if={isEmpty}>
                <p data-id="empty-state">{labels.empty}</p>
            </template>

            <ul class="slds-has-dividers_bottom-space" data-id="entry-list">
                <template for:each={entries} for:item="entry">
                    <li key={entry.recordId} class="slds-item">
                        <p class="slds-text-heading_small">{entry.message}</p>
                        <p class="slds-text-body_small">
                            {entry.context}
                            <lightning-formatted-date-time
                                value={entry.occurredAt}
                                year="numeric"
                                month="short"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit"
                            ></lightning-formatted-date-time>
                        </p>
                        <lightning-button
                            class="open-entry-button"
                            data-entry={entry.recordId}
                            label={labels.openEntry}
                            variant="base"
                            onclick={handleOpenEntry}
                        ></lightning-button>
                        <lightning-button
                            class="acknowledge-button slds-var-m-left_x-small"
                            data-entry={entry.recordId}
                            label={labels.acknowledge}
                            variant="neutral"
                            disabled={actionsDisabled}
                            onclick={handleAcknowledge}
                        ></lightning-button>
                    </li>
                </template>
            </ul>

            <lightning-button
                class="slds-var-m-top_small"
                data-id="view-all"
                label={labels.viewAll}
                variant="base"
                onclick={handleViewAll}
            ></lightning-button>
        </div>
    </lightning-card>
</template>
