<template>
    <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name="custom:custom53">
        <span slot="actions">
            <c-barn-status-badge
                data-id="new-count"
                status={newCountStatus}
                label={newCountLabel}
            ></c-barn-status-badge>
        </span>

        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <template lwc:if={hasError}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    variant="error"
                    message={errorMessage}
                    data-id="error-message"
                ></c-barn-notice>
            </template>

            <template lwc:if={isReadOnly}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    message={labels.readOnly}
                    data-id="read-only-notice"
                ></c-barn-notice>
            </template>

            <template lwc:if={isEmpty}>
                <c-barn-empty-state
                    illustration="all-clear"
                    size="compact"
                    heading={labels.empty}
                    data-id="empty-state"
                ></c-barn-empty-state>
            </template>

            <ul class="slds-has-dividers_bottom-space" data-id="entry-list">
                <template for:each={entries} for:item="entry">
                    <li key={entry.recordId} class="slds-item">
                        <p class="slds-text-title_bold">{entry.message}</p>
                        <p class="slds-text-body_small slds-text-color_weak">
                            {entry.context}
                            <lightning-formatted-date-time
                                value={entry.occurredAt}
                                year="numeric"
                                month="short"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit"
                            ></lightning-formatted-date-time>
                        </p>
                        <lightning-button
                            class="open-entry-button"
                            data-entry={entry.recordId}
                            label={labels.openEntry}
                            variant="base"
                            onclick={handleOpenEntry}
                        ></lightning-button>
                        <lightning-button
                            class="acknowledge-button slds-var-m-left_x-small"
                            data-entry={entry.recordId}
                            label={labels.acknowledge}
                            variant="neutral"
                            disabled={actionsDisabled}
                            onclick={handleAcknowledge}
                        ></lightning-button>
                    </li>
                </template>
            </ul>

            <lightning-button
                class="slds-var-m-top_small"
                data-id="view-all"
                label={labels.viewAll}
                variant="base"
                onclick={handleViewAll}
            ></lightning-button>
        </div>
    </lightning-card>
    </template>
</template>
