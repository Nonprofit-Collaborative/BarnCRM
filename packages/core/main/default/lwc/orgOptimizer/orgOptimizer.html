<template>
    <c-barn-page-shell
        icon-name="standard:dashboard"
        title={labels.title}
        purpose={labels.intro}
        title-hidden
        help-storage-key="orgOptimizer"
    >
        <div slot="help" class="slds-var-p-bottom_small" data-id="help">
            <p>{labels.helpText}</p>
            <c-barn-help learn-more-url={learnMoreUrl}></c-barn-help>
        </div>

        <lightning-tabset variant="vertical" active-tab-value={activeSection}>
            <lightning-tab label={labels.overview} value="overview" onactive={handleActive} data-id="tab-overview">
                <c-barn-tool-grid groups={overviewGroups} onselect={handleSelectTool} data-id="overview"></c-barn-tool-grid>
            </lightning-tab>

            <template lwc:if={canSeeQuality}>
                <lightning-tab label={labels.quality} value="quality" onactive={handleActive} data-id="tab-quality">
                    <template lwc:if={qualityOpened}>
                        <c-data-hygiene-console onsummary={handleQualitySummary}></c-data-hygiene-console>
                    </template>
                </lightning-tab>
            </template>

            <template lwc:if={isAdmin}>
                <lightning-tab
                    label={labels.fieldUtilization}
                    value="fieldUtilization"
                    onactive={handleActive}
                    data-id="tab-fieldUtilization"
                >
                    <template lwc:if={fieldUtilizationOpened}>
                        <c-field-utilization></c-field-utilization>
                    </template>
                </lightning-tab>
                <lightning-tab label={labels.healthCheck} value="healthCheck" onactive={handleActive} data-id="tab-healthCheck">
                    <template lwc:if={showHealthCheck}>
                        <c-health-check-panel></c-health-check-panel>
                    </template>
                    <template lwc:else>
                        <c-barn-empty-state
                            illustration="setup"
                            heading={labels.healthCheckNotRun}
                            message={labels.healthCheckIntro}
                            heading-level="2"
                            data-id="health-check-empty"
                        >
                            <lightning-button
                                variant="brand"
                                label={labels.runHealthCheck}
                                onclick={handleRunHealthCheck}
                                data-id="run-health-check"
                            ></lightning-button>
                        </c-barn-empty-state>
                    </template>
                </lightning-tab>
                <lightning-tab label={labels.errors} value="errors" onactive={handleActive} data-id="tab-errors">
                    <template lwc:if={errorsOpened}>
                        <c-error-log-tile></c-error-log-tile>
                    </template>
                </lightning-tab>
                <lightning-tab label={labels.storage} value="storage" onactive={handleActive} data-id="tab-storage">
                    <template lwc:if={storageOpened}>
                        <c-optimizer-storage onsummary={handleStorageSummary}></c-optimizer-storage>
                    </template>
                </lightning-tab>
                <lightning-tab label={labels.setup} value="setup" onactive={handleActive} data-id="tab-setup">
                    <template lwc:if={setupOpened}>
                        <c-optimizer-setup></c-optimizer-setup>
                    </template>
                </lightning-tab>
            </template>
        </lightning-tabset>
    </c-barn-page-shell>
</template>
