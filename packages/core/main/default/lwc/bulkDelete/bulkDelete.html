<template>
    <section class="slds-box slds-is-relative" aria-labelledby="bulk-delete-title" data-id="panel">
        <div class="slds-grid slds-grid_vertical-align-center slds-var-m-bottom_small">
            <lightning-icon icon-name="utility:delete" size="small" class="slds-var-m-right_x-small"></lightning-icon>
            <h2 class="slds-text-heading_small slds-col" id="bulk-delete-title">{labels.title}</h2>
            <lightning-button data-id="close" label={labels.close} onclick={handleClose}></lightning-button>
        </div>
        <lightning-progress-indicator
            class="slds-var-m-bottom_small"
            data-id="path"
            type="path"
            variant="base"
            current-step={currentStep}
        >
            <template for:each={steps} for:item="step">
                <lightning-progress-step key={step.value} label={step.label} value={step.value}></lightning-progress-step>
            </template>
        </lightning-progress-indicator>
        <div>
            <template lwc:if={busy}>
                <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
            </template>

            <template lwc:if={hasError}>
                <div class="slds-box slds-box_x-small slds-theme_error slds-var-m-bottom_small" role="alert">
                    <span data-id="error-message">{errorMessage}</span>
                </div>
            </template>
            <template lwc:if={hasNotice}>
                <div
                    class="slds-box slds-box_x-small slds-theme_success slds-var-m-bottom_small"
                    role="status"
                    aria-live="polite"
                >
                    <span data-id="notice-message">{noticeMessage}</span>
                </div>
            </template>

            <p class="slds-var-m-bottom_small" data-id="intro">{intro}</p>
            <lightning-button
                class="slds-var-m-bottom_small"
                data-id="preview"
                variant="brand"
                label={labels.preview}
                disabled={previewDisabled}
                onclick={handlePreview}
            ></lightning-button>

            <template lwc:if={preview}>
                <section class="slds-box slds-var-m-vertical_medium" data-id="preview-box">
                    <p class="slds-text-title_bold" data-id="preview-line" role="status">{previewLine}</p>
                    <ul class="slds-list_dotted slds-var-m-vertical_x-small">
                        <template for:each={preview.sample} for:item="record">
                            <li key={record.recordId} data-id="sample-row">{record.name}</li>
                        </template>
                    </ul>
                    <template lwc:if={hasCascades}>
                        <div class="slds-box slds-box_x-small slds-theme_warning slds-var-m-bottom_small" data-id="cascades">
                            <p class="slds-var-m-bottom_x-small">{labels.cascades}</p>
                            <ul class="slds-list_horizontal slds-wrap">
                                <template for:each={preview.cascades} for:item="cascade">
                                    <li key={cascade} class="slds-var-m-right_xx-small slds-var-m-bottom_xx-small">
                                        <lightning-badge label={cascade} data-id="cascade"></lightning-badge>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                    <p class="slds-text-body_small slds-var-m-bottom_small">
                        {labels.undoUntil}
                        <lightning-formatted-date-time
                            class="slds-var-m-left_xx-small"
                            value={preview.undoDeadline}
                            year="numeric"
                            month="short"
                            day="numeric"
                        ></lightning-formatted-date-time>
                    </p>
                    <div class="slds-grid slds-grid_vertical-align-center slds-var-m-bottom_small">
                        <lightning-button
                            data-id="backup"
                            icon-name="utility:download"
                            label={labels.backup}
                            disabled={busy}
                            onclick={handleBackup}
                        ></lightning-button>
                        <c-barn-help
                            class="slds-var-m-left_x-small"
                            data-id="backup-help"
                            content={labels.backupHelp}
                            alternative-text={labels.backup}
                        ></c-barn-help>
                    </div>
                    <div class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                            <lightning-input
                                data-id="confirm"
                                label={labels.confirm}
                                value={confirmText}
                                onchange={handleConfirmText}
                            ></lightning-input>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <lightning-button
                                data-id="start"
                                variant="destructive"
                                label={deleteLabel}
                                disabled={startDisabled}
                                onclick={handleStart}
                            ></lightning-button>
                        </div>
                    </div>
                </section>
            </template>

            <template lwc:if={jobView}>
                <section class="slds-box slds-var-m-vertical_medium" data-id="job">
                    <p class="slds-text-title_bold">{jobView.name}: {jobView.status}</p>
                    <template lwc:if={jobView.running}>
                        <p class="slds-var-m-vertical_x-small" role="status" aria-live="polite">{jobView.progressLine}</p>
                        <lightning-progress-bar value={jobView.progressValue} size="large"></lightning-progress-bar>
                    </template>
                    <template lwc:else>
                        <p data-id="job-summary">{jobView.summary}</p>
                        <template lwc:if={jobView.hasFailures}>
                            <h3 class="slds-text-heading_small slds-var-m-top_small">{labels.failures}</h3>
                            <ul class="slds-list_dotted">
                                <template for:each={jobView.failures} for:item="failure">
                                    <li key={failure.recordId}>{failure.recordId}: {failure.reason}</li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:if={jobView.showUndo}>
                            <p class="slds-var-m-top_small" data-id="undo-from-tab">{labels.undoFromTab}</p>
                        </template>
                    </template>
                </section>
            </template>
        </div>
    </section>
</template>
