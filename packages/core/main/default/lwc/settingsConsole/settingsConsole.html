<template>
    <c-first-run-setup onsetupfinished={handleSetupFinished}></c-first-run-setup>
    <!-- The App Page prints the name above this component, so the shell's title is for screen readers only. -->
    <c-barn-page-shell
        title={labels.title}
        purpose={labels.purpose}
        title-hidden
    >
        <div>
            <template lwc:if={loading}>
                <lightning-spinner
                    alternative-text={labels.title}
                    size="small"
                ></lightning-spinner>
            </template>

            <template lwc:if={showReadOnlyNotice}>
                <div class="slds-box slds-theme_shade slds-var-m-bottom_small" role="status">
                    {labels.readOnly}
                </div>
            </template>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                    <c-settings-search onsettingselect={handleSearchSelect}></c-settings-search>
                    <lightning-vertical-navigation
                        class="slds-var-p-top_small"
                        selected-item={selectedSection}
                        onselect={handleSectionSelect}
                        aria-label={labels.sectionsHeading}
                    >
                        <template for:each={navigationGroups} for:item="group">
                            <lightning-vertical-navigation-section
                                key={group.name}
                                label={group.label}
                            >
                                <template for:each={group.items} for:item="item">
                                    <lightning-vertical-navigation-item-icon
                                        key={item.name}
                                        label={item.label}
                                        name={item.name}
                                        icon-name={item.iconName}
                                    ></lightning-vertical-navigation-item-icon>
                                </template>
                            </lightning-vertical-navigation-section>
                        </template>
                    </lightning-vertical-navigation>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-4">
                    <c-settings-setup-notes section={selectedSection}></c-settings-setup-notes>

                    <template lwc:if={hasUnsavedDefaults}>
                        <div
                            class="slds-scoped-notification slds-scoped-notification_light slds-media slds-media_center slds-var-m-bottom_small"
                            data-id="defaults-banner"
                        >
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <p class="slds-text-title_bold">{labels.defaultsTitle}</p>
                                <p>{labels.defaultsText}</p>
                            </div>
                            <template lwc:if={canKeepAllDefaults}>
                                <div class="slds-media__figure slds-media__figure_reverse">
                                    <lightning-button
                                        label={labels.keepAllDefaults}
                                        data-id="keep-all"
                                        onclick={handleKeepAllDefaults}
                                    ></lightning-button>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template lwc:if={sectionIsEmpty}>
                        <p class="slds-text-color_weak">{labels.emptySection}</p>
                    </template>

                    <!-- One box per sub-section (P1). The row markup inside keeps its indentation. -->
                    <template for:each={currentGroups} for:item="group">
                    <section
                        key={group.id}
                        class="slds-box slds-var-m-bottom_medium"
                        data-box={group.id}
                        aria-labelledby={group.headingId}
                    >
                    <h2
                        class="slds-text-heading_small slds-var-m-bottom_small"
                        id={group.headingId}
                        tabindex="-1"
                    >
                        {group.label}
                    </h2>
                    <template for:each={group.rows} for:item="row">
                        <div
                            key={row.key}
                            class="slds-form-element slds-var-m-bottom_medium"
                            role="group"
                            aria-label={row.label}
                        >
                            <template lwc:if={row.isCheckbox}>
                                <lightning-input
                                    type="checkbox"
                                    label={row.label}
                                    checked={row.checked}
                                    disabled={row.disabled}
                                    data-key={row.key}
                                    data-kind="Checkbox"
                                    onchange={handleChange}
                                ></lightning-input>
                            </template>

                            <template lwc:elseif={row.isText}>
                                <lightning-input
                                    type="text"
                                    label={row.label}
                                    value={row.value}
                                    disabled={row.disabled}
                                    data-key={row.key}
                                    data-kind="Text"
                                    onchange={handleChange}
                                ></lightning-input>
                            </template>

                            <template lwc:elseif={row.isNumber}>
                                <lightning-input
                                    type="number"
                                    label={row.label}
                                    value={row.value}
                                    min={row.minValue}
                                    max={row.maxValue}
                                    step="any"
                                    disabled={row.disabled}
                                    data-key={row.key}
                                    data-kind="Number"
                                    onchange={handleChange}
                                ></lightning-input>
                            </template>

                            <template lwc:elseif={row.isDateTime}>
                                <lightning-input
                                    type="datetime"
                                    label={row.label}
                                    value={row.value}
                                    disabled={row.disabled}
                                    data-key={row.key}
                                    data-kind="DateTime"
                                    onchange={handleChange}
                                ></lightning-input>
                            </template>

                            <template lwc:elseif={row.isPicklist}>
                                <lightning-combobox
                                    label={row.label}
                                    value={row.value}
                                    options={row.options}
                                    disabled={row.disabled}
                                    data-key={row.key}
                                    data-kind="Picklist"
                                    onchange={handleChange}
                                ></lightning-combobox>
                            </template>

                            <template lwc:elseif={row.isRecord}>
                                <lightning-record-picker
                                    label={row.label}
                                    object-api-name={row.objectApiName}
                                    value={row.value}
                                    disabled={row.disabled}
                                    data-key={row.key}
                                    data-kind="Record"
                                    onchange={handleChange}
                                ></lightning-record-picker>
                            </template>

                            <template lwc:elseif={row.isRecordTypeList}>
                                <lightning-checkbox-group
                                    label={row.label}
                                    options={row.options}
                                    value={row.selected}
                                    disabled={row.disabled}
                                    data-key={row.key}
                                    data-kind="RecordTypeList"
                                    onchange={handleChange}
                                ></lightning-checkbox-group>
                            </template>

                            <template lwc:elseif={row.isSetupValue}>
                                <lightning-input
                                    type="text"
                                    label={row.label}
                                    value={row.value}
                                    read-only
                                    field-level-help={labels.fromSetupHelp}
                                    data-key={row.key}
                                    data-kind="SetupValue"
                                ></lightning-input>
                                <template lwc:if={row.setupUrl}>
                                    <a
                                        class="slds-button slds-var-m-top_xx-small"
                                        href={row.setupUrl}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        data-id="open-setup"
                                        data-key={row.key}
                                    >
                                        <lightning-icon
                                            icon-name="utility:new_window"
                                            size="xx-small"
                                            class="slds-button__icon slds-button__icon_left"
                                        ></lightning-icon>
                                        {labels.openInSetup}
                                        <span class="slds-assistive-text">{labels.newTab}</span>
                                    </a>
                                </template>
                            </template>

                            <template lwc:elseif={row.isComponent}>
                                <h3
                                    class={row.headingClass}
                                    data-key={row.key}
                                    tabindex="-1"
                                >
                                    {row.label}
                                </h3>
                                <template lwc:if={row.ctor}>
                                    <lwc:component
                                        lwc:is={row.ctor}
                                        data-panel
                                        onfeatureturnedon={handleFeatureTurnedOn}
                                        onsettingssaved={handleSettingsSaved}
                                    ></lwc:component>
                                </template>
                                <template lwc:elseif={row.navigatesAway}>
                                    <lightning-button
                                        label={row.openLabel}
                                        data-target={row.navigationTarget}
                                        onclick={handleOpenSection}
                                    ></lightning-button>
                                </template>
                                <template lwc:elseif={row.missing}>
                                    <p class="slds-text-color_weak" role="status">
                                        {labels.notInstalled}
                                    </p>
                                </template>
                            </template>

                            <template lwc:if={row.showsHelpLine}>
                                <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-var-m-top_xx-small">
                                    <template lwc:if={row.showsUnsavedDefault}>
                                        <span
                                            class="slds-var-m-right_small"
                                            data-default-note={row.key}
                                        >
                                            <lightning-badge label={labels.defaultBadge}></lightning-badge>
                                            <template lwc:if={row.canKeepDefault}>
                                                <lightning-button
                                                    class="slds-var-m-left_x-small"
                                                    variant="base"
                                                    label={labels.keepDefault}
                                                    aria-label={row.keepDefaultLabel}
                                                    data-keep={row.key}
                                                    onclick={handleKeepDefault}
                                                ></lightning-button>
                                            </template>
                                        </span>
                                    </template>
                                    <template lwc:if={row.hasHelpContent}>
                                        <c-barn-help
                                            content={row.description}
                                            learn-more-url={row.helpUrl}
                                            alternative-text={row.helpLabel}
                                            data-help={row.key}
                                        ></c-barn-help>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    </section>
                    </template>

                    <template lwc:if={message}>
                        <p class={messageClass} role="status" aria-live="polite">{message}</p>
                    </template>

                    <template lwc:if={showSaveBar}>
                        <c-barn-save-bar
                            dirty-count={dirtyCount}
                            saving={saving}
                            onsave={handleSave}
                            ondiscard={handleDiscard}
                        ></c-barn-save-bar>
                    </template>
                </div>
            </div>

            <div lwc:if={showRecentChanges} class="slds-var-m-top_large">
                <h2 class="slds-text-heading_small" id="settings-recent-changes">
                    {labels.recentHeading}
                </h2>
                <template lwc:if={hasChangesToShow}>
                    <lightning-datatable
                        key-field="id"
                        data={changes}
                        columns={columns}
                        hide-checkbox-column
                        aria-labelledby="settings-recent-changes"
                    ></lightning-datatable>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak">{labels.recentEmpty}</p>
                </template>
            </div>
        </div>
        <p slot="footer" class="slds-text-body_small">
            <a
                href={labels.feedbackUrl}
                target="_blank"
                rel="noopener noreferrer"
                aria-label={labels.feedbackAria}
                >{labels.feedbackLink}<lightning-icon class="slds-var-m-left_xx-small" icon-name="utility:new_window" size="xx-small"></lightning-icon
            ></a
            >
        </p>
    </c-barn-page-shell>
</template>
