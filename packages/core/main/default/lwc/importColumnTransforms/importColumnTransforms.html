<template>
    <template lwc:if={helpReady}>
    <div class="slds-box slds-var-m-top_small" data-id="changes">
        <template lwc:if={standalone}>
            <h3 class="slds-text-heading_small">{heading}</h3>
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_x-small">{labels.help}</p>
        </template>
        <template for:each={rows} for:item="step">
            <div key={step.key} class="step slds-grid slds-wrap slds-gutters_x-small slds-var-m-bottom_x-small" data-id="step" data-reorder-item>
                <div class="slds-col slds-grow-none slds-align-bottom">
                    <span
                        class="drag-handle"
                        title={labels.dragLabel}
                        aria-hidden="true"
                        data-index={step.index}
                        data-id="drag"
                        onpointerdown={handleDragStart}
                    >
                        <lightning-icon icon-name="utility:drag_and_drop" size="x-small"></lightning-icon>
                    </span>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <lightning-combobox
                        label={labels.kindLabel}
                        data-key={step.key}
                        data-name="op"
                        value={step.op}
                        options={operationOptions}
                        onchange={handleInput}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
                    <template lwc:if={step.isReplace}>
                        <lightning-input label={labels.findLabel} data-key={step.key} data-name="text" value={step.text} max-length="255" onchange={handleInput}></lightning-input>
                        <lightning-input label={labels.replaceWithLabel} data-key={step.key} data-name="replaceWith" value={step.replaceWith} max-length="255" onchange={handleInput}></lightning-input>
                        <lightning-input type="checkbox" label={labels.matchCaseLabel} data-key={step.key} data-name="matchCase" checked={step.matchCase} onchange={handleInput}></lightning-input>
                        <lightning-input type="checkbox" label={labels.wholeValueLabel} data-key={step.key} data-name="wholeValue" checked={step.wholeValue} onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:if={step.isIfBlank}>
                        <lightning-input label={labels.valueLabel} data-key={step.key} data-name="value" value={step.value} max-length="255" onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:if={step.isAppend}>
                        <lightning-checkbox-group label={columnsText} data-key={step.key} data-name="columns" options={otherColumnOptions} value={step.columns} onchange={handleInput}></lightning-checkbox-group>
                        <lightning-input label={labels.separatorLabel} data-key={step.key} data-name="separator" value={step.separator} max-length="10" onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:if={step.isDate}>
                        <lightning-combobox label={labels.dateOrderLabel} data-key={step.key} data-name="dateOrder" value={step.dateOrder} options={orderOptions} onchange={handleInput}></lightning-combobox>
                    </template>
                    <template lwc:if={step.isMap}>
                        <template for:each={step.pairRows} for:item="pair">
                            <div key={pair.key} class="slds-grid slds-gutters_x-small" data-id="pair">
                                <div class="slds-col">
                                    <lightning-input label={labels.mapFromLabel} data-key={step.key} data-index={pair.index} data-name="text" value={pair.text} max-length="255" onchange={handlePair}></lightning-input>
                                </div>
                                <div class="slds-col">
                                    <lightning-input label={labels.mapToLabel} data-key={step.key} data-index={pair.index} data-name="value" value={pair.value} max-length="255" onchange={handlePair}></lightning-input>
                                </div>
                                <div class="slds-col slds-grow-none slds-align-bottom">
                                    <lightning-button-icon icon-name="utility:close" alternative-text={labels.mapRemoveRowLabel} title={labels.mapRemoveRowLabel} data-key={step.key} data-index={pair.index} data-id="remove-pair" onclick={handleRemovePair}></lightning-button-icon>
                                </div>
                            </div>
                        </template>
                        <lightning-button class="slds-var-m-top_xx-small" label={labels.mapAddRowLabel} data-key={step.key} data-id="add-pair" disabled={step.cannotAddPair} onclick={handleAddPair}></lightning-button>
                        <lightning-input label={labels.mapOtherwiseLabel} data-key={step.key} data-name="otherwise" value={step.otherwise} max-length="255" onchange={handleInput}></lightning-input>
                        <lightning-input type="checkbox" label={labels.matchCaseLabel} data-key={step.key} data-name="matchCase" checked={step.matchCase} onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:if={step.isIfThen}>
                        <lightning-combobox label={labels.testLabel} data-key={step.key} data-name="test" value={step.test} options={testOptions} onchange={handleInput}></lightning-combobox>
                        <template lwc:if={step.needsTestText}>
                            <lightning-input label={labels.testTextLabel} data-key={step.key} data-name="text" value={step.text} max-length="255" onchange={handleInput}></lightning-input>
                            <lightning-input type="checkbox" label={labels.matchCaseLabel} data-key={step.key} data-name="matchCase" checked={step.matchCase} onchange={handleInput}></lightning-input>
                        </template>
                        <lightning-input label={labels.thenValueLabel} data-key={step.key} data-name="value" value={step.value} max-length="255" onchange={handleInput}></lightning-input>
                        <lightning-input label={labels.otherwiseLabel} data-key={step.key} data-name="otherwise" value={step.otherwise} max-length="255" onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:if={step.isPart}>
                        <lightning-input label={labels.splitAtLabel} data-key={step.key} data-name="separator" value={step.separator} max-length="10" required onchange={handleInput}></lightning-input>
                        <lightning-input type="number" label={labels.positionLabel} data-key={step.key} data-name="position" value={step.position} min="1" max="50" step="1" onchange={handleInput}></lightning-input>
                        <lightning-input type="checkbox" label={labels.fromEndLabel} data-key={step.key} data-name="fromEnd" checked={step.fromEnd} onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:if={step.isCount}>
                        <lightning-input type="number" label={labels.countLabel} data-key={step.key} data-name="count" value={step.count} min="1" max="255" step="1" onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:if={step.isShiftDate}>
                        <lightning-input type="number" label={labels.amountLabel} data-key={step.key} data-name="amount" value={step.amount} step="1" onchange={handleInput}></lightning-input>
                        <lightning-combobox label={labels.unitLabel} data-key={step.key} data-name="unit" value={step.unit} options={unitOptions} onchange={handleInput}></lightning-combobox>
                    </template>
                    <template lwc:if={step.isToday}>
                        <lightning-input type="checkbox" label={labels.whenBlankLabel} data-key={step.key} data-name="whenBlank" checked={step.whenBlank} onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:if={step.isDigits}>
                        <lightning-input type="text" label={labels.patternLabel} data-key={step.key} data-name="pattern" data-id="pattern" value={step.pattern} maxlength="30" onchange={handleInput}></lightning-input>
                        <lightning-input type="text" label={labels.countryLabel} data-key={step.key} data-name="country" data-id="country" value={step.country} maxlength="3" onchange={handleInput}></lightning-input>
                    </template>
                </div>
                <div class="slds-col slds-grow-none slds-align-bottom">
                    <lightning-button-group>
                        <lightning-button-icon
                            icon-name="utility:arrowup"
                            alternative-text={step.moveUpText}
                            title={labels.moveUpLabel}
                            data-index={step.index}
                            data-id="move-up"
                            disabled={step.isFirst}
                            onclick={handleMoveUp}
                        ></lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:arrowdown"
                            alternative-text={step.moveDownText}
                            title={labels.moveDownLabel}
                            data-index={step.index}
                            data-id="move-down"
                            disabled={step.isLast}
                            onclick={handleMoveDown}
                        ></lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:delete"
                            alternative-text={labels.removeLabel}
                            title={labels.removeLabel}
                            data-key={step.key}
                            data-id="remove"
                            onclick={handleRemove}
                        ></lightning-button-icon>
                    </lightning-button-group>
                </div>
            </div>
        </template>
        <lightning-button label={labels.addLabel} data-id="add" disabled={cannotAdd} onclick={handleAdd}></lightning-button>
        <div class="slds-assistive-text" aria-live="polite" data-id="announce">{announcement}</div>
        <template lwc:if={hasProblems}>
            <c-barn-notice
                class="slds-var-m-top_x-small"
                variant="error"
                message={problemText}
                data-id="problems"
            ></c-barn-notice>
        </template>
        <template lwc:if={hasSamples}>
            <h4 class="slds-text-title_bold slds-var-m-top_small">{labels.previewHeading}</h4>
            <table
                class="slds-table slds-table_bordered slds-table_fixed-layout slds-table_cell-buffer slds-max-medium-table_stacked slds-var-m-top_xx-small"
                aria-label={labels.previewHeading}
            >
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col" class="slds-cell-wrap slds-size_2-of-12">{labels.rowNumberHeader}</th>
                        <th scope="col" class="slds-cell-wrap slds-size_5-of-12">{labels.beforeHeader}</th>
                        <th scope="col" class="slds-cell-wrap slds-size_5-of-12">{labels.afterHeader}</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={samples} for:item="sample">
                        <tr key={sample.key} data-id="sample">
                            <td class="slds-cell-wrap" data-label={labels.rowNumberHeader}>{sample.rowNumber}</td>
                            <td class="slds-cell-wrap" data-label={labels.beforeHeader}>{sample.before}</td>
                            <td class="slds-cell-wrap" data-label={labels.afterHeader}>{sample.after}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template lwc:if={standalone}>
            <lightning-button
                class="slds-var-m-top_small"
                variant="brand"
                label={labels.doneLabel}
                data-id="done"
                onclick={handleDone}
            ></lightning-button>
        </template>
    </div>
    </template>
</template>
