<template>
  <lightning-modal-header label={label}></lightning-modal-header>
  <lightning-modal-body>
    <template lwc:if={errorMessage}>
      <p class="slds-text-color_error slds-var-m-bottom_small" data-id="error" role="alert">
        {errorMessage}
      </p>
    </template>
    <lightning-input
      data-id="form-name"
      label={labels.name}
      value={form.label}
      max-length="40"
      required
      onchange={handleNameChange}
    ></lightning-input>
    <div class="slds-grid slds-grid_vertical-align-end">
      <lightning-input
        class="slds-col"
        data-id="form-object"
        data-field="Object_Name__c"
        label={labels.object}
        value={form.values.Object_Name__c}
        required
        onchange={handleFieldChange}
      ></lightning-input>
      <lightning-button
        class="slds-var-m-left_x-small"
        data-id="find-fields"
        label={labels.findFields}
        onclick={handleFindFields}
      ></lightning-button>
    </div>
    <lightning-combobox
      data-id="form-value"
      data-field="Value_Field__c"
      label={labels.valueField}
      value={form.values.Value_Field__c}
      options={valueFieldOptions}
      required
      onchange={handleFieldChange}
    ></lightning-combobox>
    <lightning-combobox
      data-id="form-parent"
      data-field="Parent_Field__c"
      label={labels.parentField}
      value={form.values.Parent_Field__c}
      options={parentFieldOptions}
      required
      onchange={handleFieldChange}
    ></lightning-combobox>
    <lightning-combobox
      data-id="form-normalization"
      data-field="Normalization__c"
      label={labels.compare}
      value={form.values.Normalization__c}
      options={normalizations}
      required
      onchange={handleFieldChange}
    ></lightning-combobox>
    <template lwc:if={isAddress}>
      <lightning-combobox
        data-id="form-postal"
        data-field="Postal_Code_Field__c"
        label={labels.postalField}
        value={form.values.Postal_Code_Field__c}
        options={postalFieldOptions}
        required
        onchange={handleFieldChange}
      ></lightning-combobox>
    </template>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button label={labels.cancel} data-id="form-cancel" onclick={handleCancel}></lightning-button>
    <lightning-button
      class="slds-var-m-left_x-small"
      data-id="form-save"
      variant="brand"
      label={labels.save}
      disabled={busy}
      onclick={handleSave}
    ></lightning-button>
  </lightning-modal-footer>
</template>
