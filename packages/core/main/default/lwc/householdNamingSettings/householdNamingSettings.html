<template>
    <lightning-card title={label.title} icon-name="standard:household">
        <div class="slds-var-m-around_medium">
            <template if:true={isReadOnly}>
                <div class="slds-box slds-box_x-small slds-text-color_weak slds-var-m-bottom_small">
                    {label.readOnly}
                </div>
            </template>

            <template if:true={isSaving}>
                <lightning-spinner
                    alternative-text={label.saving}
                    size="small"
                    class="saving-spinner"
                ></lightning-spinner>
            </template>

            <p class="slds-text-body_small slds-var-m-bottom_small">{label.tokenHelp}</p>

            <lightning-input
                label={label.nameLabel}
                value={namePattern}
                disabled={isReadOnly}
                onchange={handleNameChange}
            ></lightning-input>
            <lightning-input
                label={label.formalLabel}
                value={formalPattern}
                disabled={isReadOnly}
                onchange={handleFormalChange}
            ></lightning-input>
            <lightning-input
                label={label.informalLabel}
                value={informalPattern}
                disabled={isReadOnly}
                onchange={handleInformalChange}
            ></lightning-input>

            <h2 class="slds-text-heading_small slds-var-m-top_medium">{label.previewHeading}</h2>
            <template if:true={hasSamples}>
                <table
                    class="slds-table slds-table_bordered slds-table_fixed-layout slds-var-m-top_x-small"
                    aria-label={label.previewHeading}
                >
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" class="slds-cell-wrap slds-size_3-of-12">{label.columnMembers}</th>
                            <th scope="col" class="slds-cell-wrap slds-size_3-of-12">{label.columnName}</th>
                            <th scope="col" class="slds-cell-wrap slds-size_3-of-12">{label.columnFormal}</th>
                            <th scope="col" class="slds-cell-wrap slds-size_3-of-12">{label.columnInformal}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={samples} for:item="sample">
                            <tr key={sample.key} class="sample-row">
                                <td class="slds-cell-wrap">{sample.members}</td>
                                <td class="slds-cell-wrap">{sample.name}</td>
                                <td class="slds-cell-wrap">{sample.formalGreeting}</td>
                                <td class="slds-cell-wrap">{sample.informalGreeting}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-var-m-top_small" role="alert">{errorMessage}</div>
            </template>

            <div class="slds-var-m-top_medium">
                <lightning-button
                    variant="brand"
                    label={label.save}
                    disabled={isSaveDisabled}
                    onclick={handleSave}
                    class="slds-var-m-right_x-small save-button"
                ></lightning-button>
                <lightning-button
                    label={label.recompute}
                    disabled={isReadOnly}
                    onclick={handleRecomputeClick}
                    class="recompute-button"
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
