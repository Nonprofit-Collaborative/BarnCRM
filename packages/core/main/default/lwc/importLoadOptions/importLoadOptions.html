<template>
    <template lwc:if={helpReady}>
    <lightning-combobox
        data-id="operation"
        label={labels.operationLabel}
        value={operation}
        options={operationOptions}
        onchange={handleOperationChange}
    ></lightning-combobox>
    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="operation-help">{operationHelp}</p>
    <template lwc:if={usesMatchField}>
        <template lwc:if={hasKeyFields}>
            <lightning-combobox
                data-id="match-field"
                label={labels.matchFieldLabel}
                value={matchField}
                options={keyFieldOptions}
                required
                onchange={handleMatchFieldChange}
            ></lightning-combobox>
        </template>
        <template lwc:else>
            <c-barn-notice
                class="slds-show slds-var-m-top_x-small"
                variant="error"
                message={noFieldsText}
                data-id="no-key-fields"
            ></c-barn-notice>
        </template>
    </template>
    <template lwc:if={readsLookups}>
        <lightning-radio-group
            class="slds-var-m-top_small"
            data-id="not-found"
            name="lookup-not-found"
            label={labels.notFoundLabel}
            value={lookupNotFound}
            options={notFoundOptions}
            onchange={handleNotFoundChange}
        ></lightning-radio-group>
        <p class="slds-text-body_small slds-var-m-top_x-small" data-id="not-found-help">{notFoundHelp}</p>
    </template>
    <template lwc:if={offersRelated}>
        <lightning-combobox
            class="slds-var-m-top_small"
            data-id="related"
            label={labels.relatedLabel}
            value={related}
            options={relatedChoices}
            onchange={handleRelatedChange}
        ></lightning-combobox>
        <p class="slds-text-body_small slds-var-m-top_x-small" data-id="related-help">{labels.relatedHelp}</p>
    </template>
    <template lwc:if={explainsRelatedInsert}>
        <p class="slds-text-body_small slds-var-m-top_small" data-id="related-insert-help">{labels.relatedInsertHelp}</p>
    </template>
    </template>
</template>
