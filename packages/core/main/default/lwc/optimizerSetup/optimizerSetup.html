<template>
    <div>
        <div class="slds-grid slds-grid_vertical-align-center slds-var-m-bottom_small">
            <h2 class="slds-text-heading_medium">{labels.title}</h2>
            <lightning-button
                class="slds-col_bump-left"
                label={labels.refresh}
                onclick={handleRefresh}
                data-id="refresh"
            ></lightning-button>
        </div>
        <div class="slds-is-relative">
            <template lwc:if={loading}>
                <lightning-spinner alternative-text={labels.refresh} size="small"></lightning-spinner>
            </template>
            <template lwc:if={errorMessage}>
                <p role="alert" class="slds-text-color_error" data-id="error">{errorMessage}</p>
            </template>
            <p class="slds-text-body_small slds-var-m-bottom_small">{labels.intro}</p>
            <ul class="slds-has-dividers_bottom-space" data-id="findings">
                <template for:each={findings} for:item="finding">
                    <li key={finding.key} class="slds-item" data-id={finding.key}>
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <div class="slds-col">
                                <p>{finding.title}</p>
                                <template lwc:if={finding.hasExamples}>
                                    <p class="slds-text-body_small slds-text-color_weak" data-id="examples">{finding.examplesText}</p>
                                </template>
                            </div>
                            <span class={finding.countClass} data-id="count">{finding.countText}</span>
                            <a
                                class="slds-var-m-left_medium"
                                href={finding.setupUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                data-id="setup-link"
                            >
                                <span>{labels.openInSetup}</span>
                                <lightning-icon
                                    class="slds-var-m-left_xx-small"
                                    icon-name="utility:new_window"
                                    size="xx-small"
                                ></lightning-icon>
                                <span class="slds-assistive-text">{labels.newTab}</span>
                            </a>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </div>
</template>
