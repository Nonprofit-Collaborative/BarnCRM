<template>
    <lightning-card title={labels.heading} icon-name="standard:apps">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={errorMessage}>
                <c-barn-notice variant="error" message={errorMessage} data-id="load-error"></c-barn-notice>
            </template>
            <template lwc:else>
                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={rows} for:item="row">
                        <li key={row.name} class="slds-item" data-id="module-row">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-avatar
                                        class="slds-var-m-right_x-small"
                                        size="small"
                                        src={row.logoUrl}
                                        fallback-icon-name="standard:apps"
                                        alternative-text=""
                                        data-id="module-logo"
                                    ></lightning-avatar>
                                    <span data-id="module-name">{row.displayName}</span>
                                </div>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <c-barn-status-badge
                                        status={row.status}
                                        label={row.statusText}
                                        data-id="module-status"
                                    ></c-barn-status-badge>
                                    <template lwc:if={row.appUrl}>
                                        <lightning-button
                                            class="slds-var-m-left_small"
                                            variant="base"
                                            label={labels.openApp}
                                            aria-label={row.openAppLabel}
                                            data-id="open-app"
                                            data-url={row.appUrl}
                                            onclick={handleOpenApp}
                                        ></lightning-button>
                                    </template>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <lightning-button
                variant="base"
                label={labels.link}
                data-id="open-manager"
                onclick={handleOpenManager}
            ></lightning-button>
        </div>
    </lightning-card>
</template>
