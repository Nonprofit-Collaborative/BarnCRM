<template>
  <c-barn-page-shell icon-name="standard:merge" title={labels.title} purpose={labels.intro} title-hidden>
    <template lwc:if={hasAnyArea}>
      <lightning-tabset active-tab-value={activeArea}>
        <template lwc:if={canSeeReview}>
          <lightning-tab label={labels.review} value="review" onactive={handleActive} data-id="tab-review">
            <template lwc:if={reviewOpened}>
              <c-duplicate-review></c-duplicate-review>
            </template>
          </lightning-tab>
        </template>
        <template lwc:if={canSeeMatchingLogic}>
          <lightning-tab
            label={labels.matchingLogic}
            value="matchingLogic"
            onactive={handleActive}
            data-id="tab-matchingLogic"
          >
            <template lwc:if={matchingLogicOpened}>
              <c-match-source-manager></c-match-source-manager>
            </template>
          </lightning-tab>
        </template>
      </lightning-tabset>
    </template>
    <template lwc:else>
      <p class="slds-var-p-bottom_medium" data-id="no-access" role="status">{labels.noAccess}</p>
    </template>
  </c-barn-page-shell>
</template>
