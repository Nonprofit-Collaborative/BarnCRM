<template>
    <template lwc:if={shown}>
        <template lwc:if={showAssistant}>
            <lightning-card title={labels.checklistHeading} icon-name="standard:task">
                <div class="slds-var-p-horizontal_medium">
                    <c-setup-assistant
                        reopened={setupReopened}
                        onsetupchanged={handleSetupChanged}
                    ></c-setup-assistant>
                </div>
            </lightning-card>
        </template>
        <template lwc:else>
            <lightning-card title={labels.setupCompleteHeading} icon-name="standard:task">
                <div class="slds-var-p-horizontal_medium">
                    <c-barn-meter
                        label={labels.checklistHeading}
                        value={stepsCompleted}
                        max={stepsTotal}
                        value-text={setupProgressText}
                        size="small"
                        data-id="setup-progress"
                    ></c-barn-meter>
                    <lightning-button
                        class="slds-var-m-top_x-small"
                        label={labels.reopenSetup}
                        data-id="reopen-setup"
                        onclick={handleReopenSetup}
                    ></lightning-button>
                </div>
            </lightning-card>
        </template>
    </template>
</template>
