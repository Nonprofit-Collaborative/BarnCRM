<template>
    <div class={containerClass} role={role} data-id="notice">
        <div class="slds-media__figure">
            <lightning-icon
                icon-name={iconName}
                variant={iconVariant}
                size="small"
                alternative-text={alternativeText}
                data-id="icon"
            ></lightning-icon>
        </div>
        <div class="slds-media__body">
            <template lwc:if={title}>
                <p class="slds-text-title_bold" data-id="title">{title}</p>
            </template>
            <template lwc:if={message}>
                <p data-id="message">{message}</p>
            </template>
            <slot></slot>
            <template lwc:if={hasAction}>
                <p class="slds-var-m-top_xx-small">
                    <template lwc:if={hasActionHref}>
                        <a class="notice__action" href={actionHref} data-id="action">{actionLabel}</a>
                    </template>
                    <template lwc:else>
                        <button type="button" class="notice__action" onclick={handleAction} data-id="action">
                            {actionLabel}
                        </button>
                    </template>
                </p>
            </template>
        </div>
    </div>
</template>
