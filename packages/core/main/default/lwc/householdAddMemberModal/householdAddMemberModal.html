<template>
    <lightning-modal-header label={label}></lightning-modal-header>
    <lightning-modal-body>
        <div class="slds-is-relative">
            <template lwc:if={searchMode}>
                <div class="add-existing-section">
                    <h2 class="slds-text-heading_small">{labels.addExistingHeading}</h2>
                    <lightning-input
                        type="search"
                        label={labels.addExistingHeading}
                        variant="label-hidden"
                        placeholder={labels.addExistingPlaceholder}
                        onchange={handleSearchInput}
                        class="slds-var-m-top_x-small add-search-input"
                    ></lightning-input>
                    <template lwc:if={hasSearchResults}>
                        <ul class="slds-var-m-top_x-small search-results">
                            <template for:each={searchResultRows} for:item="person">
                                <li key={person.id} class="slds-item search-result-row">
                                    <lightning-button
                                        variant="base"
                                        label={person.name}
                                        aria-label={person.resultLabel}
                                        title={person.resultLabel}
                                        data-person-id={person.id}
                                        disabled={busy}
                                        onclick={handleAddExisting}
                                        class="add-existing-button"
                                    ></lightning-button>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:if={showNoSearchResults}>
                        <p role="status" class="slds-var-m-top_x-small slds-text-color_weak no-results-message">
                            {labels.addExistingNoResults}
                        </p>
                    </template>
                </div>

                <div class="add-new-section slds-var-m-top_medium">
                    <h2 class="slds-text-heading_small">{labels.addNewHeading}</h2>
                    <lightning-input
                        label={labels.salutation}
                        value={newSalutation}
                        onchange={handleNewSalutationChange}
                        class="slds-var-m-top_x-small add-new-salutation"
                    ></lightning-input>
                    <lightning-input
                        label={labels.firstName}
                        value={newFirstName}
                        onchange={handleNewFirstNameChange}
                        class="slds-var-m-top_x-small add-new-first-name"
                    ></lightning-input>
                    <lightning-input
                        label={labels.lastName}
                        required
                        value={newLastName}
                        onchange={handleNewLastNameChange}
                        class="slds-var-m-top_x-small add-new-last-name"
                    ></lightning-input>
                    <div aria-live="polite" class="same-name-region">
                        <template lwc:if={hasSameName}>
                            <template for:each={sameNameRows} for:item="match">
                                <c-barn-notice
                                    key={match.id}
                                    variant="info"
                                    message={match.message}
                                    action-label={match.useLabel}
                                    data-person-id={match.id}
                                    onaction={handleUseSameName}
                                    class="slds-var-m-top_x-small same-name-hint"
                                ></c-barn-notice>
                            </template>
                        </template>
                    </div>
                    <div class="slds-var-m-top_small">
                        <lightning-button
                            label={labels.cancel}
                            onclick={handleCancel}
                            class="slds-var-m-right_x-small add-cancel-button"
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label={labels.save}
                            disabled={busy}
                            onclick={handleAddNewSave}
                            class="add-new-save-button"
                        ></lightning-button>
                    </div>
                </div>
            </template>
            <template lwc:else>
                <lightning-record-edit-form object-api-name="Contact" onsuccess={handleFormSuccess}>
                    <lightning-messages></lightning-messages>
                    <lightning-input-field field-name="Salutation"></lightning-input-field>
                    <lightning-input-field
                        field-name="FirstName"
                        onchange={handleNewFirstNameChange}
                        class="form-first-name"
                    ></lightning-input-field>
                    <lightning-input-field
                        field-name="LastName"
                        onchange={handleNewLastNameChange}
                        class="form-last-name"
                    ></lightning-input-field>
                    <div aria-live="polite" class="same-name-region">
                        <template lwc:if={hasSameName}>
                            <template for:each={sameNameRows} for:item="match">
                                <c-barn-notice
                                    key={match.id}
                                    variant="info"
                                    message={match.message}
                                    action-label={match.useLabel}
                                    data-person-id={match.id}
                                    onaction={handleUseSameName}
                                    class="slds-var-m-vertical_x-small same-name-hint"
                                ></c-barn-notice>
                            </template>
                        </template>
                    </div>
                    <template lwc:if={personMode}>
                        <lightning-input-field field-name="Email"></lightning-input-field>
                        <lightning-input-field field-name="MailingStreet"></lightning-input-field>
                        <lightning-input-field field-name="MailingCity"></lightning-input-field>
                        <lightning-input-field field-name="MailingPostalCode"></lightning-input-field>
                    </template>
                    <template lwc:else>
                        <div class="slds-hide">
                            <lightning-input-field field-name="AccountId" value={householdId}></lightning-input-field>
                        </div>
                    </template>
                    <div class="slds-var-m-top_small">
                        <lightning-button
                            label={labels.cancel}
                            onclick={handleCancel}
                            class="slds-var-m-right_x-small add-cancel-button"
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            type="submit"
                            label={labels.save}
                            class="add-save-button"
                        ></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </template>

            <template lwc:if={errorMessage}>
                <c-barn-notice
                    variant="error"
                    message={errorMessage}
                    class="slds-var-m-top_small add-error"
                ></c-barn-notice>
            </template>
        </div>
    </lightning-modal-body>
</template>
