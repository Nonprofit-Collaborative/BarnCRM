<template>
    <template lwc:if={helpReady}>
    <template lwc:if={hasError}>
        <c-barn-notice
            class="slds-var-m-vertical_small"
            variant="error"
            message={errorMessage}
            data-id="error-message"
        ></c-barn-notice>
    </template>
    <template lwc:if={job}>
        <div class="slds-var-m-vertical_small" role="status" aria-live="polite" data-id="export-files-status">
            <template lwc:if={showMeter}>
                <c-barn-meter
                    data-id="export-meter"
                    label={labels.meterLabel}
                    value={progressValue}
                    value-text={statusLine}
                ></c-barn-meter>
            </template>
            <template lwc:else>
                <c-barn-notice variant={noticeVariant} message={statusLine} data-id="status-notice">
                    <template lwc:if={hasFiles}>
                        <p class="slds-var-m-top_x-small">{labels.files}</p>
                        <ul class="slds-list_dotted">
                            <template for:each={files} for:item="file">
                                <li key={file.documentId} data-id="file">
                                    <a href={file.url} target="_blank" rel="noopener noreferrer"
                                        >{file.title}<lightning-icon class="slds-var-m-left_xx-small" icon-name="utility:new_window" size="xx-small"></lightning-icon
                                        ><span class="slds-assistive-text">{labels.newTab}</span></a
                                    >
                                </li>
                            </template>
                        </ul>
                    </template>
                </c-barn-notice>
            </template>
        </div>
    </template>
    </template>
</template>
