<template>
    <template lwc:if={shown}>
        <lightning-card title={labels.heading} icon-name="standard:metrics" data-id="rollups-card">
            <div class="slds-var-p-horizontal_medium">
                <template lwc:if={errorMessage}>
                    <p class="slds-text-color_error" data-id="load-error" role="alert">{errorMessage}</p>
                </template>
                <template lwc:elseif={lastCalculated}>
                    <p data-id="rollups-last-calculated">
                        <lightning-formatted-date-time
                            value={lastCalculated}
                            year="numeric"
                            month="short"
                            day="2-digit"
                            hour="2-digit"
                            minute="2-digit"
                        ></lightning-formatted-date-time>
                    </p>
                </template>
                <template lwc:elseif={loaded}>
                    <c-barn-empty-state
                        data-id="rollups-never"
                        illustration="setup"
                        size="small"
                        heading={labels.notRun}
                        message={labels.never}
                    ></c-barn-empty-state>
                </template>
                <template lwc:if={stale}>
                    <lightning-badge
                        class="slds-theme_warning"
                        label={labels.overdue}
                        data-id="rollups-overdue"
                    ></lightning-badge>
                    <p data-id="rollups-stale" role="status" aria-live="polite">
                        <lightning-icon
                            icon-name="utility:warning"
                            size="x-small"
                            alternative-text={labels.warning}
                        ></lightning-icon>
                        {labels.stale}
                    </p>
                </template>
                <lightning-button
                    variant="base"
                    label={labels.link}
                    data-id="open-rollups"
                    onclick={handleOpenRollups}
                ></lightning-button>
            </div>
        </lightning-card>
    </template>
</template>
