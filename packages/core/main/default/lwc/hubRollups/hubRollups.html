<template>
    <template lwc:if={helpReady}>
    <template lwc:if={shown}>
        <lightning-card title={labels.heading} icon-name="standard:metrics" data-id="rollups-card">
            <div class="slds-var-p-horizontal_medium">
                <template lwc:if={errorMessage}>
                    <c-barn-notice variant="error" message={errorMessage} data-id="load-error"></c-barn-notice>
                </template>
                <template lwc:elseif={lastCalculated}>
                    <p class="slds-var-m-bottom_x-small" data-id="rollups-last-calculated">
                        <lightning-formatted-date-time
                            value={lastCalculated}
                            year="numeric"
                            month="short"
                            day="2-digit"
                            hour="2-digit"
                            minute="2-digit"
                        ></lightning-formatted-date-time>
                    </p>
                </template>
                <template lwc:elseif={loaded}>
                    <c-barn-empty-state
                        data-id="rollups-never"
                        illustration="setup"
                        size="small"
                        heading={labels.notRun}
                        message={labels.never}
                    ></c-barn-empty-state>
                </template>
                <template lwc:if={stale}>
                    <c-barn-status-badge
                        status="overdue"
                        label={labels.overdue}
                        data-id="rollups-overdue"
                    ></c-barn-status-badge>
                    <c-barn-notice
                        variant="warning"
                        message={labels.stale}
                        data-id="rollups-stale"
                        class="slds-var-m-vertical_x-small"
                    ></c-barn-notice>
                </template>
                <lightning-button
                    variant="base"
                    label={labels.link}
                    data-id="open-rollups"
                    onclick={handleOpenRollups}
                ></lightning-button>
            </div>
        </lightning-card>
    </template>
    </template>
</template>
