<template>
    <template lwc:if={helpReady}>
  <lightning-card title={labels.panelTitle} icon-name={icons.relationship}>
    <template lwc:if={canAdd}>
      <lightning-button
        slot="actions"
        label={labels.addButton}
        onclick={handleAdd}
        data-id="add-relationship"
      ></lightning-button>
    </template>

    <div class="slds-var-p-horizontal_medium slds-is-relative">
      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <c-barn-notice
          class="slds-var-m-bottom_small"
          variant="error"
          message={errorMessage}
          data-id="error"
        ></c-barn-notice>
      </template>

      <template lwc:if={isEmpty}>
        <c-barn-empty-state heading={labels.emptyHeading} message={labels.emptyMessage} data-id="empty">
          <template lwc:if={canAdd}>
            <lightning-button label={labels.addButton} onclick={handleAdd} data-id="empty-add"></lightning-button>
          </template>
        </c-barn-empty-state>
      </template>

      <template lwc:if={hasRelationships}>
        <ul class="slds-has-dividers_bottom-space" data-id="relationship-list">
          <template for:each={rows} for:item="relationship">
            <li key={relationship.id} class={relationship.rowClass} data-id="relationship-card">
              <div class="slds-media slds-media_center slds-media_small">
                <div class="slds-media__figure" aria-hidden="true">
                  <lightning-avatar
                    variant="circle"
                    size="small"
                    initials={relationship.initials}
                    fallback-icon-name="standard:avatar"
                  ></lightning-avatar>
                </div>
                <div class="slds-media__body">
                  <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                    <h3 class="slds-text-heading_small slds-var-m-right_x-small">
                      <a
                        href={relationship.href}
                        data-record-id={relationship.id}
                        onclick={handleOpenRecord}
                        data-id="related-person"
                      >{relationship.relatedPersonName}</a>
                    </h3>
                    <template lwc:if={relationship.isFormer}>
                      <c-barn-status-badge
                        status="former"
                        label={labels.formerBadge}
                        data-id="former-badge"
                      ></c-barn-status-badge>
                    </template>
                  </div>
                  <template lwc:if={relationship.relationshipType}>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="relationship-type">{relationship.relationshipType}</p>
                  </template>
                  <template lwc:if={relationship.description}>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="relationship-description">
                      {relationship.description}
                    </p>
                  </template>
                </div>
                <template lwc:if={relationship.hasActions}>
                  <div class="slds-media__figure slds-media__figure_reverse">
                    <lightning-button-menu
                      alternative-text={relationship.actionsLabel}
                      title={relationship.actionsLabel}
                      icon-size="small"
                      menu-alignment="auto"
                      data-record-id={relationship.id}
                      disabled={busy}
                      onselect={handleRowAction}
                      class="row-menu"
                    >
                      <template lwc:if={canEdit}>
                        <lightning-menu-item
                          value="edit"
                          label={labels.editAction}
                          class="edit-relationship"
                        ></lightning-menu-item>
                      </template>
                      <template lwc:if={relationship.canEnd}>
                        <lightning-menu-item
                          value="end"
                          label={labels.endAction}
                          class="end-relationship"
                        ></lightning-menu-item>
                      </template>
                      <template lwc:if={canRemove}>
                        <lightning-menu-item
                          value="remove"
                          label={labels.removeButton}
                          class="remove-relationship"
                        ></lightning-menu-item>
                      </template>
                    </lightning-button-menu>
                  </div>
                </template>
              </div>
            </li>
          </template>
        </ul>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-box slds-var-m-top_small" data-id="add-form">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addFormTitle}</h3>
          <lightning-record-edit-form
            object-api-name={relationshipObject}
            onsubmit={handleFormSubmit}
            onsuccess={handleFormSuccess}
            onerror={handleFormError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name={personFieldName}
              value={recordId}
              variant="label-hidden"
            ></lightning-input-field>
            <lightning-input-field field-name={relatedPersonFieldName}></lightning-input-field>
            <lightning-combobox
              class="slds-form-element_stacked"
              label={typeLabel}
              value={typeValue}
              options={typeOptions}
              required
              data-id="type"
              onchange={handleTypeChange}
            ></lightning-combobox>
            <template for:each={formFields} for:item="fieldName">
              <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
            </template>
            <div class="slds-var-m-top_small">
              <lightning-button
                variant="neutral"
                label={labels.cancelButton}
                onclick={handleCancel}
                data-id="cancel"
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="brand"
                type="submit"
                label={labels.addButton}
                data-id="save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </template>
    </div>
  </lightning-card>
    </template>
</template>
