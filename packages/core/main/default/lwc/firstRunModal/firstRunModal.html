<template>
    <template lwc:if={helpReady}>
    <lightning-modal-header label={labels.title}></lightning-modal-header>
    <lightning-modal-body>
        <template lwc:if={canFinish}>
            <p class="slds-var-m-bottom_medium">{labels.intro}</p>
            <c-barn-visual-picker
                label={labels.editionQuestion}
                options={editionOptions}
                value={edition}
                data-id="edition"
                onchange={handleEdition}
            ></c-barn-visual-picker>
            <lightning-radio-group
                class="slds-var-m-top_medium"
                name="mode"
                label={labels.featuresQuestion}
                options={modeOptions}
                value={mode}
                data-id="mode"
                onchange={handleMode}
            ></lightning-radio-group>
            <!-- The default features by name, one plain line each (admin-15), so the first
                 choice says what it turns on. -->
            <template lwc:if={isAll}>
                <ul class="slds-has-dividers_bottom-space slds-var-m-top_small" data-id="all-features">
                    <template for:each={features} for:item="feature">
                        <li key={feature.key} class="slds-item" data-id="all-feature">
                            <p class="slds-text-title_bold">{feature.name}</p>
                            <p class="slds-text-body_small slds-text-color_weak">{feature.description}</p>
                        </li>
                    </template>
                </ul>
            </template>
            <c-barn-notice
                class="slds-var-m-top_small"
                variant="warning"
                message={labels.staysOn}
                data-id="stays-on"
            ></c-barn-notice>
            <template lwc:if={isChoosing}>
                <p class="slds-text-body_small slds-var-m-vertical_small" data-id="choose-help">
                    {labels.chooseHelp}
                </p>
                <template for:each={features} for:item="feature">
                    <lightning-input
                        key={feature.key}
                        type="checkbox"
                        label={feature.name}
                        field-level-help={feature.description}
                        checked={feature.checked}
                        disabled={feature.disabled}
                        data-id="feature"
                        data-key={feature.key}
                        onchange={handleFeature}
                    ></lightning-input>
                </template>
            </template>
            <p class="slds-text-body_small slds-var-m-top_medium">{labels.modulesNote}</p>
        </template>
        <template lwc:else>
            <p role="status" data-id="admin-needed">{labels.adminNeeded}</p>
        </template>
        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error slds-var-m-top_small" role="alert" data-id="error">
                {errorMessage}
            </p>
        </template>
    </lightning-modal-body>
    <template lwc:if={canFinish}>
        <lightning-modal-footer>
            <lightning-button
                variant="brand"
                label={labels.finish}
                disabled={finishDisabled}
                data-id="finish"
                onclick={handleFinish}
            ></lightning-button>
        </lightning-modal-footer>
    </template>
    <template lwc:else>
        <!-- Someone who cannot finish setup is never trapped: they read why and close. -->
        <lightning-modal-footer>
            <lightning-button
                label={labels.close}
                data-id="close"
                onclick={handleClose}
            ></lightning-button>
        </lightning-modal-footer>
    </template>
    </template>
</template>
