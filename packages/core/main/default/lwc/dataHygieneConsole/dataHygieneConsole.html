<template>
    <template lwc:if={helpReady}>
  <div class="slds-is-relative">
    <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-var-m-bottom_xx-small">
      <h2 class="slds-text-heading_medium slds-var-m-right_x-small">{labels.pageTitle}</h2>
      <c-barn-help content={labels.healthCheckNote} data-id="help"></c-barn-help>
      <lightning-button
        class="slds-col_bump-left"
        label={labels.recount}
        onclick={handleRecount}
        disabled={busy}
        data-id="recount"
      ></lightning-button>
    </div>
    <div>
      <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">{labels.intro}</p>
      <template lwc:if={errorMessage}>
        <c-barn-notice
          class="slds-var-m-bottom_small"
          variant="error"
          message={errorMessage}
          data-id="error"
        ></c-barn-notice>
      </template>
      <template lwc:if={busy}>
        <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
      </template>
      <ul class="slds-has-dividers_bottom-space" aria-busy={ariaBusy}>
        <template for:each={rows} for:item="check">
          <li key={check.key} class="slds-item" data-key={check.key}>
            <section aria-labelledby={check.headingId}>
              <lightning-layout multiple-rows vertical-align="center">
                <lightning-layout-item size="12" medium-device-size="7" padding="around-small">
                  <h3 class="slds-text-heading_small" id={check.headingId}>{check.title}</h3>
                  <p>{check.description}</p>
                  <template lwc:if={check.note}>
                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small" data-id="note">
                      {check.note}
                    </p>
                  </template>
                  <template lwc:if={check.errorMessage}>
                    <c-barn-notice
                      class="slds-var-m-top_xx-small"
                      variant="error"
                      message={check.errorMessage}
                      data-id="check-error"
                    ></c-barn-notice>
                  </template>
                </lightning-layout-item>
                <lightning-layout-item size="6" medium-device-size="3" padding="around-small">
                  <template lwc:if={check.hasCount}>
                    <c-barn-stat-tile
                      label={labels.recordsFound}
                      value={check.countLabel}
                      badge-label={check.badgeLabel}
                      badge-variant={check.badgeStatus}
                      align="start"
                      data-id="count"
                    ></c-barn-stat-tile>
                  </template>
                </lightning-layout-item>
                <lightning-layout-item size="6" medium-device-size="2" padding="around-small">
                  <template lwc:if={check.canOpenInFind}>
                    <lightning-button
                      label={labels.openInFind}
                      data-key={check.key}
                      data-id="open"
                      onclick={handleOpen}
                      disabled={busy}
                    ></lightning-button>
                  </template>
                </lightning-layout-item>
              </lightning-layout>
            </section>
          </li>
        </template>
      </ul>
    </div>
  </div>
    </template>
</template>
