<template>
    <template lwc:if={helpReady}>
    <lightning-card title={labels.cardTitle} icon-name="standard:dataset">
        <span slot="actions">
            <c-barn-status-badge status={statusTone} label={statusLabel} data-id="status"></c-barn-status-badge>
        </span>

        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <c-barn-notice
                class="slds-var-m-bottom_small"
                variant="warning"
                message={labels.productionWarning}
                data-id="production-warning"
            ></c-barn-notice>

            <template if:true={isLoadingStatus}>
                <lightning-spinner
                    alternative-text={labels.loadingAltText}
                    size="small"
                ></lightning-spinner>
            </template>

            <template if:false={isLoadingStatus}>
                <template if:true={statusFailed}>
                    <p class="slds-text-color_weak slds-var-m-bottom_small" data-id="status-error" role="status">
                        {labels.statusError}
                    </p>
                </template>
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-bottom_medium">
                    <template for:each={tiles} for:item="tile">
                        <div key={tile.key} class="slds-col slds-size_1-of-3 slds-var-m-bottom_x-small">
                            <c-barn-stat-tile
                                label={tile.label}
                                value={tile.value}
                                bordered
                                align="start"
                                data-id="tile"
                            ></c-barn-stat-tile>
                        </div>
                    </template>
                </div>

                <template if:true={junctionMembership}>
                    <p
                        class="slds-text-color_weak slds-var-m-bottom_small"
                        data-id="junction-mode-note"
                    >
                        {labels.junctionModeNote}
                    </p>
                </template>

                <template if:false={canManage}>
                    <p class="slds-text-color_weak" data-id="read-only">{labels.readOnlyMessage}</p>
                </template>

                <template if:true={canManage}>
                    <lightning-button
                        variant="brand"
                        label={labels.loadButtonLabel}
                        onclick={handleLoadClick}
                        disabled={loadDisabled}
                        class="slds-var-m-right_small"
                    ></lightning-button>
                    <lightning-button
                        variant="destructive"
                        label={labels.removeButtonLabel}
                        onclick={handleRemoveClick}
                        disabled={removeDisabled}
                    ></lightning-button>
                </template>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
