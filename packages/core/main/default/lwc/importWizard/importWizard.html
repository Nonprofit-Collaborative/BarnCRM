<template>
    <c-barn-page-shell title={labels.cardTitle} title-hidden data-id="shell">
        <div>
            <template lwc:if={loading}>
                <lightning-spinner
                    alternative-text={labels.loadingAltText}
                    size="small"
                ></lightning-spinner>
            </template>

            <template lwc:if={hasMessage}>
                <div class="slds-box slds-theme_warning slds-var-m-bottom_small" role="alert">
                    <p data-id="message">{message}</p>
                </div>
            </template>

            <template lwc:if={showWizard}>
                <c-barn-step-flow
                    steps={stepPath}
                    current-step={currentStepValue}
                    can-go-back={canGoBack}
                    data-id="flow"
                    onback={handleBack}
                >
                <template lwc:if={isStepTemplate}>
                    <c-barn-visual-picker
                        label={labels.stepKind}
                        options={kindOptions}
                        value={importKind}
                        data-id="kind-picker"
                        onchange={handleKindChoice}
                    ></c-barn-visual-picker>
                    <template lwc:if={showTemplateNext}>
                        <h3 class="slds-text-heading_small slds-var-m-vertical_small" data-id="kind-title">
                            {kindTitle}
                        </h3>
                        <template lwc:if={picksFromKind}>
                            <lightning-combobox
                                data-id="template"
                                label={labels.stepTemplate}
                                value={templateId}
                                options={templateOptions}
                                onchange={handleTemplateChange}
                            ></lightning-combobox>
                        </template>
                        <template lwc:if={listsAllTemplates}>
                            <ul class="slds-has-dividers_around-space" data-id="template-list">
                                <template for:each={templateList} for:item="item">
                                    <li key={item.id} class="slds-item" data-id="template-item">
                                        <p class="slds-text-title_bold">{item.name}</p>
                                        <p class="slds-text-body_small">{item.description}</p>
                                        <p class="slds-text-body_small" data-id="template-item-creates">
                                            {item.creates}
                                        </p>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            <template lwc:if={item.lastImportDate}>
                                                {labels.lastLoaded}
                                                <lightning-formatted-date-time
                                                    class="slds-var-m-left_xx-small"
                                                    value={item.lastImportDate}
                                                    time-zone="UTC"
                                                ></lightning-formatted-date-time>
                                            </template>
                                            <template lwc:else>{labels.notLoadedYet}</template>
                                        </p>
                                        <lightning-button
                                            class="slds-var-m-top_x-small"
                                            label={labels.useTemplate}
                                            variant={item.variant}
                                            data-id="use-template"
                                            data-template-id={item.id}
                                            onclick={handleUseTemplate}
                                        ></lightning-button>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:if={hasChosenTemplate}>
                            <p class="slds-text-body_small slds-var-m-top_x-small" data-id="template-help">
                                {templateDescription}
                            </p>
                            <p class="slds-text-body_small slds-var-m-top_x-small" data-id="template-creates">
                                {templateCreates}
                            </p>
                            <template lwc:if={canCopyTemplate}>
                                <template lwc:if={copyingTemplate}>
                                    <lightning-input
                                        data-id="copy-name"
                                        label={labels.copyTemplateNameLabel}
                                        value={copyName}
                                        max-length="80"
                                        onchange={handleCopyNameChange}
                                    ></lightning-input>
                                    <lightning-button
                                        class="slds-var-m-top_x-small"
                                        label={labels.loadObjectCreateButton}
                                        data-id="create-copy"
                                        disabled={cannotCreateCopy}
                                        onclick={handleCreateCopy}
                                    ></lightning-button>
                                </template>
                                <template lwc:else>
                                    <lightning-button
                                        class="slds-var-m-top_x-small"
                                        variant="base"
                                        label={labels.copyTemplateButton}
                                        data-id="start-copy"
                                        onclick={handleStartCopy}
                                    ></lightning-button>
                                </template>
                            </template>
                            <lightning-input
                                class="slds-var-m-top_medium"
                                type="checkbox"
                                data-id="recurring"
                                label={labels.recurringLabel}
                                field-level-help={labels.recurringHelp}
                                checked={isRecurring}
                                onchange={handleRecurringChange}
                            ></lightning-input>
                            <template lwc:if={isRecurring}>
                                <lightning-input
                                    data-id="source-name"
                                    label={labels.sourceNameLabel}
                                    value={sourceName}
                                    required
                                    max-length="255"
                                    onchange={handleSourceNameChange}
                                ></lightning-input>
                            </template>
                        </template>
                    </template>
                    <template lwc:if={choosingObject}>
                        <lightning-input
                            type="file"
                            data-id="detect-file"
                            label={labels.detectFileLabel}
                            accept=".csv,text/csv,.tsv,.txt,text/tab-separated-values,text/plain,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                            onchange={handleDetectFile}
                        ></lightning-input>
                        <template lwc:if={hasDetection}>
                            <p class="slds-text-body_small slds-var-m-vertical_x-small" data-id="detection">
                                {detectionText}
                                <template lwc:if={detectionGuessed}>
                                    <span
                                        class="slds-badge slds-theme_warning slds-var-m-left_x-small"
                                        title={labels.guessBadgeHelp}
                                        data-id="detection-guess"
                                    >
                                        {labels.guessBadge}
                                        <span class="slds-assistive-text">{labels.guessBadgeHelp}</span>
                                    </span>
                                </template>
                            </p>
                            <template lwc:if={hasDetectionSheets}>
                                <p class="slds-text-body_small" data-id="detection-sheets-help">
                                    {labels.detectSheetsDiffer}
                                </p>
                                <ul class="slds-list_dotted slds-text-body_small" data-id="detection-sheets">
                                    <template for:each={detectionSheets} for:item="line">
                                        <li key={line.key}>{line.text}</li>
                                    </template>
                                </ul>
                            </template>
                        </template>
                        <template lwc:if={choosingOneObject}>
                            <lightning-combobox
                                data-id="new-object"
                                label={labels.loadObjectLabel}
                                value={newObjectName}
                                options={objectOptions}
                                onchange={handleNewObjectChange}
                            ></lightning-combobox>
                        </template>
                        <template lwc:if={choosingSeveral}>
                            <lightning-dual-listbox
                                data-id="new-objects"
                                label={labels.severalObjectsLabel}
                                source-label={labels.severalObjectsAvailable}
                                selected-label={labels.severalObjectsLabel}
                                field-level-help={labels.severalObjectsHelp}
                                options={objectOptions}
                                value={newObjectNames}
                                onchange={handleNewObjectsChange}
                            ></lightning-dual-listbox>
                        </template>
                        <lightning-input
                            data-id="new-template-name"
                            label={labels.loadObjectNameLabel}
                            value={newTemplateName}
                            max-length="80"
                            onchange={handleNewTemplateNameChange}
                        ></lightning-input>
                        <template lwc:if={choosingSeveral}>
                            <lightning-button
                                class="slds-var-m-top_x-small"
                                label={labels.loadObjectCreateButton}
                                data-id="create-several-template"
                                disabled={cannotCreateSeveralTemplate}
                                onclick={handleCreateSeveralTemplate}
                            ></lightning-button>
                        </template>
                        <template lwc:else>
                            <lightning-button
                                class="slds-var-m-top_x-small"
                                label={labels.loadObjectCreateButton}
                                data-id="create-object-template"
                                disabled={cannotCreateObjectTemplate}
                                onclick={handleCreateObjectTemplate}
                            ></lightning-button>
                        </template>
                    </template>
                </template>

                <template lwc:if={isStepUpload}>
                    <lightning-input
                        type="file"
                        data-id="file"
                        label={labels.uploadLabel}
                        accept=".csv,text/csv,.tsv,.txt,text/tab-separated-values,text/plain,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                        onchange={handleFileChange}
                    ></lightning-input>
                    <p class="slds-text-body_small slds-var-m-top_x-small">{labels.uploadHint}</p>
                    <template lwc:if={parsing}>
                        <p role="status" class="slds-text-body_small" data-id="parsing">
                            {labels.parsingMessage}
                        </p>
                    </template>
                </template>

                <template lwc:if={isStepColumns}>
                    <template lwc:if={isDelimitedFile}>
                        <lightning-combobox
                            data-id="delimiter"
                            class="slds-var-m-bottom_small"
                            label={labels.delimiterLabel}
                            field-level-help={labels.delimiterHelp}
                            options={delimiterOptions}
                            value={delimiter}
                            disabled={parsing}
                            onchange={handleDelimiterChange}
                        ></lightning-combobox>
                    </template>
                    <template lwc:if={hasSeveralSheets}>
                        <lightning-checkbox-group
                            data-id="sheets"
                            class="slds-var-m-bottom_small"
                            label={labels.sheetLabel}
                            options={sheetOptions}
                            value={chosenSheets}
                            disabled={parsing}
                            onchange={handleSheetChange}
                        ></lightning-checkbox-group>
                        <p class="slds-text-body_small slds-var-m-bottom_small">{labels.sheetHelp}</p>
                    </template>
                    <template lwc:if={hasSheetObjectRows}>
                        <div class="slds-var-m-bottom_small" data-id="sheet-objects">
                            <template for:each={sheetObjectRows} for:item="sheetRow">
                                <lightning-combobox
                                    key={sheetRow.key}
                                    data-id="sheet-object"
                                    data-sheet={sheetRow.sheetName}
                                    label={sheetRow.label}
                                    value={sheetRow.value}
                                    options={sheetRow.options}
                                    disabled={parsing}
                                    onchange={handleSheetObjectChange}
                                ></lightning-combobox>
                            </template>
                            <p class="slds-text-body_small slds-var-m-top_x-small">{labels.sheetObjectHelp}</p>
                        </div>
                    </template>
                    <template lwc:if={hasSheetConflict}>
                        <div class="slds-var-m-bottom_small" role="alert" data-id="sheet-conflict">
                            <p class="slds-text-color_error">{labels.sheetConflict}</p>
                            <ul class="slds-list_dotted">
                                <template for:each={sheetConflictLines} for:item="line">
                                    <li key={line.key}>{line.text}</li>
                                </template>
                            </ul>
                        </div>
                    </template>
                    <template lwc:if={hasGuesses}>
                        <div
                            class="slds-var-m-bottom_small slds-grid slds-grid_vertical-align-center slds-wrap"
                            role="status"
                            data-id="guess-pending"
                        >
                            <p class="slds-var-m-right_small">{guessPendingText}</p>
                            <lightning-button
                                label={labels.guessAcceptAll}
                                data-id="accept-all-guesses"
                                onclick={handleAcceptAllGuesses}
                            ></lightning-button>
                        </div>
                    </template>
                    <div class="slds-scrollable_x">
                        <table
                            class="slds-table slds-table_bordered slds-table_cell-buffer"
                            aria-label={labels.stepColumns}
                            data-id="columns-table"
                        >
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">{labels.columnHeader}</th>
                                    <th scope="col">{labels.targetHeader}</th>
                                    <th scope="col">{labels.sampleHeader}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={columnRows} for:item="column">
                                    <tr key={column.key} data-id="column-row">
                                        <td>{column.source}</td>
                                        <td>
                                            <lightning-combobox
                                                label={labels.targetHeader}
                                                variant="label-hidden"
                                                data-source={column.source}
                                                value={column.target}
                                                options={targetOptions}
                                                onchange={handleTargetChange}
                                            ></lightning-combobox>
                                            <template lwc:if={column.guessed}>
                                                <div class="slds-var-m-top_xx-small" data-id="guess">
                                                    <span
                                                        class="slds-badge slds-theme_warning slds-var-m-right_x-small"
                                                        title={labels.guessBadgeHelp}
                                                    >
                                                        {labels.guessBadge}
                                                        <span class="slds-assistive-text">{labels.guessBadgeHelp}</span>
                                                    </span>
                                                    <lightning-button
                                                        variant="base"
                                                        label={labels.guessAccept}
                                                        aria-label={column.acceptGuessLabel}
                                                        data-id="accept-guess"
                                                        data-source={column.source}
                                                        onclick={handleAcceptGuess}
                                                    ></lightning-button>
                                                </div>
                                            </template>
                                            <template lwc:if={column.isLookup}>
                                                <lightning-combobox
                                                    class="slds-var-m-top_xx-small"
                                                    label={labels.lookupFieldLabel}
                                                    data-id="lookup-field"
                                                    data-source={column.source}
                                                    value={column.lookupField}
                                                    options={column.lookupOptions}
                                                    onchange={handleLookupFieldChange}
                                                ></lightning-combobox>
                                            </template>
                                            <lightning-button
                                                variant="base"
                                                label={column.changesLabel}
                                                data-id="edit-changes"
                                                data-source={column.source}
                                                onclick={handleEditChanges}
                                            ></lightning-button>
                                            <template lwc:if={loadsOneObject}>
                                                <lightning-input
                                                    type="checkbox"
                                                    label={labels.blankClearsLabel}
                                                    data-id="blank-clears"
                                                    data-source={column.source}
                                                    checked={column.blankClears}
                                                    onchange={handleBlankClearsChange}
                                                ></lightning-input>
                                            </template>
                                        </td>
                                        <td class="slds-text-body_small" data-id="examples">
                                            <template for:each={column.examples} for:item="example">
                                                <div key={example.key} class="slds-truncate">{example.text}</div>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <template lwc:if={editingColumn}>
                        <c-import-column-transforms
                            data-id="column-changes"
                            source={editingColumn.source}
                            transforms={editingColumn.transforms}
                            column-names={headers}
                            sample-rows={changeSampleRows}
                            onchange={handleChangesChange}
                            ondone={handleChangesDone}
                        ></c-import-column-transforms>
                    </template>
                    <c-import-row-rules
                        data-id="row-rules"
                        column-names={headers}
                        skip-rows={skipRows}
                        unique-by={uniqueBy}
                        onchange={handleRowRulesChange}
                    ></c-import-row-rules>
                </template>

                <template lwc:if={isStepMatching}>
                    <template lwc:if={loadsSeveral}>
                        <p class="slds-text-body_small slds-var-m-bottom_small" data-id="several-matching-help">
                            {labels.severalMatchingHelp}
                        </p>
                        <template for:each={severalObjectRows} for:item="objectRow">
                            <div key={objectRow.key} class="slds-box slds-var-m-bottom_small" data-id="several-object">
                                <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">{objectRow.objectLabel}</h3>
                                <c-import-load-options
                                    data-id="several-load-options"
                                    data-object={objectRow.objectName}
                                    operation={objectRow.operation}
                                    operations={objectRow.operations}
                                    match-field={objectRow.matchField}
                                    key-fields={objectRow.keyFields}
                                    row-match-fields={objectRow.matchFields}
                                    hide-lookups
                                    onchange={handleSeveralLoadChange}
                                ></c-import-load-options>
                                <template for:each={objectRow.links} for:item="link">
                                    <p key={link.key} class="slds-text-body_small slds-var-m-top_x-small" data-id="several-link">
                                        {link.text}
                                    </p>
                                </template>
                            </div>
                        </template>
                        <lightning-radio-group
                            data-id="several-not-found"
                            name="several-lookup-not-found"
                            label={labels.notFoundLabel}
                            value={lookupNotFound}
                            options={notFoundOptions}
                            onchange={handleNotFoundChange}
                        ></lightning-radio-group>
                        <p class="slds-text-body_small slds-var-m-top_x-small">{notFoundHelp}</p>
                    </template>
                    <template lwc:if={loadsSingleObject}>
                        <c-import-load-options
                            data-id="load-options"
                            operation={loadOperation}
                            operations={loadOperations}
                            match-field={loadMatchField}
                            lookup-not-found={lookupNotFound}
                            key-fields={keyFields}
                            row-match-fields={rowMatchFields}
                            related={loadRelated}
                            related-options={relatedOptions}
                            onchange={handleLoadOptionsChange}
                        ></c-import-load-options>
                    </template>
                    <template lwc:if={loadsPeople}>
                    <lightning-combobox
                        data-id="rule"
                        label={labels.matchingRuleLabel}
                        value={matchingRule}
                        options={ruleOptions}
                        onchange={handleRuleChange}
                    ></lightning-combobox>
                    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="rule-help">
                        {ruleHelp}
                    </p>
                    <template lwc:if={isPersonExternalId}>
                        <template lwc:if={hasPersonFields}>
                            <lightning-combobox
                                data-id="person-field"
                                label={labels.personMatchFieldLabel}
                                value={personMatchField}
                                options={personFieldOptions}
                                onchange={handlePersonFieldChange}
                            ></lightning-combobox>
                            <p class="slds-text-color_error slds-text-body_small" data-id="person-field-warning">
                                {personFieldWarning}
                            </p>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_error slds-text-body_small" data-id="no-person-fields">
                                {labels.noMatchFields}
                            </p>
                        </template>
                    </template>
                    <template lwc:if={mapsOrganization}>
                        <lightning-combobox
                            class="slds-var-m-top_medium"
                            data-id="organization-rule"
                            label={labels.organizationRuleLabel}
                            value={organizationRule}
                            options={organizationRuleOptions}
                            onchange={handleOrganizationRuleChange}
                        ></lightning-combobox>
                        <p class="slds-text-body_small slds-var-m-top_x-small" data-id="organization-rule-help">
                            {organizationRuleHelp}
                        </p>
                        <template lwc:if={isOrganizationExternalId}>
                            <template lwc:if={hasOrganizationFields}>
                                <lightning-combobox
                                    data-id="organization-field"
                                    label={labels.organizationMatchFieldLabel}
                                    value={organizationMatchField}
                                    options={organizationFieldOptions}
                                    onchange={handleOrganizationFieldChange}
                                ></lightning-combobox>
                                <p
                                    class="slds-text-color_error slds-text-body_small"
                                    data-id="organization-field-warning"
                                >
                                    {organizationFieldWarning}
                                </p>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-color_error slds-text-body_small" data-id="no-organization-fields">
                                    {labels.noMatchFields}
                                </p>
                            </template>
                        </template>
                    </template>
                    </template>
                    <lightning-combobox
                        class="slds-var-m-top_medium"
                        data-id="several-matches"
                        label={labels.severalMatchesLabel}
                        value={severalMatches}
                        options={severalOptions}
                        onchange={handleSeveralChange}
                    ></lightning-combobox>
                    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="several-help">
                        {severalHelp}
                    </p>
                    <lightning-input
                        class="slds-var-m-top_medium"
                        type="checkbox"
                        data-id="match-only"
                        label={labels.matchOnlyLabel}
                        field-level-help={labels.matchOnlyHelp}
                        checked={matchOnly}
                        onchange={handleMatchOnlyChange}
                    ></lightning-input>
                    <template lwc:if={showDuplicateRules}>
                        <lightning-input
                            class="slds-var-m-top_small"
                            type="checkbox"
                            data-id="duplicate-rules"
                            label={labels.duplicateRulesLabel}
                            field-level-help={duplicateRulesHelpText}
                            checked={useDuplicateRules}
                            onchange={handleDuplicateRulesChange}
                        ></lightning-input>
                        <template lwc:if={duplicateRulesMissing}>
                            <p class="slds-text-color_error slds-text-body_small" data-id="duplicate-rules-none">
                                {labels.duplicateRulesNone}
                            </p>
                        </template>
                    </template>
                    <lightning-accordion
                        class="slds-var-m-top_medium"
                        allow-multiple-sections-open
                        active-section-name={moreOptionsSection}
                        data-id="more-options"
                    >
                    <lightning-accordion-section name="more" label={labels.moreOptions}>
                    <h3 class="slds-text-heading_x-small">
                        {labels.fileValuesHeading}
                    </h3>
                    <p class="slds-text-body_small slds-var-m-bottom_x-small">{labels.fileValuesHelp}</p>
                    <template for:each={fileValues} for:item="fileValue">
                        <div key={fileValue.key} class="slds-grid slds-gutters_x-small slds-wrap" data-id="file-value-row">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                                <lightning-combobox
                                    data-key={fileValue.key}
                                    label={labels.fileValueTargetLabel}
                                    value={fileValue.target}
                                    options={fileValueTargetOptions}
                                    onchange={handleFileValueTargetChange}
                                ></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                                <lightning-input
                                    data-key={fileValue.key}
                                    label={labels.fileValueLabel}
                                    value={fileValue.value}
                                    max-length="255"
                                    onchange={handleFileValueChange}
                                ></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12 slds-align-bottom">
                                <lightning-button-icon
                                    data-key={fileValue.key}
                                    icon-name="utility:delete"
                                    alternative-text={labels.removeFileValueLabel}
                                    title={labels.removeFileValueLabel}
                                    onclick={handleRemoveFileValue}
                                ></lightning-button-icon>
                            </div>
                        </div>
                    </template>
                    <lightning-button
                        class="slds-var-m-top_x-small"
                        data-id="add-file-value"
                        label={labels.addFileValueButton}
                        icon-name="utility:add"
                        onclick={handleAddFileValue}
                    ></lightning-button>
                    <h3 class="slds-text-heading_x-small slds-var-m-top_medium">
                        {labels.controlTotalsHeading}
                    </h3>
                    <p class="slds-text-body_small slds-var-m-bottom_x-small">
                        {labels.controlTotalsHelp}
                    </p>
                    <lightning-input
                        type="number"
                        data-id="expected-count"
                        label={labels.expectedCountLabel}
                        value={expectedCount}
                        min="0"
                        step="1"
                        onchange={handleExpectedCountChange}
                    ></lightning-input>
                    <template lwc:if={showExpectedAmount}>
                        <lightning-input
                            type="number"
                            data-id="expected-amount"
                            label={labels.expectedAmountLabel}
                            value={expectedAmount}
                            step="0.01"
                            onchange={handleExpectedAmountChange}
                        ></lightning-input>
                        <h3 class="slds-text-heading_x-small slds-var-m-top_medium">
                            {labels.paymentMatchingHeading}
                        </h3>
                        <p class="slds-text-body_small slds-var-m-bottom_x-small">
                            {labels.paymentMatchingHelp}
                        </p>
                        <lightning-combobox
                            data-id="payment-matching"
                            label={labels.paymentMatchingLabel}
                            value={paymentMatching}
                            options={paymentMatchingOptions}
                            onchange={handlePaymentMatchingChange}
                        ></lightning-combobox>
                        <lightning-input
                            type="number"
                            data-id="match-window"
                            label={labels.matchWindowLabel}
                            value={matchDateWindowDays}
                            min="0"
                            step="1"
                            onchange={handleMatchWindowChange}
                        ></lightning-input>
                        <lightning-input
                            type="number"
                            data-id="match-tolerance"
                            label={labels.matchToleranceLabel}
                            value={matchAmountTolerance}
                            min="0"
                            step="0.01"
                            onchange={handleMatchToleranceChange}
                        ></lightning-input>
                    </template>
                    </lightning-accordion-section>
                    </lightning-accordion>
                </template>

                <template lwc:if={showResults}>
                    <template lwc:if={storeFileError}>
                        <p class="slds-text-body_small slds-var-m-bottom_small" data-id="original-not-kept">
                            {storeFileError}
                        </p>
                    </template>
                    <c-import-results
                        batch={batch}
                        rejected-rows={rejectedRows}
                        changed-values={changedValues}
                        data-id="results"
                    ></c-import-results>
                    <template lwc:if={showTrialChoice}>
                        <div class="slds-box slds-var-m-top_small" data-id="trial">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <h3 class="slds-text-heading_small">{labels.trialHeading}</h3>
                                <lightning-helptext
                                    class="slds-var-m-left_xx-small"
                                    content={labels.trialHelp}
                                    data-id="trial-help"
                                ></lightning-helptext>
                            </div>
                            <lightning-input
                                type="number"
                                data-id="trial-rows"
                                label={labels.trialRowsLabel}
                                value={trialRowCount}
                                min="1"
                                max="2000"
                                step="1"
                                onchange={handleTrialRowsChange}
                            ></lightning-input>
                            <lightning-button
                                class="slds-var-m-top_x-small"
                                label={labels.trialButton}
                                data-id="trial-button"
                                disabled={cannotTrial}
                                onclick={handleTrial}
                            ></lightning-button>
                        </div>
                    </template>
                    <template lwc:if={isTrialComplete}>
                        <div class="slds-box slds-var-m-top_small" data-id="remaining">
                            <p class="slds-var-m-bottom_x-small" data-id="trial-done">
                                {trialDoneText}
                            </p>
                            <lightning-button
                                variant="brand"
                                label={labels.remainingButton}
                                data-id="remaining-button"
                                onclick={handleCommitRemaining}
                            ></lightning-button>
                        </div>
                    </template>
                </template>

                <template lwc:if={showRetry}>
                    <div class="slds-var-m-top_medium" data-id="retry">
                        <h3 class="slds-text-heading_small">{labels.retryHeading}</h3>
                        <p class="slds-text-body_small slds-var-m-bottom_x-small">{labels.retryHelp}</p>
                        <lightning-input
                            type="file"
                            data-id="retry-file"
                            label={labels.retryFileLabel}
                            accept=".csv,text/csv,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                            onchange={handleRetryFile}
                        ></lightning-input>
                    </div>
                </template>

                <template lwc:if={showDeleteConfirm}>
                    <c-bulk-delete
                        class="slds-show slds-var-m-top_medium"
                        batch-id={batch.id}
                        data-id="delete-by-file"
                        onclose={handleStartOver}
                    ></c-bulk-delete>
                </template>

                <div slot="actions">
                    <template lwc:if={showTemplateNext}>
                        <lightning-button
                            variant="brand"
                            label={labels.nextButton}
                            data-id="next"
                            disabled={cannotLeaveTemplateStep}
                            onclick={handleTemplateNext}
                        ></lightning-button>
                    </template>
                    <template lwc:if={isStepColumns}>
                        <lightning-button
                            variant="brand"
                            label={labels.nextButton}
                            data-id="next"
                            disabled={cannotLeaveColumns}
                            onclick={handleNext}
                        ></lightning-button>
                    </template>
                    <template lwc:if={isStepMatching}>
                        <lightning-button
                            variant="brand"
                            label={labels.dryRunButton}
                            data-id="dry-run"
                            disabled={cannotDryRun}
                            onclick={handleDryRun}
                        ></lightning-button>
                    </template>
                    <template lwc:if={isStepPreview}>
                        <lightning-button
                            label={labels.downloadExceptionsButton}
                            data-id="download"
                            onclick={handleDownloadExceptions}
                        ></lightning-button>
                        <template lwc:if={showCommit}>
                            <lightning-button
                                class="slds-var-m-left_x-small"
                                variant="brand"
                                label={labels.commitButton}
                                data-id="commit"
                                disabled={cannotCommit}
                                onclick={handleCommit}
                            ></lightning-button>
                        </template>
                    </template>
                    <template lwc:if={isStepResults}>
                        <lightning-button-menu
                            label={labels.downloadMenu}
                            alternative-text={labels.downloadMenu}
                            menu-alignment="auto"
                            data-id="download-menu"
                            onselect={handleDownloadMenu}
                        >
                            <lightning-menu-item
                                value="rejected"
                                label={labels.downloadExceptionsButton}
                                data-id="download"
                            ></lightning-menu-item>
                            <lightning-menu-item
                                value="results"
                                label={labels.downloadResultsButton}
                                data-id="download-results"
                            ></lightning-menu-item>
                        </lightning-button-menu>
                        <lightning-button
                            class="slds-var-m-left_x-small"
                            variant="brand"
                            label={labels.startOverButton}
                            data-id="start-over"
                            onclick={handleStartOver}
                        ></lightning-button>
                    </template>
                </div>
                </c-barn-step-flow>
            </template>

            <template lwc:if={showReadOnlyNotice}>
                <p data-id="read-only">{labels.readOnlyMessage}</p>
            </template>
        </div>
    </c-barn-page-shell>
</template>
