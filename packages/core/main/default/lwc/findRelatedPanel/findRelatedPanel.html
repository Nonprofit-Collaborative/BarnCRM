<template>
    <template lwc:if={hasError}>
        <div class="slds-text-color_error slds-var-m-bottom_x-small" role="alert" data-id="related-error">
            {errorMessage}
        </div>
    </template>

    <h3 class="slds-text-heading_small slds-var-m-bottom_xx-small">{labels.relatedRecords}</h3>
    <p class="slds-text-color_weak slds-var-m-bottom_x-small">{labels.relatedHelp}</p>
    <template for:each={conditionRows} for:item="condition">
        <div
            key={condition.key}
            role="group"
            aria-label={labels.relatedRecords}
            class="slds-box slds-box_x-small slds-var-m-bottom_x-small"
            data-id="condition"
        >
            <div class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                    <lightning-combobox
                        data-key={condition.key}
                        data-id="has"
                        label={labels.which}
                        options={hasChoices}
                        value={condition.has}
                        onchange={handleHasChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                    <lightning-combobox
                        data-key={condition.key}
                        data-id="kind"
                        label={labels.relatedKind}
                        placeholder={labels.chooseRelated}
                        options={conditionKinds}
                        value={condition.kind}
                        onchange={handleKindChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-shrink-none">
                    <lightning-button
                        data-key={condition.key}
                        data-id="remove-condition"
                        variant="destructive-text"
                        label={labels.remove}
                        onclick={handleRemoveCondition}
                    ></lightning-button>
                </div>
            </div>
            <template lwc:if={condition.hasKind}>
                <p class="slds-var-m-top_x-small slds-var-m-bottom_xx-small">{labels.relatedConditions}</p>
                <c-filter-builder
                    data-key={condition.key}
                    object-api-name={condition.object}
                    value={condition.filterJson}
                    onchange={handleConditionFilterChange}
                ></c-filter-builder>
            </template>
        </div>
    </template>
    <lightning-button
        data-id="add-condition"
        label={labels.addRelated}
        icon-name="utility:add"
        disabled={addConditionDisabled}
        onclick={handleAddCondition}
    ></lightning-button>

    <h3 class="slds-text-heading_small slds-var-m-top_medium slds-var-m-bottom_x-small">{labels.relatedColumns}</h3>
    <template for:each={columnRows} for:item="column">
        <div key={column.key} class="slds-box slds-box_x-small slds-var-m-bottom_x-small" data-id="column">
            <div class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                    <lightning-combobox
                        data-key={column.key}
                        data-id="column-kind"
                        label={labels.relatedKind}
                        placeholder={labels.chooseRelated}
                        options={columnKinds}
                        value={column.relationship}
                        onchange={handleColumnKindChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12">
                    <lightning-input
                        data-key={column.key}
                        data-id="column-rows"
                        type="number"
                        label={labels.relatedRows}
                        min="1"
                        max="10"
                        step="1"
                        value={column.limit}
                        onchange={handleColumnRowsChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-shrink-none">
                    <lightning-button
                        data-key={column.key}
                        data-id="remove-column"
                        variant="destructive-text"
                        label={labels.remove}
                        onclick={handleRemoveColumn}
                    ></lightning-button>
                </div>
            </div>
            <template lwc:if={column.hasKind}>
                <lightning-dual-listbox
                    class="slds-var-m-top_x-small"
                    data-key={column.key}
                    data-id="column-fields"
                    label={labels.relatedFields}
                    source-label={labels.availableFields}
                    selected-label={labels.chosenFields}
                    options={column.fieldOptions}
                    value={column.fields}
                    min="1"
                    max="5"
                    onchange={handleColumnFieldsChange}
                ></lightning-dual-listbox>
            </template>
        </div>
    </template>
    <lightning-button
        data-id="add-column"
        label={labels.addColumn}
        icon-name="utility:add"
        disabled={addColumnDisabled}
        onclick={handleAddColumn}
    ></lightning-button>
</template>
