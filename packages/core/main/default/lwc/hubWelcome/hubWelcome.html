<template>
    <lightning-card title={labels.welcomeHeading} icon-name={iconName}>
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={helpReady}>
                <p class="slds-text-body_regular slds-var-m-bottom_small" data-id="welcome-message">
                    {welcomeMessage}
                </p>
            </template>

            <div class="slds-grid slds-wrap slds-gutters_xx-small">
                <template lwc:if={showNewPersonButton}>
                    <div class="slds-col slds-grow-none slds-var-m-bottom_x-small">
                        <lightning-button
                            variant="brand"
                            label={labels.newPerson}
                            data-id="new-person"
                            onclick={handleNewPerson}
                        ></lightning-button>
                    </div>
                </template>
                <template lwc:if={showNewHouseholdButton}>
                    <div class="slds-col slds-grow-none slds-var-m-bottom_x-small">
                        <lightning-button
                            variant={newHouseholdVariant}
                            label={labels.newHousehold}
                            data-id="new-household"
                            disabled={creating}
                            onclick={handleNewHousehold}
                        ></lightning-button>
                    </div>
                </template>
            </div>

            <template lwc:if={createError}>
                <c-barn-notice
                    variant="error"
                    message={createError}
                    data-id="create-error"
                    class="slds-var-m-top_small"
                ></c-barn-notice>
            </template>

            <template lwc:if={automationPaused}>
                <c-barn-notice
                    variant="warning"
                    message={labels.pausedBanner}
                    action-label={resumeLabel}
                    onaction={handleResume}
                    data-id="paused-banner"
                    class="slds-var-m-top_small"
                ></c-barn-notice>
            </template>

            <template lwc:if={errorMessage}>
                <c-barn-notice
                    variant="error"
                    message={errorMessage}
                    data-id="load-error"
                    class="slds-var-m-top_small"
                ></c-barn-notice>
            </template>
        </div>
    </lightning-card>
</template>
