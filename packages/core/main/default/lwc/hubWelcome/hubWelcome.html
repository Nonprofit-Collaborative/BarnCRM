<template>
    <div class="slds-box slds-theme_default">
        <h1 class="slds-text-heading_medium">{labels.welcomeHeading}</h1>
        <p class="slds-text-body_regular slds-var-m-bottom_small" data-id="welcome-message">
            {welcomeMessage}
        </p>

        <template lwc:if={showNewHouseholdButton}>
            <lightning-button
                variant="brand"
                label={labels.newHousehold}
                data-id="new-household"
                disabled={creating}
                onclick={handleNewHousehold}
            ></lightning-button>
        </template>

        <template lwc:if={createError}>
            <p class="slds-text-color_error slds-var-m-top_small" data-id="create-error" role="alert">
                {createError}
            </p>
        </template>

        <template lwc:if={automationPaused}>
            <div
                class="slds-notify slds-notify_alert slds-alert_warning slds-var-m-top_small"
                data-id="paused-banner"
                role="status"
            >
                <h2>
                    {labels.pausedBanner}
                    <template lwc:if={canResume}>
                        <lightning-button
                            class="slds-var-m-left_x-small"
                            variant="base"
                            label={labels.resume}
                            data-id="resume-link"
                            onclick={handleResume}
                        ></lightning-button>
                    </template>
                </h2>
            </div>
        </template>

        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error slds-var-m-top_small" data-id="load-error" role="alert">
                {errorMessage}
            </p>
        </template>
    </div>
</template>
