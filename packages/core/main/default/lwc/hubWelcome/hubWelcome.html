<template>
    <lightning-card title={labels.welcomeHeading} icon-name={iconName} data-id="welcome-card">
        <div class="slds-var-p-horizontal_medium">
            <p class="slds-text-body_regular slds-var-m-bottom_small" data-id="welcome-message">
                {welcomeMessage}
            </p>

            <template lwc:if={showNewHouseholdButton}>
                <lightning-button
                    variant="brand"
                    label={labels.newHousehold}
                    data-id="new-household"
                    disabled={creating}
                    onclick={handleNewHousehold}
                ></lightning-button>
            </template>

            <template lwc:if={createError}>
                <c-barn-notice
                    class="slds-var-m-top_small"
                    variant="error"
                    message={createError}
                    data-id="create-error"
                ></c-barn-notice>
            </template>

            <template lwc:if={automationPaused}>
                <c-barn-notice
                    class="slds-var-m-top_small"
                    variant="warning"
                    message={labels.pausedBanner}
                    data-id="paused-banner"
                >
                    <template lwc:if={canResume}>
                        <lightning-button
                            variant="base"
                            label={labels.resume}
                            data-id="resume-link"
                            onclick={handleResume}
                        ></lightning-button>
                    </template>
                </c-barn-notice>
            </template>

            <template lwc:if={errorMessage}>
                <c-barn-notice
                    class="slds-var-m-top_small"
                    variant="error"
                    message={errorMessage}
                    data-id="load-error"
                ></c-barn-notice>
            </template>
        </div>
    </lightning-card>
</template>
