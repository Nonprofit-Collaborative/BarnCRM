<template>
    <lightning-card title={labels.heading} icon-name="standard:incident">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={errorMessage}>
                <p class="slds-text-color_error" data-id="load-error" role="alert">{errorMessage}</p>
            </template>
            <template lwc:else>
                <p class="slds-text-heading_large" data-id="error-count">{errorCountText}</p>
                <template lwc:if={allClear}>
                    <lightning-badge
                        class="slds-theme_success"
                        label={labels.allClear}
                        data-id="all-clear"
                    ></lightning-badge>
                </template>
            </template>
            <template lwc:if={hasInstallStatus}>
                <template lwc:if={installHadProblems}>
                    <p
                        class="slds-text-color_error slds-text-body_small"
                        data-id="install-status"
                        role="status"
                        aria-live="polite"
                    >
                        <lightning-icon
                            icon-name="utility:warning"
                            size="x-small"
                            alternative-text={labels.warning}
                        ></lightning-icon>
                        {installStatusText}
                    </p>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small" data-id="install-status">
                        {installStatusText}
                    </p>
                </template>
            </template>
            <lightning-button
                variant="base"
                label={labels.link}
                data-id="open-error-log"
                onclick={handleOpenErrorLog}
            ></lightning-button>
        </div>
    </lightning-card>
</template>
