<template>
    <lightning-card title={labels.heading} icon-name="standard:incident">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={errorMessage}>
                <c-barn-notice variant="error" message={errorMessage} data-id="load-error"></c-barn-notice>
            </template>
            <template lwc:else>
                <c-barn-stat-tile
                    label={labels.errors}
                    value={errorCountText}
                    badge-label={allClearLabel}
                    badge-variant="success"
                    data-id="error-count"
                ></c-barn-stat-tile>
            </template>
            <template lwc:if={hasInstallStatus}>
                <template lwc:if={installHadProblems}>
                    <c-barn-notice
                        class="slds-var-m-top_x-small"
                        variant="warning"
                        message={installStatusText}
                        alternative-text={labels.warning}
                        data-id="install-status"
                    ></c-barn-notice>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="install-status">
                        {installStatusText}
                    </p>
                </template>
            </template>
            <lightning-button
                variant="base"
                label={labels.link}
                data-id="open-error-log"
                onclick={handleOpenErrorLog}
            ></lightning-button>
        </div>
    </lightning-card>
</template>
