<template>
    <template lwc:if={helpReady}>
        <section data-id="backup-sets">
            <h2 class="slds-text-heading_medium">{title}</h2>
            <p class="slds-var-m-vertical_x-small">{labels.intro}</p>
            <p class="slds-text-body_small slds-text-color_weak" data-id="limit">{limitText}</p>
            <template lwc:if={errorMessage}>
                <c-barn-notice variant="error" message={errorMessage} data-id="error"></c-barn-notice>
            </template>
            <template lwc:if={noticeMessage}>
                <c-barn-notice variant="success" message={noticeMessage} data-id="notice"></c-barn-notice>
            </template>
            <template lwc:if={loading}>
                <lightning-spinner size="small" alternative-text={title}></lightning-spinner>
            </template>
            <template lwc:else>
                <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.setsHeading}</h3>
                <template lwc:if={hasSets}>
                    <ul class="slds-has-dividers_bottom-space" data-id="sets">
                        <template for:each={sets} for:item="set">
                            <li key={set.id} class="slds-item slds-grid slds-grid_vertical-align-center slds-wrap">
                                <span class="slds-col slds-grow">
                                    {set.name}
                                    <span class="slds-text-body_small slds-text-color_weak slds-var-m-left_x-small">{set.objectName}, {set.ownerName}</span>
                                </span>
                                <lightning-button
                                    label={labels.run}
                                    data-id={set.id}
                                    data-action="run"
                                    disabled={busy}
                                    onclick={handleRun}
                                ></lightning-button>
                                <template lwc:if={set.mine}>
                                    <lightning-button
                                        class="slds-var-m-left_x-small"
                                        variant="base"
                                        label={labels.remove}
                                        data-id={set.id}
                                        data-action="remove"
                                        disabled={busy}
                                        onclick={handleRemove}
                                    ></lightning-button>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak" data-id="none">{labels.none}</p>
                </template>

                <div class="slds-grid slds-grid_vertical-align-end slds-wrap slds-var-m-top_small" data-id="add">
                    <template lwc:if={hasCandidates}>
                        <lightning-combobox
                            class="slds-var-m-right_x-small"
                            label={labels.addLabel}
                            options={candidateOptions}
                            value={chosen}
                            onchange={handleChoose}
                            data-id="choose"
                        ></lightning-combobox>
                        <lightning-button
                            label={labels.add}
                            disabled={addDisabled}
                            onclick={handleAdd}
                            data-id="add-button"
                        ></lightning-button>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_small slds-text-color_weak">{labels.addNone}</p>
                    </template>
                </div>

                <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.runsHeading}</h3>
                <template lwc:if={hasRuns}>
                    <ul class="slds-has-dividers_bottom-space" data-id="runs">
                        <template for:each={runs} for:item="run">
                            <li key={run.id} class="slds-item">
                                <span class="slds-text-title_bold">{run.setName}</span>
                                <span class="slds-var-m-left_x-small">{run.status}</span>
                                <span class="slds-var-m-left_x-small">{run.detail}</span>
                                <span class="slds-var-m-left_x-small">
                                    <lightning-formatted-date-time
                                        value={run.startedAt}
                                        year="numeric"
                                        month="short"
                                        day="numeric"
                                        hour="2-digit"
                                        minute="2-digit"
                                    ></lightning-formatted-date-time>
                                </span>
                                <template lwc:if={run.fileUrl}>
                                    <a class="slds-var-m-left_x-small" href={run.fileUrl} data-id="file">{run.fileName}</a>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak" data-id="runs-none">{labels.runsNone}</p>
                </template>

                <p class="slds-var-m-top_medium" data-id="restore">{labels.restore}</p>
                <lightning-button
                    class="slds-var-m-top_x-small"
                    label={labels.openImport}
                    onclick={handleOpenImport}
                    data-id="open-import"
                ></lightning-button>
            </template>
        </section>
    </template>
</template>
