<template>
    <template lwc:if={helpReady}>
        <section data-id="backup-sets">
            <h2 class="slds-text-heading_medium">{title}</h2>
            <p class="slds-var-m-vertical_x-small">{labels.intro}</p>
            <p class="slds-text-body_small slds-text-color_weak" data-id="limit">{limitText}</p>
            <template lwc:if={errorMessage}>
                <c-barn-notice variant="error" message={errorMessage} data-id="error"></c-barn-notice>
            </template>
            <template lwc:if={noticeMessage}>
                <c-barn-notice variant="success" message={noticeMessage} data-id="notice"></c-barn-notice>
            </template>
            <template lwc:if={loading}>
                <lightning-spinner size="small" alternative-text={title}></lightning-spinner>
            </template>
            <template lwc:else>
                <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.setsHeading}</h3>
                <template lwc:if={hasSets}>
                    <ul class="slds-has-dividers_bottom-space" data-id="sets">
                        <template for:each={sets} for:item="set">
                            <li key={set.id} class="slds-item slds-grid slds-grid_vertical-align-center slds-wrap">
                                <span class="slds-col slds-grow">
                                    {set.name}
                                    <span class="slds-text-body_small slds-text-color_weak slds-var-m-left_x-small">{set.objectName}, {set.ownerName}</span>
                                    <span class="slds-text-body_small slds-var-m-left_x-small" data-id="schedule">{set.scheduleText}</span>
                                </span>
                                <lightning-button
                                    label={labels.run}
                                    data-id={set.id}
                                    data-action="run"
                                    disabled={busy}
                                    onclick={handleRun}
                                ></lightning-button>
                                <template lwc:if={set.mine}>
                                    <lightning-button
                                        class="slds-var-m-left_x-small"
                                        label={labels.editSchedule}
                                        data-id={set.id}
                                        data-action="edit-schedule"
                                        disabled={busy}
                                        onclick={handleEditSchedule}
                                    ></lightning-button>
                                    <lightning-button
                                        class="slds-var-m-left_x-small"
                                        variant="base"
                                        label={labels.remove}
                                        data-id={set.id}
                                        data-action="remove"
                                        disabled={busy}
                                        onclick={handleRemove}
                                    ></lightning-button>
                                </template>
                                <template lwc:if={set.editing}>
                                    <div class="slds-size_1-of-1 slds-grid slds-grid_vertical-align-end slds-wrap slds-var-m-top_x-small" data-id="schedule-form">
                                        <lightning-combobox
                                            class="slds-var-m-right_x-small"
                                            label={labels.frequency}
                                            options={frequencyOptions}
                                            value={draft.frequency}
                                            onchange={handleFrequency}
                                            data-id="frequency"
                                        ></lightning-combobox>
                                        <template lwc:if={draftWeekly}>
                                            <lightning-combobox
                                                class="slds-var-m-right_x-small"
                                                label={labels.weekday}
                                                options={weekdayOptions}
                                                value={draft.weekday}
                                                onchange={handleWeekday}
                                                data-id="weekday"
                                            ></lightning-combobox>
                                        </template>
                                        <template lwc:if={draftMonthly}>
                                            <lightning-combobox
                                                class="slds-var-m-right_x-small"
                                                label={labels.dayOfMonth}
                                                options={dayOptions}
                                                value={draft.day}
                                                onchange={handleDay}
                                                data-id="day"
                                            ></lightning-combobox>
                                        </template>
                                        <template lwc:if={destinationAvailable}>
                                            <lightning-combobox
                                                class="slds-var-m-right_x-small"
                                                label={labels.destination}
                                                options={destinationOptions}
                                                value={draft.destination}
                                                onchange={handleDestination}
                                                data-id="destination"
                                            ></lightning-combobox>
                                        </template>
                                        <lightning-button
                                            variant="brand"
                                            label={labels.saveSchedule}
                                            disabled={busy}
                                            onclick={handleSaveSchedule}
                                            data-id="save-schedule"
                                        ></lightning-button>
                                        <lightning-button
                                            class="slds-var-m-left_x-small"
                                            label={labels.cancel}
                                            onclick={handleCancelSchedule}
                                            data-id="cancel-schedule"
                                        ></lightning-button>
                                        <template lwc:if={destinationNote}>
                                            <p class="slds-size_1-of-1 slds-text-body_small slds-text-color_weak slds-var-m-top_x-small" data-id="destination-note">{destinationNote}</p>
                                        </template>
                                    </div>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak" data-id="none">{labels.none}</p>
                </template>
                <template lwc:if={anyScheduled}>
                    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="schedule-note">{scheduleNote}</p>
                    <template lwc:if={nightlyOff}>
                        <c-barn-notice variant="warning" message={labels.nightlyOff} data-id="nightly-off"></c-barn-notice>
                    </template>
                </template>

                <div class="slds-grid slds-grid_vertical-align-end slds-wrap slds-var-m-top_small" data-id="add">
                    <template lwc:if={hasCandidates}>
                        <lightning-combobox
                            class="slds-var-m-right_x-small"
                            label={labels.addLabel}
                            options={candidateOptions}
                            value={chosen}
                            onchange={handleChoose}
                            data-id="choose"
                        ></lightning-combobox>
                        <lightning-button
                            label={labels.add}
                            disabled={addDisabled}
                            onclick={handleAdd}
                            data-id="add-button"
                        ></lightning-button>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_small slds-text-color_weak">{labels.addNone}</p>
                    </template>
                </div>

                <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.runsHeading}</h3>
                <template lwc:if={hasRuns}>
                    <ul class="slds-has-dividers_bottom-space" data-id="runs">
                        <template for:each={runs} for:item="run">
                            <li key={run.id} class="slds-item">
                                <span class="slds-text-title_bold">{run.setName}</span>
                                <span class="slds-var-m-left_x-small">{run.status}</span>
                                <span class="slds-var-m-left_x-small">{run.detail}</span>
                                <template lwc:if={run.offPlatformText}>
                                    <span class="slds-var-m-left_x-small" data-id="off-platform">{run.offPlatformText}</span>
                                </template>
                                <span class="slds-var-m-left_x-small">
                                    <lightning-formatted-date-time
                                        value={run.startedAt}
                                        year="numeric"
                                        month="short"
                                        day="numeric"
                                        hour="2-digit"
                                        minute="2-digit"
                                    ></lightning-formatted-date-time>
                                </span>
                                <template lwc:if={run.fileUrl}>
                                    <a class="slds-var-m-left_x-small" href={run.fileUrl} data-id="file">{run.fileName}</a>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak" data-id="runs-none">{labels.runsNone}</p>
                </template>

                <p class="slds-var-m-top_medium" data-id="restore">{labels.restore}</p>
                <lightning-button
                    class="slds-var-m-top_x-small"
                    label={labels.openImport}
                    onclick={handleOpenImport}
                    data-id="open-import"
                ></lightning-button>
            </template>
        </section>
    </template>
</template>
