<template>
    <template lwc:if={helpReady}>
    <lightning-card title={label.title} icon-name="standard:merge">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={isHousehold}>
                <template lwc:if={showReadOnlyNotice}>
                    <c-barn-notice message={label.readOnly} class="read-only-notice"></c-barn-notice>
                </template>
            </template>
            <template lwc:else>
                <c-barn-notice message={label.notAHousehold} class="not-a-household"></c-barn-notice>
            </template>

            <template lwc:if={busy}>
                <lightning-spinner
                    alternative-text={label.loadingComparison}
                    size="small"
                    class="loading-spinner"
                ></lightning-spinner>
            </template>

            <template lwc:if={isUsable}>
                <lightning-tabset>
                    <lightning-tab label={label.tabMerge} value="merge" class="merge-tab">
                        <lightning-record-picker
                            label={label.searchLabel}
                            object-api-name="Account"
                            filter={householdFilter}
                            display-info={householdDisplayInfo}
                            matching-info={householdMatchingInfo}
                            onchange={handleOtherHouseholdChange}
                            class="slds-var-m-top_small merge-picker"
                        ></lightning-record-picker>

                        <template lwc:if={hasComparison}>
                            <div class="slds-var-m-top_small">
                                <lightning-button
                                    variant="base"
                                    label={swapLabel}
                                    icon-name="utility:change_record_type"
                                    disabled={busy}
                                    onclick={handleSwap}
                                    class="swap-button"
                                ></lightning-button>
                            </div>
                            <table
                                class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked slds-var-m-top_small comparison-table"
                                aria-label={label.comparisonTable}
                            >
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col">{label.columnField}</th>
                                        <th scope="col">{label.columnThis}</th>
                                        <th scope="col">{label.columnOther}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={comparison} for:item="field">
                                        <tr key={field.fieldName} class="comparison-row">
                                            <th scope="row" data-label={label.columnField}>{field.label}</th>
                                            <td data-label={label.columnThis} class="this-value">{field.thisValue}</td>
                                            <td data-label={label.columnOther}>
                                                <span class="other-value">{field.otherValue}</span>
                                                <template lwc:if={field.inConflict}>
                                                    <lightning-radio-group
                                                        name={field.fieldName}
                                                        data-field-name={field.fieldName}
                                                        label={field.label}
                                                        variant="label-hidden"
                                                        type="button"
                                                        options={field.options}
                                                        value={field.selected}
                                                        onchange={handleChoiceChange}
                                                        class="field-choice"
                                                    ></lightning-radio-group>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>

                            <h3 class="slds-text-heading_small slds-var-m-top_medium members-heading">
                                {label.membersHeading}
                            </h3>
                            <ul class="slds-has-dividers_bottom-space merge-members">
                                <template for:each={mergeMembers} for:item="member">
                                    <li key={member.personId} class="slds-item merge-member">
                                        <span class="slds-var-m-right_x-small">{member.name}</span>
                                        <c-barn-status-badge
                                            status={member.originStatus}
                                            label={member.origin}
                                            hide-icon
                                        ></c-barn-status-badge>
                                    </li>
                                </template>
                            </ul>

                            <div class="slds-var-m-top_medium slds-var-m-bottom_small">
                                <lightning-button
                                    variant="brand"
                                    label={label.mergeButton}
                                    disabled={busy}
                                    onclick={handleMergeClick}
                                    class="merge-button"
                                ></lightning-button>
                            </div>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_small select-other">
                                {label.selectOther}
                            </p>
                        </template>
                    </lightning-tab>

                    <lightning-tab label={label.tabSplit} value="split" class="split-tab">
                        <h3 class="slds-text-heading_small slds-var-m-top_small split-heading">
                            {label.splitHeading}
                        </h3>
                        <lightning-radio-group
                            name="splitDestination"
                            label={label.splitHeading}
                            variant="label-hidden"
                            options={destinationOptions}
                            value={splitDestination}
                            onchange={handleDestinationChange}
                            class="slds-var-m-top_x-small destination-choice"
                        ></lightning-radio-group>

                        <template lwc:if={isSplittingToExisting}>
                            <lightning-record-picker
                                label={label.searchLabel}
                                object-api-name="Account"
                                filter={householdFilter}
                                display-info={householdDisplayInfo}
                                matching-info={householdMatchingInfo}
                                onchange={handleSplitTargetChange}
                                class="slds-var-m-top_small split-picker"
                            ></lightning-record-picker>
                        </template>

                        <span id="split-drag-help" class="slds-assistive-text split-drag-help">{dragHelp}</span>
                        <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-top_small split-board">
                            <template for:each={splitBoard} for:item="column">
                                <div key={column.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-m-bottom_x-small">
                                    <section
                                        class={column.zoneClass}
                                        data-drop-zone={column.id}
                                        data-drop-label={column.place}
                                        aria-label={column.heading}
                                    >
                                        <h4 class="slds-text-title_bold slds-var-m-bottom_x-small split-column-heading">
                                            {column.heading}
                                        </h4>
                                        <ul class="split-list">
                                            <template for:each={column.tiles} for:item="member">
                                                <li
                                                    key={member.personId}
                                                    class={member.tileClass}
                                                >
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <span
                                                            class="slds-var-m-right_x-small split-handle"
                                                            role="button"
                                                            tabindex="0"
                                                            title={dragHelp}
                                                            aria-label={member.name}
                                                            aria-describedby="split-drag-help"
                                                            data-drag-id={member.personId}
                                                            data-drag-label={member.name}
                                                            onpointerdown={handleDragPointerDown}
                                                            onkeydown={handleDragKeyDown}
                                                        >
                                                            <lightning-icon
                                                                icon-name="utility:drag_and_drop"
                                                                size="x-small"
                                                            ></lightning-icon>
                                                        </span>
                                                        <div class="slds-col">
                                                            <lightning-input
                                                                type="checkbox"
                                                                label={member.name}
                                                                checked={member.selected}
                                                                data-person-id={member.personId}
                                                                onchange={handleMemberToggle}
                                                                class="member-checkbox"
                                                            ></lightning-input>
                                                        </div>
                                                        <lightning-button-menu
                                                            icon-size="x-small"
                                                            alternative-text={member.moveLabel}
                                                            menu-alignment="right"
                                                            data-person-id={member.personId}
                                                            onselect={handleMoveMenu}
                                                            class="move-menu"
                                                        >
                                                            <lightning-menu-item
                                                                value="move"
                                                                label={member.moveLabel}
                                                            ></lightning-menu-item>
                                                        </lightning-button-menu>
                                                    </div>
                                                </li>
                                            </template>
                                        </ul>
                                    </section>
                                </div>
                            </template>
                        </div>
                        <div aria-live="polite" class="slds-assistive-text split-announcer">{liveText}</div>

                        <div class="slds-var-m-top_small slds-var-m-bottom_small">
                            <lightning-button
                                variant="brand"
                                label={label.splitButton}
                                disabled={cannotSplit}
                                onclick={handleSplitClick}
                                class="split-button"
                            ></lightning-button>
                        </div>
                    </lightning-tab>
                </lightning-tabset>
            </template>

            <template lwc:if={errorMessage}>
                <c-barn-notice variant="error" message={errorMessage} class="slds-var-m-top_small merge-error"></c-barn-notice>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
