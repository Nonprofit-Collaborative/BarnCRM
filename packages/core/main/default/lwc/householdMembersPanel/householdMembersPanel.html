<template>
    <template lwc:if={helpReady}>
    <lightning-card title={label.title} icon-name={icons.household}>
        <template lwc:if={canAddMember}>
            <lightning-button
                slot="actions"
                label={label.addMember}
                onclick={handleAddClick}
                class="add-button"
            ></lightning-button>
        </template>
        <div class="slds-var-p-horizontal_medium slds-is-relative">
            <template lwc:if={isHousehold}>
                <template lwc:if={isLoading}>
                    <lightning-spinner alternative-text={label.loading} size="small"></lightning-spinner>
                </template>

                <template lwc:if={hasMembers}>
                    <ul class="slds-has-dividers_bottom-space member-list">
                        <template for:each={rows} for:item="member">
                            <li key={member.personId} class="slds-item member-row">
                                <div class="slds-media slds-media_center slds-media_small">
                                    <div class="slds-media__figure" aria-hidden="true">
                                        <lightning-avatar
                                            variant="circle"
                                            size="small"
                                            initials={member.initials}
                                            fallback-icon-name="standard:avatar"
                                            class="member-avatar"
                                        ></lightning-avatar>
                                    </div>
                                    <div class="slds-media__body">
                                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                                            <h3 class="slds-text-heading_small slds-var-m-right_x-small">
                                                <a
                                                    href={member.href}
                                                    data-record-id={member.personId}
                                                    onclick={handleOpenRecord}
                                                    class="member-name"
                                                >{member.name}</a>
                                            </h3>
                                            <template for:each={member.badges} for:item="badge">
                                                <c-barn-status-badge
                                                    key={badge.key}
                                                    class="slds-var-m-right_xx-small member-badge"
                                                    status={badge.status}
                                                    icon-name={badge.iconName}
                                                    label={badge.text}
                                                ></c-barn-status-badge>
                                            </template>
                                        </div>
                                        <template lwc:if={member.role}>
                                            <p class="slds-text-body_small slds-text-color_weak member-role">{member.role}</p>
                                        </template>
                                    </div>
                                    <template lwc:if={member.hasActions}>
                                        <div class="slds-media__figure slds-media__figure_reverse">
                                            <lightning-button-menu
                                                alternative-text={member.actionsLabel}
                                                title={member.actionsLabel}
                                                icon-size="small"
                                                menu-alignment="auto"
                                                data-person-id={member.personId}
                                                disabled={busy}
                                                onselect={handleMemberAction}
                                                class="member-menu"
                                            >
                                                <template lwc:if={member.canMakePrimary}>
                                                    <lightning-menu-item
                                                        value="makePrimary"
                                                        label={label.makePrimary}
                                                        class="make-primary-button"
                                                    ></lightning-menu-item>
                                                </template>
                                                <template lwc:if={member.canMove}>
                                                    <lightning-menu-item
                                                        value="move"
                                                        label={label.moveMember}
                                                        class="move-button"
                                                    ></lightning-menu-item>
                                                </template>
                                            </lightning-button-menu>
                                        </div>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:elseif={membersLoaded}>
                    <c-barn-empty-state class="empty-message" heading={label.emptyHeading} message={label.empty}>
                        <template lwc:if={canAddMember}>
                            <lightning-button
                                label={label.addMember}
                                onclick={handleAddClick}
                                class="empty-add-button"
                            ></lightning-button>
                        </template>
                    </c-barn-empty-state>
                </template>

                <template lwc:if={isMoving}>
                    <div class="slds-box slds-var-m-top_small move-box">
                        <p class="slds-var-m-bottom_x-small">{label.moveHelp}</p>
                        <lightning-record-picker
                            label={label.moveHelp}
                            variant="label-hidden"
                            placeholder={label.moveMember}
                            object-api-name="Account"
                            display-info={householdDisplayInfo}
                            filter={householdFilter}
                            onchange={handleTargetChange}
                            class="move-target"
                        ></lightning-record-picker>
                        <div class="slds-var-m-top_x-small">
                            <lightning-button
                                variant="brand"
                                label={label.save}
                                disabled={busy}
                                onclick={handleMoveSave}
                                class="slds-var-m-right_x-small move-save-button"
                            ></lightning-button>
                            <lightning-button
                                label={label.cancel}
                                onclick={handleMoveCancel}
                                class="move-cancel-button"
                            ></lightning-button>
                        </div>
                    </div>
                </template>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak not-a-household">{label.notAHousehold}</p>
            </template>

            <template lwc:if={errorMessage}>
                <c-barn-notice
                    class="slds-var-m-top_small error-message"
                    variant="error"
                    message={errorMessage}
                ></c-barn-notice>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
