<template>
    <div class="slds-scoped-notification slds-theme_warning slds-var-m-bottom_small" role="note" data-id="one-way-warning">
        <p class="slds-text-body_regular">{labels.warning}</p>
    </div>

    <template lwc:if={loaded}>
        <ul class="slds-has-dividers_bottom-space" data-id="feature-list">
            <template for:each={features} for:item="feature">
                <li key={feature.key} class="slds-item" data-id="feature-row" data-key={feature.key}>
                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                        <div class="slds-col slds-grow">
                            <p class="slds-text-heading_x-small">{feature.name}</p>
                            <p class="slds-text-body_small slds-text-color_weak">{feature.description}</p>
                        </div>
                        <div class="slds-col slds-grow-none slds-var-p-left_small">
                            <template lwc:if={feature.showTurnOn}>
                                <lightning-button
                                    label={labels.turnOn}
                                    title={feature.buttonLabel}
                                    data-key={feature.key}
                                    data-id="turn-on"
                                    disabled={isBusy}
                                    onclick={handleTurnOn}
                                ></lightning-button>
                            </template>
                            <template lwc:else>
                                <span class={feature.stateClass} data-id="state">{feature.stateLabel}</span>
                            </template>
                        </div>
                    </div>
                </li>
            </template>
        </ul>
    </template>

    <template lwc:if={savedMessage}>
        <p class="slds-text-color_success slds-var-m-top_x-small" role="status" data-id="saved">{savedMessage}</p>
    </template>
    <template lwc:if={errorMessage}>
        <p class="slds-text-color_error slds-var-m-top_x-small" role="alert" data-id="error">{errorMessage}</p>
    </template>
</template>
