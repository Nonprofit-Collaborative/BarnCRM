<template>
    <template lwc:if={helpReady}>
  <lightning-card title={labels.panelTitle} icon-name={icons.affiliation}>
    <template lwc:if={canAdd}>
      <lightning-button
        slot="actions"
        label={labels.addButton}
        onclick={handleAdd}
        data-id="add-affiliation"
      ></lightning-button>
    </template>

    <div class="slds-var-p-horizontal_medium slds-is-relative">
      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <c-barn-notice
          class="slds-var-m-bottom_small"
          variant="error"
          message={errorMessage}
          data-id="error"
        ></c-barn-notice>
      </template>

      <template lwc:if={isEmpty}>
        <c-barn-empty-state heading={labels.emptyHeading} message={labels.emptyMessage} data-id="empty">
          <template lwc:if={canAdd}>
            <lightning-button label={labels.addButton} onclick={handleAdd} data-id="empty-add"></lightning-button>
          </template>
        </c-barn-empty-state>
      </template>

      <template lwc:if={hasAffiliations}>
        <ul class="slds-has-dividers_bottom-space" data-id="affiliation-list">
          <template for:each={rows} for:item="affiliation">
            <li key={affiliation.id} class={affiliation.rowClass} data-id="affiliation-card">
              <div class="slds-media slds-media_center slds-media_small">
                <div class="slds-media__figure" aria-hidden="true">
                  <lightning-avatar
                    variant="circle"
                    size="small"
                    initials={affiliation.initials}
                    fallback-icon-name={affiliation.avatarIcon}
                  ></lightning-avatar>
                </div>
                <div class="slds-media__body">
                  <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                    <h3 class="slds-text-heading_small slds-var-m-right_x-small">
                      <a
                        href={affiliation.href}
                        data-record-id={affiliation.id}
                        onclick={handleOpenRecord}
                        data-id="affiliation-headline"
                      >{affiliation.headline}</a>
                    </h3>
                    <template lwc:if={affiliation.isPrimary}>
                      <c-barn-status-badge
                        class="slds-var-m-right_xx-small"
                        status="success"
                        icon-name="utility:favorite"
                        label={labels.primaryBadge}
                        data-id="primary-badge"
                      ></c-barn-status-badge>
                    </template>
                    <template lwc:if={affiliation.isFormer}>
                      <c-barn-status-badge
                        status="former"
                        label={labels.formerBadge}
                        data-id="former-badge"
                      ></c-barn-status-badge>
                    </template>
                  </div>
                  <template lwc:if={affiliation.role}>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="affiliation-role">{affiliation.role}</p>
                  </template>
                  <template lwc:if={affiliation.description}>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="affiliation-description">
                      {affiliation.description}
                    </p>
                  </template>
                </div>
                <template lwc:if={affiliation.hasActions}>
                  <div class="slds-media__figure slds-media__figure_reverse">
                    <lightning-button-menu
                      alternative-text={affiliation.actionsLabel}
                      title={affiliation.actionsLabel}
                      icon-size="small"
                      menu-alignment="auto"
                      data-record-id={affiliation.id}
                      disabled={busy}
                      onselect={handleRowAction}
                      class="row-menu"
                    >
                      <template lwc:if={canEdit}>
                        <lightning-menu-item
                          value="edit"
                          label={labels.editAction}
                          class="edit-affiliation"
                        ></lightning-menu-item>
                      </template>
                      <template lwc:if={affiliation.canMakePrimary}>
                        <lightning-menu-item
                          value="makePrimary"
                          label={labels.makePrimaryButton}
                          class="make-primary"
                        ></lightning-menu-item>
                      </template>
                      <template lwc:if={affiliation.canEnd}>
                        <lightning-menu-item
                          value="end"
                          label={labels.endAction}
                          class="end-affiliation"
                        ></lightning-menu-item>
                      </template>
                    </lightning-button-menu>
                  </div>
                </template>
              </div>
            </li>
          </template>
        </ul>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-box slds-var-m-top_small" data-id="add-form">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addFormTitle}</h3>
          <lightning-record-edit-form
            object-api-name={affiliationObject}
            onsuccess={handleFormSuccess}
            onerror={handleFormError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name={ownerFieldName}
              value={recordId}
              variant="label-hidden"
            ></lightning-input-field>
            <lightning-input-field field-name={otherEndFieldName}></lightning-input-field>
            <template for:each={formFields} for:item="fieldName">
              <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
            </template>
            <div class="slds-var-m-top_small">
              <lightning-button
                variant="neutral"
                label={labels.cancelButton}
                onclick={handleCancel}
                data-id="cancel"
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="brand"
                type="submit"
                label={labels.addButton}
                data-id="save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </template>
    </div>
  </lightning-card>
    </template>
</template>
