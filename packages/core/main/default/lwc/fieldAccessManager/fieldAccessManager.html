<template>
    <template lwc:if={helpReady}>
    <div class="slds-is-relative slds-var-m-top_medium" data-id="change-view">
        <p class="slds-var-m-bottom_small" data-id="intro">{labels.intro}</p>

        <template lwc:if={refusal}>
            <c-barn-notice data-id="refusal" variant="error" message={refusal}></c-barn-notice>
        </template>
        <template lwc:if={errorMessage}>
            <c-barn-notice
                class="slds-var-m-vertical_small"
                data-id="error"
                variant="error"
                message={errorMessage}
            ></c-barn-notice>
        </template>
        <template lwc:if={noticeMessage}>
            <c-barn-notice
                class="slds-var-m-vertical_small"
                data-id="notice"
                variant="success"
                message={noticeMessage}
            ></c-barn-notice>
        </template>
        <template lwc:if={loading}>
            <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
        </template>

        <template lwc:if={canChange}>
            <lightning-input
                data-id="set-search"
                type="search"
                label={labels.sets}
                placeholder={labels.setsPlaceholder}
                field-level-help={chooseSetsText}
                value={term}
                onchange={handleTerm}
            ></lightning-input>
            <template lwc:if={noResults}>
                <p class="slds-var-m-top_x-small slds-text-color_weak" data-id="no-matches">{labels.noMatches}</p>
            </template>
            <ul class="slds-var-m-top_x-small" data-id="set-results">
                <template for:each={resultItems} for:item="choice">
                    <li key={choice.id}>
                        <lightning-button
                            variant="base"
                            label={choice.label}
                            data-value={choice.id}
                            onclick={handleChooseSet}
                        ></lightning-button>
                    </li>
                </template>
            </ul>
            <div class="slds-var-m-top_x-small" data-id="chosen-sets">
                <template for:each={sets} for:item="chosen">
                    <lightning-pill
                        key={chosen.id}
                        label={chosen.label}
                        data-value={chosen.id}
                        onremove={handleRemoveSet}
                    ></lightning-pill>
                </template>
            </div>

            <lightning-combobox
                class="slds-var-m-top_small"
                data-id="object"
                label={labels.kindOfRecord}
                options={objectOptions}
                value={objectName}
                disabled={noSets}
                onchange={handleObject}
            ></lightning-combobox>

            <template lwc:if={fieldList}>
                <lightning-combobox
                    class="slds-var-m-top_small"
                    data-id="object-access"
                    label={labels.objectAccess}
                    options={objectAccessOptions}
                    value={objectAccess}
                    onchange={handleObjectAccess}
                ></lightning-combobox>
                <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.fieldsHeading}</h3>
                <lightning-input
                    data-id="filter"
                    type="search"
                    label={labels.filterFields}
                    value={fieldFilter}
                    onchange={handleFilter}
                ></lightning-input>
                <div class="slds-var-m-top_x-small">
                    <lightning-datatable
                        data-id="fields"
                        key-field="name"
                        data={shownFields}
                        columns={fieldColumns}
                        onrowselection={handleTick}
                    ></lightning-datatable>
                </div>
                <lightning-combobox
                    class="slds-var-m-top_small"
                    data-id="field-access"
                    label={labels.fieldAccess}
                    options={fieldAccessOptions}
                    value={fieldAccessChoice}
                    onchange={handleFieldAccess}
                ></lightning-combobox>
                <lightning-button
                    class="slds-var-m-top_small"
                    data-id="add"
                    label={labels.add}
                    disabled={addDisabled}
                    onclick={handleAdd}
                ></lightning-button>
            </template>

            <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.changesHeading}</h3>
            <template lwc:if={hasItems}>
                <lightning-datatable
                    data-id="items"
                    key-field="key"
                    data={itemRows}
                    columns={itemColumns}
                    hide-checkbox-column
                    onrowaction={handleItemAction}
                ></lightning-datatable>
                <template lwc:if={conflictMessage}>
                    <c-barn-notice
                        class="slds-var-m-top_x-small"
                        data-id="conflict"
                        variant="error"
                        message={conflictMessage}
                    ></c-barn-notice>
                </template>
                <lightning-button
                    class="slds-var-m-top_x-small"
                    data-id="clear"
                    label={labels.clear}
                    onclick={handleClear}
                ></lightning-button>
            </template>
            <template lwc:else>
                <c-barn-empty-state
                    data-id="no-changes"
                    size="compact"
                    heading={labels.noChanges}
                ></c-barn-empty-state>
            </template>
            <div class="slds-var-m-top_small">
                <lightning-button
                    data-id="preview"
                    variant="brand"
                    label={labels.preview}
                    disabled={previewDisabled}
                    onclick={handlePreview}
                ></lightning-button>
            </div>

            <template lwc:if={previewView}>
                <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.preview}</h3>
                <p class="slds-var-m-vertical_x-small" data-id="summary">{previewView.summary}</p>
                <template lwc:if={previewView.tooMany}>
                    <c-barn-notice
                        class="slds-var-m-bottom_x-small"
                        data-id="too-many"
                        variant="error"
                        message={previewView.tooMany}
                    ></c-barn-notice>
                </template>
                <lightning-datatable
                    data-id="preview-rows"
                    key-field="key"
                    data={previewView.rows}
                    columns={previewColumns}
                    hide-checkbox-column
                ></lightning-datatable>
                <lightning-button
                    class="slds-var-m-top_small"
                    data-id="apply"
                    variant="brand"
                    label={labels.apply}
                    disabled={previewView.applyDisabled}
                    onclick={handleApply}
                ></lightning-button>
            </template>

            <h3 class="slds-text-heading_small slds-var-m-top_large">{labels.recentHeading}</h3>
            <template lwc:if={hasRecent}>
                <lightning-datatable
                    data-id="recent"
                    key-field="id"
                    data={recentRows}
                    columns={recentColumns}
                    hide-checkbox-column
                    onrowaction={handleRecentAction}
                ></lightning-datatable>
            </template>
            <template lwc:else>
                <c-barn-empty-state
                    data-id="no-recent"
                    size="compact"
                    heading={labels.noRecent}
                ></c-barn-empty-state>
            </template>
            <lightning-button
                class="slds-var-m-top_x-small"
                data-id="refresh"
                label={labels.refresh}
                onclick={handleRefresh}
            ></lightning-button>
        </template>
    </div>
    </template>
</template>
