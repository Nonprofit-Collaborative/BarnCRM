<template>
    <template lwc:if={helpReady}>
    <div class="slds-var-p-around_medium">
        <h2 class="slds-text-heading_medium" data-id="title">{labels.title}</h2>
        <p class="slds-text-body_small slds-var-m-bottom_small" data-id="intro">{labels.intro}</p>

        <template lwc:if={errorMessage}>
            <div class="slds-var-m-bottom_small">
                <c-barn-notice variant="error" message={errorMessage} data-id="error"></c-barn-notice>
            </div>
        </template>
        <template lwc:if={noticeMessage}>
            <div class="slds-var-m-bottom_small">
                <c-barn-notice variant="success" message={noticeMessage} data-id="notice"></c-barn-notice>
            </div>
        </template>

        <template lwc:if={panel}>
            <div class="slds-box slds-box_x-small slds-var-m-bottom_small">
                <p data-id="schedule-message">{scheduleMessage}</p>
                <template lwc:if={hasLastRun}>
                    <p class="slds-text-body_small" data-id="last-run">
                        <strong>{labels.lastRun}:</strong>
                        <lightning-formatted-date-time
                            value={panel.lastRunStarted}
                            year="numeric"
                            month="short"
                            day="2-digit"
                            hour="2-digit"
                            minute="2-digit"
                        ></lightning-formatted-date-time>
                        <template lwc:if={panel.lastRunOutcome}>
                            <span> ({panel.lastRunOutcome})</span>
                        </template>
                    </p>
                </template>
                <template lwc:if={showSchedule}>
                    <div class="slds-var-m-top_x-small">
                        <lightning-button
                            data-id="schedule"
                            label={labels.schedule}
                            disabled={busy}
                            onclick={handleSchedule}
                        ></lightning-button>
                    </div>
                </template>
            </div>

            <table
                class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked"
                data-id="steps"
            >
                <caption class="slds-assistive-text">{labels.title}</caption>
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">{labels.job}</th>
                        <th scope="col">{labels.time}</th>
                        <th scope="col">{labels.status}</th>
                        <th scope="col">{labels.lastRun}</th>
                        <th scope="col">{labels.result}</th>
                        <template lwc:if={canManage}>
                            <th scope="col">{labels.actions}</th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <tr key={row.key} data-key={row.key}>
                            <th scope="row" class="slds-cell-wrap" data-label={labels.job}>{row.label}</th>
                            <td data-label={labels.time}>{row.time}</td>
                            <td data-id="state" data-label={labels.status}>
                                <c-barn-status-badge
                                    status={row.stateStatus}
                                    label={row.state}
                                ></c-barn-status-badge>
                            </td>
                            <td data-label={labels.lastRun}>
                                <template lwc:if={row.lastStarted}>
                                    <lightning-formatted-date-time
                                        value={row.lastStarted}
                                        month="short"
                                        day="2-digit"
                                        hour="2-digit"
                                        minute="2-digit"
                                    ></lightning-formatted-date-time>
                                </template>
                            </td>
                            <td class="slds-cell-wrap" data-id="outcome" data-label={labels.result}>
                                <template lwc:if={row.outcome}>
                                    <c-barn-status-badge
                                        status={row.outcomeStatus}
                                        label={row.outcome}
                                    ></c-barn-status-badge>
                                </template>
                                <template lwc:if={row.message}>
                                    <span class="slds-text-body_small slds-text-color_weak"> {row.message}</span>
                                </template>
                                <template lwc:if={row.missed}>
                                    <c-barn-status-badge
                                        data-id="missed"
                                        status="warning"
                                        label={labels.missed}
                                    ></c-barn-status-badge>
                                </template>
                                <template lwc:if={row.summary}>
                                    <p class="slds-text-body_small" data-id="summary">{row.summary}</p>
                                </template>
                            </td>
                            <template lwc:if={canManage}>
                                <td data-label={labels.actions}>
                                    <lightning-button-group>
                                        <template lwc:if={row.hasSwitch}>
                                            <lightning-button
                                                data-id="switch"
                                                data-key={row.key}
                                                label={row.switchLabel}
                                                disabled={busy}
                                                onclick={handleSwitch}
                                            ></lightning-button>
                                        </template>
                                        <template lwc:if={row.canRunNow}>
                                            <lightning-button
                                                data-id="run-now"
                                                data-key={row.key}
                                                label={labels.runNow}
                                                disabled={busy}
                                                onclick={handleRunNow}
                                            ></lightning-button>
                                        </template>
                                    </lightning-button-group>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
    </div>
    </template>
</template>
