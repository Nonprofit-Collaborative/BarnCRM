<template>
    <template for:each={visibleGroups} for:item="group">
        <section key={group.key} class="slds-var-m-bottom_medium" data-id="group" data-name={group.name}>
            <template lwc:if={group.hasLabel}>
                <div
                    role="heading"
                    aria-level={headingLevel}
                    class="slds-text-heading_small slds-var-m-bottom_x-small"
                    data-id="group-heading"
                >
                    {group.label}
                </div>
            </template>
            <ul class="slds-grid slds-wrap slds-gutters_x-small">
                <template for:each={group.tiles} for:item="tile">
                    <li
                        key={tile.key}
                        class="slds-col slds-grid slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-var-p-bottom_x-small"
                    >
                        <c-barn-tool-tile
                            class="slds-grow"
                            name={tile.name}
                            label={tile.label}
                            description={tile.description}
                            icon-name={tile.iconName}
                            href={tile.href}
                            new-tab={tile.newTab}
                            badge-label={tile.badgeLabel}
                            badge-variant={tile.badgeVariant}
                            disabled={tile.disabled}
                            disabled-reason={tile.disabledReason}
                            onselect={handleSelect}
                        ></c-barn-tool-tile>
                    </li>
                </template>
            </ul>
        </section>
    </template>
</template>
