<template>
    <template lwc:if={helpReady}>
    <p class="slds-text-body_regular slds-var-m-bottom_small" data-id="shape">{shapeText}</p>

    <template lwc:if={hasOtherRollupTools}>
        <c-barn-notice class="slds-var-m-bottom_small" title={labels.otherRollupTools} data-id="other-rollup-tools">
            <template for:each={otherRollupTools} for:item="notice">
                <p key={notice} class="slds-text-body_small">{notice}</p>
            </template>
        </c-barn-notice>
    </template>

    <p class="slds-text-body_small slds-var-m-bottom_small">
        <strong>{labels.recommended}:</strong>
        <!-- LWC drops the space between the two elements, so the margin keeps them apart. -->
        <span class="slds-var-m-left_xx-small" data-id="recommended">{recommendedText}</span>
    </p>

    <lightning-combobox
        label={labels.mode}
        value={chosen}
        options={options}
        disabled={isReadOnly}
        onchange={handleModeChange}
    ></lightning-combobox>

    <template lwc:if={canEdit}>
        <lightning-button
            class="slds-var-m-top_small"
            variant="brand"
            label={labels.confirm}
            onclick={handleConfirm}
        ></lightning-button>
    </template>
    </template>
</template>
