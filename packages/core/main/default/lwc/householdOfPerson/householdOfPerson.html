<template>
    <lightning-card title={label.title} icon-name={icons.household}>
        <div class="slds-var-p-horizontal_medium slds-is-relative">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text={label.loading} size="small"></lightning-spinner>
            </template>

            <template if:true={isEmpty}>
                <c-barn-empty-state
                    class="empty-message"
                    heading={label.emptyHeading}
                    message={label.empty}
                ></c-barn-empty-state>
            </template>

            <template if:true={hasHouseholds}>
                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={households} for:item="household">
                        <li key={household.householdId} class="slds-item household-row">
                            <div class="slds-media slds-media_center slds-media_small">
                                <div class="slds-media__figure" aria-hidden="true">
                                    <lightning-avatar
                                        variant="circle"
                                        size="small"
                                        fallback-icon-name="standard:household"
                                    ></lightning-avatar>
                                </div>
                                <div class="slds-media__body">
                                    <h3 class="slds-text-heading_small">
                                        <a
                                            href={household.url}
                                            class="household-link"
                                            data-record-id={household.householdId}
                                            onclick={handleHouseholdClick}
                                        >{household.name}</a>
                                    </h3>
                                    <p class="slds-text-body_small slds-text-color_weak member-count">{household.memberCountText}</p>
                                    <template if:true={household.formalGreeting}>
                                        <p class="slds-text-body_small slds-text-color_weak formal-greeting">
                                            {label.formalGreeting}: {household.formalGreeting}
                                        </p>
                                    </template>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>

            <template if:true={errorMessage}>
                <c-barn-notice
                    class="slds-var-m-top_small error-message"
                    variant="error"
                    message={errorMessage}
                ></c-barn-notice>
            </template>
        </div>
    </lightning-card>
</template>
