<template>
    <lightning-card title={labels.title} icon-name="utility:search">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium slds-is-relative">
            <template if:true={busy}>
                <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
            </template>
            <p class="slds-var-m-bottom_small">{labels.intro}</p>

            <template if:true={hasError}>
                <div class="slds-box slds-box_x-small slds-theme_error slds-var-m-bottom_small" role="alert">
                    <span data-id="error-message">{errorMessage}</span>
                </div>
            </template>
            <template if:true={hasNotice}>
                <div
                    class="slds-box slds-box_x-small slds-theme_success slds-var-m-bottom_small"
                    role="status"
                    aria-live="polite"
                >
                    <span data-id="notice-message">{noticeMessage}</span>
                </div>
            </template>

            <div class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <lightning-combobox
                        data-id="saved"
                        label={labels.savedQueries}
                        placeholder={labels.chooseSaved}
                        options={savedOptions}
                        value={openQueryId}
                        disabled={busy}
                        onchange={handleOpenSaved}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <lightning-combobox
                        data-id="object"
                        label={labels.object}
                        placeholder={labels.chooseObject}
                        options={objectOptions}
                        value={objectApiName}
                        disabled={busy}
                        onchange={handleObjectChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-shrink-none">
                    <lightning-button
                        data-id="new"
                        label={labels.newQuery}
                        disabled={busy}
                        onclick={handleNew}
                    ></lightning-button>
                </div>
            </div>

            <template if:true={hasObject}>
                <div class="slds-var-m-top_medium">
                    <lightning-dual-listbox
                        data-id="columns"
                        label={labels.columns}
                        source-label={labels.availableFields}
                        selected-label={labels.chosenFields}
                        options={fieldOptions}
                        value={columns}
                        onchange={handleColumnsChange}
                    ></lightning-dual-listbox>
                    <div class="slds-size_1-of-1 slds-medium-size_4-of-12 slds-var-m-top_x-small">
                        <lightning-combobox
                            data-id="related"
                            label={labels.addFieldsFrom}
                            placeholder={labels.chooseLookup}
                            options={lookupOptions}
                            onchange={handleAddRelated}
                        ></lightning-combobox>
                    </div>
                </div>

                <h2 class="slds-text-heading_small slds-var-m-top_medium slds-var-m-bottom_x-small">
                    {labels.conditions}
                </h2>
                <c-filter-builder
                    object-api-name={objectApiName}
                    value={filterJson}
                    onchange={handleFilterChange}
                ></c-filter-builder>

                <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-top_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                        <lightning-combobox
                            data-id="sort"
                            label={labels.sortBy}
                            options={sortOptions}
                            value={sortField}
                            onchange={handleSortChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                        <lightning-combobox
                            data-id="direction"
                            label={labels.direction}
                            options={directionOptions}
                            value={sortDirection}
                            onchange={handleDirectionChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12">
                        <lightning-input
                            data-id="row-limit"
                            type="number"
                            label={labels.rowsToShow}
                            min="1"
                            max={maxRows}
                            step="1"
                            value={rowLimit}
                            onchange={handleRowLimitChange}
                        ></lightning-input>
                    </div>
                </div>

                <lightning-textarea
                    class="slds-var-m-top_medium"
                    data-id="soql"
                    label={labels.soql}
                    field-level-help={labels.soqlHelp}
                    value={soql}
                    read-only
                ></lightning-textarea>

                <div class="slds-var-m-top_small">
                    <lightning-button
                        data-id="run"
                        variant="brand"
                        label={labels.run}
                        disabled={actionDisabled}
                        onclick={handleRun}
                    ></lightning-button>
                    <lightning-button
                        class="slds-var-m-left_x-small"
                        data-id="export"
                        label={labels.export}
                        icon-name="utility:download"
                        disabled={actionDisabled}
                        onclick={handleExport}
                    ></lightning-button>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end slds-var-m-top_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                        <lightning-input
                            data-id="query-name"
                            label={labels.queryName}
                            max-length="80"
                            value={queryName}
                            onchange={handleNameChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-shrink-none">
                        <lightning-input
                            data-id="share"
                            type="checkbox"
                            label={labels.share}
                            checked={shared}
                            onchange={handleShareChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-shrink-none">
                        <lightning-button
                            data-id="save"
                            label={labels.save}
                            disabled={saveDisabled}
                            onclick={handleSave}
                        ></lightning-button>
                        <lightning-button
                            class="slds-var-m-left_x-small"
                            data-id="save-as"
                            label={labels.saveAs}
                            disabled={actionDisabled}
                            onclick={handleSaveAs}
                        ></lightning-button>
                        <lightning-button
                            class="slds-var-m-left_x-small"
                            data-id="delete"
                            variant="destructive-text"
                            label={labels.delete}
                            disabled={deleteDisabled}
                            onclick={handleDelete}
                        ></lightning-button>
                    </div>
                </div>

                <template if:true={rows}>
                    <p class="slds-var-m-top_medium slds-var-m-bottom_x-small" data-id="result-line" role="status">
                        {resultLine}
                    </p>
                </template>
                <template if:true={hasRows}>
                    <div class="slds-scrollable_x">
                        <lightning-datatable
                            data-id="results"
                            key-field="Id"
                            columns={tableColumns}
                            data={tableRows}
                            hide-checkbox-column
                        ></lightning-datatable>
                    </div>
                </template>
                <template if:true={showNoResults}>
                    <p data-id="no-results">{labels.noResults}</p>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
