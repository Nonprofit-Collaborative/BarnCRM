<template>
    <ul class="slds-has-dividers_bottom-space">
        <template for:each={rows} for:item="module">
            <li key={module.name} class="slds-item slds-var-p-vertical_xx-small">
                <span class={module.statusClass}>{module.status}</span>
                <span class="slds-text-heading_x-small slds-var-m-left_x-small" data-id="module-name"
                    >{module.displayName}</span
                >
                <a class="slds-var-m-left_small" href={module.docsUrl} target="_blank" rel="noopener noreferrer"
                    >{labels.learnMore}<lightning-icon class="slds-var-m-left_xx-small" icon-name="utility:new_window" size="xx-small"></lightning-icon
                    >
                    <span class="slds-assistive-text">{module.displayName} {labels.newTab}</span>
                </a>
                <template lwc:if={module.installUrl}>
                    <a
                        class="slds-var-m-left_small"
                        href={module.installUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        data-id="install-link"
                        >{labels.install}<lightning-icon class="slds-var-m-left_xx-small" icon-name="utility:new_window" size="xx-small"></lightning-icon
                        >
                        <span class="slds-assistive-text">{module.displayName} {labels.newTab}</span>
                    </a>
                </template>
                <template lwc:if={module.installFirstText}>
                    <p class="slds-text-body_small slds-var-m-top_xx-small" data-id="install-first">
                        {module.installFirstText}
                    </p>
                </template>
                <template lwc:if={module.staffTabsText}>
                    <p class="slds-text-body_small slds-var-m-top_xx-small" data-id="staff-tabs">
                        {module.staffTabsText}
                    </p>
                </template>
                <template lwc:if={module.adminTabsText}>
                    <p class="slds-text-body_small slds-var-m-top_xx-small" data-id="admin-tabs">
                        {module.adminTabsText}
                    </p>
                </template>
            </li>
        </template>
    </ul>

    <template lwc:if={hasTabsToAdd}>
        <p class="slds-text-body_small slds-var-m-top_x-small" data-id="tabs-how">{labels.tabsHow}</p>
    </template>

    <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
        {labels.managerNotice}
    </p>
</template>
