<template>
    <div class="slds-var-m-top_small">
        <template lwc:if={isRunning}>
            <div class="slds-align_absolute-center slds-var-p-around_medium">
                <lightning-spinner
                    alternative-text={labels.loadingAltText}
                    size="small"
                ></lightning-spinner>
            </div>
            <p role="status" class="slds-text-align_center slds-text-body_small" data-id="running">
                {labels.runningMessage}
            </p>
        </template>

        <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-bottom_medium" aria-live="polite" data-id="counts">
            <template for:each={counts} for:item="count">
                <div
                    key={count.key}
                    class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small"
                >
                    <c-barn-stat-tile
                        label={count.label}
                        value={count.value}
                        bordered
                        align="start"
                        data-id={count.key}
                    ></c-barn-stat-tile>
                </div>
            </template>
        </div>

        <template lwc:if={canSeeRows}>
            <p class="slds-var-m-bottom_medium">
                <lightning-button
                    variant="base"
                    label={labels.seeEveryRow}
                    data-id="see-every-row"
                    onclick={handleSeeEveryRow}
                ></lightning-button>
            </p>
        </template>

        <template lwc:if={hasRunLog}>
            <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">
                {labels.runLogHeading}
            </h3>
            <ul class="slds-var-m-bottom_medium" data-id="run-log">
                <template for:each={runLogLines} for:item="line">
                    <li key={line.key} class="slds-text-body_small">{line.text}</li>
                </template>
            </ul>
        </template>

        <template lwc:if={hasChangedValues}>
            <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">
                {labels.changedValuesHeading}
            </h3>
            <div class="slds-var-m-bottom_medium">
                <table
                    class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked"
                    aria-label={labels.changedValuesHeading}
                    data-id="changed-values-table"
                >
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">{labels.rowNumberHeader}</th>
                            <th scope="col">{labels.columnHeader}</th>
                            <th scope="col">{labels.beforeHeader}</th>
                            <th scope="col">{labels.afterHeader}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={changedValueRows} for:item="changed">
                            <tr key={changed.key} data-id="changed-value">
                                <td data-label={labels.rowNumberHeader}>{changed.rowNumber}</td>
                                <td data-label={labels.columnHeader}>{changed.column}</td>
                                <td data-label={labels.beforeHeader}>{changed.before}</td>
                                <td data-label={labels.afterHeader}>{changed.after}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">
            {labels.rejectedHeading}
        </h3>
        <template lwc:if={hasRejectedRows}>
            <template lwc:if={rejectedShownNote}>
                <p class="slds-text-body_small slds-var-m-bottom_x-small" data-id="rejected-shown">
                    {rejectedShownNote}
                </p>
            </template>
            <div>
                <table
                    class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked"
                    aria-label={labels.rejectedHeading}
                    data-id="rejected-table"
                >
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">{labels.rowNumberHeader}</th>
                            <th scope="col">{labels.reasonHeader}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={rejectedRows} for:item="row">
                            <tr key={row.id} data-id="rejected-row">
                                <td data-label={labels.rowNumberHeader}>{row.rowNumber}</td>
                                <td data-label={labels.reasonHeader}>{row.errorMessage}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        <template lwc:else>
            <c-barn-empty-state
                illustration="all-clear"
                size="compact"
                message={labels.noRejectedRows}
                data-id="no-rejected"
            ></c-barn-empty-state>
        </template>
    </div>
</template>
