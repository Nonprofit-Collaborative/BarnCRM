<template>
    <lightning-card title={labels.heading} icon-name="standard:link">
        <ul class="slds-grid slds-wrap slds-var-p-horizontal_small">
            <template for:each={links} for:item="link">
                <li key={link.tab} class="slds-col slds-size_1-of-1 slds-var-p-around_xx-small">
                    <c-barn-tool-tile
                        name={link.tab}
                        label={link.label}
                        description={link.line}
                        icon-name={link.iconName}
                        data-id="quick-link"
                        onselect={handleOpen}
                    ></c-barn-tool-tile>
                </li>
            </template>
        </ul>
    </lightning-card>
</template>
