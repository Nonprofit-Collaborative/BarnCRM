<template>
    <lightning-card title={labels.heading}>
        <div class="slds-var-p-horizontal_medium">
            <ul class="slds-list_vertical slds-has-dividers_bottom-space">
                <template for:each={links} for:item="link">
                    <li key={link.tab} class="slds-item">
                        <lightning-button
                            variant="base"
                            label={link.label}
                            data-tab={link.tab}
                            onclick={handleOpen}
                        ></lightning-button>
                    </li>
                </template>
            </ul>
        </div>
    </lightning-card>
</template>
