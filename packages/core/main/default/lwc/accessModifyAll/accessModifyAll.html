<template>
    <template lwc:if={helpReady}>
    <div class="slds-is-relative slds-var-m-top_medium" data-id="modify-all-view">
        <p data-id="intro">{labels.intro}</p>

        <template lwc:if={errorMessage}>
            <c-barn-notice
                class="slds-var-m-vertical_small"
                data-id="error"
                variant="error"
                message={errorMessage}
            ></c-barn-notice>
        </template>
        <template lwc:if={noticeMessage}>
            <c-barn-notice
                class="slds-var-m-vertical_small"
                data-id="notice"
                variant="success"
                message={noticeMessage}
            ></c-barn-notice>
        </template>
        <template lwc:if={loading}>
            <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
        </template>

        <template lwc:if={report}>
            <template lwc:if={truncatedMessage}>
                <c-barn-notice
                    class="slds-var-m-top_small"
                    data-id="truncated"
                    variant="warning"
                    message={truncatedMessage}
                ></c-barn-notice>
            </template>

            <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.dataHeading}</h3>
            <template lwc:if={hasData}>
                <lightning-datatable
                    data-id="data"
                    key-field="key"
                    data={dataTable.rows}
                    columns={dataTable.columns}
                    hide-checkbox-column
                    wrap-text-max-lines="3"
                ></lightning-datatable>
                <lightning-button
                    class="slds-var-m-top_x-small"
                    label={labels.download}
                    data-table="data"
                    onclick={handleDownload}
                ></lightning-button>
            </template>
            <template lwc:else>
                <c-barn-empty-state
                    data-id="data-empty"
                    size="compact"
                    illustration="all-clear"
                    heading={labels.nothingToShow}
                ></c-barn-empty-state>
            </template>

            <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.objectsHeading}</h3>
            <template lwc:if={hasObjects}>
                <lightning-datatable
                    data-id="objects"
                    key-field="key"
                    data={objectTable.rows}
                    columns={objectTable.columns}
                    hide-checkbox-column
                    wrap-text-max-lines="3"
                ></lightning-datatable>
                <lightning-button
                    class="slds-var-m-top_x-small"
                    label={labels.download}
                    data-table="objects"
                    onclick={handleDownload}
                ></lightning-button>
            </template>
            <template lwc:else>
                <c-barn-empty-state
                    data-id="objects-empty"
                    size="compact"
                    illustration="all-clear"
                    heading={labels.nothingToShow}
                ></c-barn-empty-state>
            </template>
        </template>
    </div>
    </template>
</template>
