<template>
    <div class="slds-var-p-around_medium">
        <h1 class="slds-text-heading_medium">{labels.welcomeHeading}</h1>
        <p class="slds-text-body_regular slds-var-m-bottom_medium">{labels.welcomeMessage}</p>

        <template lwc:if={showNewHouseholdButton}>
            <lightning-button
                variant="brand"
                label={labels.newHousehold}
                data-id="new-household"
                class="slds-var-m-bottom_medium"
                onclick={handleNewHousehold}
            ></lightning-button>
        </template>

        <template lwc:if={automationPaused}>
            <div class="slds-box slds-theme_warning slds-var-m-bottom_medium" role="status">
                {labels.pausedBanner}
            </div>
        </template>

        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error slds-var-m-bottom_small" role="alert">
                {errorMessage}
            </p>
        </template>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                <template lwc:if={showAssistant}>
                    <lightning-card title={labels.checklistHeading}>
                        <div class="slds-var-p-horizontal_medium">
                            <c-setup-assistant
                                reopened={setupReopened}
                                onsetupchanged={handleSetupChanged}
                            ></c-setup-assistant>
                        </div>
                    </lightning-card>
                </template>
                <template lwc:else>
                    <lightning-card title={labels.setupCompleteHeading}>
                        <div class="slds-var-p-horizontal_medium">
                            <p class="slds-text-body_small" data-id="setup-progress">
                                {setupProgressText}
                            </p>
                            <lightning-button
                                class="slds-var-m-top_x-small"
                                label={labels.reopenSetup}
                                data-id="reopen-setup"
                                onclick={handleReopenSetup}
                            ></lightning-button>
                        </div>
                    </lightning-card>
                </template>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                <lightning-card title={labels.errorTileHeading}>
                    <div class="slds-var-p-horizontal_medium">
                        <p class="slds-text-heading_large" data-id="error-count">
                            {errorCountText}
                        </p>
                        <template lwc:if={hasInstallStatus}>
                            <template lwc:if={installHadProblems}>
                                <p
                                    class="slds-text-color_error slds-text-body_small"
                                    data-id="install-status"
                                    role="status"
                                    aria-live="polite"
                                >
                                    <lightning-icon
                                        icon-name="utility:warning"
                                        size="x-small"
                                        alternative-text={labels.warningIcon}
                                    ></lightning-icon>
                                    {installStatusText}
                                </p>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-body_small" data-id="install-status">
                                    {installStatusText}
                                </p>
                            </template>
                        </template>
                        <a href={errorLogUrl}>{labels.errorTileLink}</a>
                    </div>
                </lightning-card>

                <lightning-card title={labels.rollupsHeading} class="slds-var-m-top_medium">
                    <div class="slds-var-p-horizontal_medium">
                        <template lwc:if={hasRollupTime}>
                            <p data-id="rollups-last-calculated">
                                <lightning-formatted-date-time
                                    value={rollupsLastCalculated}
                                    year="numeric"
                                    month="short"
                                    day="2-digit"
                                    hour="2-digit"
                                    minute="2-digit"
                                ></lightning-formatted-date-time>
                            </p>
                        </template>
                        <template lwc:else>
                            <p data-id="rollups-never">{labels.rollupsNever}</p>
                        </template>
                        <template lwc:if={rollupsStale}>
                            <p
                                class="slds-text-color_error"
                                data-id="rollups-stale"
                                role="status"
                                aria-live="polite"
                            >
                                <lightning-icon
                                    icon-name="utility:warning"
                                    size="x-small"
                                    alternative-text={labels.warningIcon}
                                ></lightning-icon>
                                {labels.rollupsStale}
                            </p>
                        </template>
                        <a href={rollupsUrl}>{labels.rollupsLink}</a>
                    </div>
                </lightning-card>

                <lightning-card
                    title={labels.seasonalHeading}
                    class="slds-var-m-top_medium"
                >
                    <div class="slds-var-p-horizontal_medium">
                        <template lwc:if={hasSeasonalRun}>
                            <p data-id="seasonal-last-run">
                                <lightning-formatted-date-time
                                    value={seasonalAddressLastRun}
                                    year="numeric"
                                    month="short"
                                    day="2-digit"
                                    hour="2-digit"
                                    minute="2-digit"
                                ></lightning-formatted-date-time>
                            </p>
                            <template lwc:if={seasonalAddressLastRunSummary}>
                                <p
                                    class="slds-text-body_small"
                                    data-id="seasonal-last-run-summary"
                                >
                                    {seasonalAddressLastRunSummary}
                                </p>
                            </template>
                        </template>
                        <template lwc:else>
                            <p data-id="seasonal-never">{labels.seasonalNever}</p>
                        </template>
                        <template lwc:if={seasonalNotScheduled}>
                            <p
                                class="slds-text-body_small"
                                data-id="seasonal-not-scheduled"
                                role="status"
                                aria-live="polite"
                            >
                                {labels.seasonalNotScheduled}
                            </p>
                        </template>
                        <template lwc:if={seasonalAddressStale}>
                            <p
                                class="slds-text-color_error"
                                data-id="seasonal-stale"
                                role="status"
                                aria-live="polite"
                            >
                                <lightning-icon
                                    icon-name="utility:warning"
                                    size="x-small"
                                    alternative-text={labels.warningIcon}
                                ></lightning-icon>
                                {labels.seasonalStale}
                            </p>
                        </template>
                        <a href={addressSettingsUrl}>{labels.seasonalLink}</a>
                    </div>
                </lightning-card>

                <template lwc:if={hasRecurringSources}>
                    <lightning-card
                        title={labels.recurringHeading}
                        class="slds-var-m-top_medium"
                    >
                        <div class="slds-var-p-horizontal_medium">
                            <ul class="slds-has-dividers_bottom-space">
                                <template for:each={recurringSources} for:item="source">
                                    <li key={source.id} class="slds-item" data-id="recurring-source">
                                        <p class="slds-text-title_bold">{source.sourceName}</p>
                                        <p class="slds-text-body_small">
                                            <template lwc:if={source.lastImportDate}>
                                                <lightning-formatted-date-time
                                                    value={source.lastImportDate}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit"
                                                    time-zone="UTC"
                                                ></lightning-formatted-date-time>
                                            </template>
                                            <template lwc:else>{labels.recurringNever}</template>
                                        </p>
                                    </li>
                                </template>
                            </ul>
                            <a href={importUrl}>{labels.recurringLink}</a>
                        </div>
                    </lightning-card>
                </template>

                <lightning-card title={labels.quickLinksHeading} class="slds-var-m-top_medium">
                    <div class="slds-var-p-horizontal_medium">
                        <ul class="slds-list_vertical slds-has-dividers_bottom-space">
                            <template for:each={quickLinks} for:item="link">
                                <li key={link.key} class="slds-item">
                                    <a href={link.url}>{link.label}</a>
                                </li>
                            </template>
                        </ul>
                    </div>
                </lightning-card>
            </div>
        </div>
    </div>
</template>
