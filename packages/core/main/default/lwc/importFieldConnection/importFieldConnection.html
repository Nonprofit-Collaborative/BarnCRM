<template>
  <p class="slds-var-m-bottom_x-small" data-id="intro">{labels.intro}</p>
  <template lwc:if={errorMessage}>
    <p class="slds-text-color_error slds-var-m-bottom_x-small" data-id="error" role="alert">
      {errorMessage}
    </p>
  </template>
  <template lwc:if={connection}>
    <p class="slds-var-m-bottom_x-small" data-id="status" role="status">
      {labels.status}: {statusText}
    </p>
    <template lwc:if={canSetUp}>
      <lightning-button
        data-id="set-up"
        label={labels.setUp}
        disabled={busy}
        onclick={handleSetUp}
      ></lightning-button>
    </template>
    <template lwc:if={calloutsOff}>
      <p class="slds-var-m-bottom_x-small" data-id="enable-steps">{labels.enableSteps}</p>
      <lightning-button
        data-id="check-again"
        label={labels.checkAgain}
        disabled={busy}
        onclick={handleCheckAgain}
      ></lightning-button>
    </template>
    <template lwc:if={needsPermission}>
      <p class="slds-text-body_small slds-text-color_weak" data-id="needs-permission">
        {labels.needsPermission}
      </p>
    </template>
  </template>
</template>
