<template>
    <article class="slds-card" data-id="shell">
        <div class="slds-page-header slds-page-header_joined">
            <div class="slds-page-header__row slds-wrap">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <template lwc:if={showIcon}>
                            <div class="slds-media__figure">
                                <lightning-icon icon-name={iconName} size="medium" data-id="icon"></lightning-icon>
                            </div>
                        </template>
                        <div class="slds-media__body">
                            <h1 class={titleClass} data-id="title">{title}</h1>
                            <template lwc:if={purpose}>
                                <p class="slds-page-header__name-meta" data-id="purpose">{purpose}</p>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <slot name="actions"></slot>
                    </div>
                </div>
            </div>
        </div>

        <div class={helpSectionClass} data-id="help-section">
            <h2 class="slds-section__title">
                <button
                    type="button"
                    class="slds-button slds-section__title-action"
                    aria-controls="barn-shell-help"
                    aria-expanded={helpExpanded}
                    onclick={handleToggleHelp}
                    data-id="help-toggle"
                >
                    <lightning-icon
                        class="slds-section__title-action-icon slds-button__icon_left"
                        icon-name={helpIcon}
                        size="x-small"
                    ></lightning-icon>
                    <span class="slds-truncate">{helpHeading}</span>
                </button>
            </h2>
            <div class="slds-section__content slds-var-p-horizontal_medium" id="barn-shell-help" hidden={helpCollapsed}>
                <slot name="help" onslotchange={handleHelpSlotChange}></slot>
            </div>
        </div>

        <div class="slds-assistive-text" role="status" aria-live="polite" data-id="live">{statusMessage}</div>

        <div class="slds-card__body slds-card__body_inner" data-id="body">
            <slot></slot>
        </div>

        <footer class={footerClass} data-id="footer">
            <slot name="footer" onslotchange={handleFooterSlotChange}></slot>
        </footer>
    </article>
</template>
