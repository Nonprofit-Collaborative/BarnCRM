<template>
    <template lwc:if={helpReady}>
    <c-barn-page-shell
        title={labels.title}
        title-hidden
        purpose={labels.intro}
        help-storage-key="gridTool"
        data-id="shell"
    >
        <lightning-button
            slot="actions"
            data-id="open-in-find"
            label={labels.openInFind}
            icon-name="utility:search"
            disabled={runDisabled}
            onclick={handleOpenInFind}
        ></lightning-button>
        <div slot="help" class="slds-var-p-bottom_small">
            <p>
                {labels.limits}
                <c-barn-help class="slds-var-m-left_xx-small" learn-more-url={guideUrl}></c-barn-help>
            </p>
        </div>

        <div class="slds-is-relative">
            <template lwc:if={busy}>
                <lightning-spinner alternative-text={labels.title} size="small"></lightning-spinner>
            </template>
            <template lwc:if={errorMessage}>
                <c-barn-notice
                    class="slds-show slds-var-m-bottom_small"
                    variant="error"
                    message={errorMessage}
                    data-id="error"
                ></c-barn-notice>
            </template>
            <template lwc:if={statusMessage}>
                <c-barn-notice
                    class="slds-show slds-var-m-bottom_small"
                    variant="success"
                    message={statusMessage}
                    data-id="status"
                ></c-barn-notice>
            </template>

            <template lwc:if={hasSources}>
                <lightning-combobox
                    data-id="source"
                    label={labels.source}
                    placeholder={labels.sourcePlaceholder}
                    options={sourceChoices}
                    value={sourceId}
                    onchange={handleSourceChange}
                ></lightning-combobox>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak" data-id="empty">{labels.empty}</p>
            </template>

            <template lwc:if={hasDocument}>
                <div class="slds-var-m-top_medium">
                    <c-find-related-panel
                        object-api-name={objectApiName}
                        related={related}
                        children={children}
                        onchange={handleRelatedChange}
                    ></c-find-related-panel>
                </div>
                <div class="slds-grid slds-wrap slds-grid_vertical-align-end slds-gutters_x-small slds-var-m-top_medium">
                    <div class="slds-col">
                        <lightning-button
                            data-id="run"
                            variant="brand"
                            label={labels.run}
                            disabled={runDisabled}
                            onclick={handleRun}
                        ></lightning-button>
                    </div>
                    <div class="slds-col">
                        <lightning-input
                            data-id="name"
                            label={labels.name}
                            value={gridName}
                            max-length="80"
                            onchange={handleNameChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-input
                            data-id="share"
                            type="checkbox"
                            label={labels.share}
                            checked={shared}
                            onchange={handleShareChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-button
                            data-id="save-grid"
                            label={saveLabel}
                            disabled={saveDisabled}
                            onclick={handleSaveGrid}
                        ></lightning-button>
                        <lightning-button
                            data-id="delete-grid"
                            class="slds-var-m-left_x-small"
                            variant="destructive-text"
                            label={labels.remove}
                            disabled={deleteDisabled}
                            onclick={handleDeleteGrid}
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <template lwc:if={showNoRows}>
                <p class="slds-var-m-top_medium slds-text-color_weak" data-id="no-rows">{labels.noRows}</p>
            </template>
            <template lwc:if={hasRows}>
                <h2 class="slds-text-heading_small slds-var-m-top_large">{labels.records}</h2>
                <template lwc:if={canEdit}>
                    <p class="slds-text-body_small slds-text-color_weak">{labels.selectHint}</p>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="read-only">{labels.readOnly}</p>
                </template>
                <div class="slds-var-m-top_x-small">
                    <lightning-datatable
                        data-id="main"
                        data-key="main"
                        data-object={objectApiName}
                        key-field="Id"
                        columns={mainColumns}
                        data={mainRows}
                        draft-values={mainDrafts}
                        errors={mainErrors}
                        selected-rows={selectedIds}
                        onrowselection={handleRowSelection}
                        oncellchange={handleCellChange}
                        onsave={handleSave}
                        oncancel={handleCancel}
                    ></lightning-datatable>
                </div>
                <template for:each={relatedTables} for:item="table">
                    <div key={table.key} class="slds-var-m-top_large">
                        <h2 class="slds-text-heading_small">{table.heading}</h2>
                        <template lwc:if={table.hasRows}>
                            <lightning-datatable
                                data-key={table.key}
                                data-object={table.objectName}
                                key-field="Id"
                                columns={table.columns}
                                data={table.rows}
                                draft-values={table.drafts}
                                errors={table.errors}
                                hide-checkbox-column
                                oncellchange={handleCellChange}
                                onsave={handleSave}
                                oncancel={handleCancel}
                            ></lightning-datatable>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak">{labels.noRelated}</p>
                        </template>
                    </div>
                </template>
            </template>
        </div>
    </c-barn-page-shell>
    </template>
</template>
