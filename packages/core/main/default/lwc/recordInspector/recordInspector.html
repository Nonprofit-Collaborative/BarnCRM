<template>
    <template lwc:if={helpReady}>
    <template lwc:if={canUse}>
        <lightning-card title={labels.title} icon-name={iconName}>
            <span slot="actions">
                <template lwc:if={canInspect}>
                    <lightning-button
                        data-id="inspect-button"
                        label={inspectLabel}
                        variant="neutral"
                        disabled={loading}
                        onclick={handleInspect}
                    ></lightning-button>
                </template>
            </span>

            <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
                <template lwc:if={onPage}>
                    <div class="slds-grid slds-grid_vertical-align-end slds-var-m-bottom_small">
                        <lightning-input
                            class="slds-col slds-grow"
                            data-id="record-input"
                            label={labels.recordInput}
                            value={pageInput}
                            onchange={handlePageInput}
                            onkeyup={handlePageKey}
                        ></lightning-input>
                        <lightning-button
                            class="slds-col slds-grow-none slds-var-m-left_x-small"
                            data-id="go-button"
                            label={labels.go}
                            variant="brand"
                            disabled={loading}
                            onclick={handleGo}
                        ></lightning-button>
                    </div>
                </template>

                <template lwc:if={hasError}>
                    <c-barn-notice
                        class="slds-var-m-bottom_small"
                        data-id="error-message"
                        variant="error"
                        message={shownError}
                    ></c-barn-notice>
                </template>

                <template lwc:if={showIntro}>
                    <p data-id="intro">{introText}</p>
                </template>

                <template lwc:if={showRecordHeading}>
                    <p class="slds-text-heading_small slds-var-m-bottom_small" data-id="record-heading">
                        <a data-id="record-link" href={recordUrl}>{recordName}</a>
                        <span class="slds-text-color_weak slds-var-m-left_x-small" data-id="record-object"
                            >{inspection.objectLabel}</span
                        >
                    </p>
                </template>

                <template lwc:if={loading}>
                    <div class="slds-is-relative slds-var-p-around_large">
                        <lightning-spinner
                            alternative-text={labels.loading}
                            size="small"
                        ></lightning-spinner>
                    </div>
                </template>

                <template lwc:if={hasInspection}>
                    <lightning-input
                        data-id="search"
                        type="search"
                        label={labels.search}
                        value={searchTerm}
                        onchange={handleSearch}
                    ></lightning-input>
                    <lightning-button
                        class="slds-float_right"
                        data-id="open-find"
                        label={labels.openFind}
                        variant="base"
                        onclick={handleOpenFind}
                    ></lightning-button>
                    <p class="slds-text-body_small slds-var-m-vertical_x-small" aria-live="polite">
                        <span data-id="count">{countLabel}</span>
                        <template lwc:if={hasCopied}>
                            <span class="slds-var-m-left_small" data-id="copied">
                                {copiedMessage}
                            </span>
                        </template>
                    </p>
                    <template lwc:if={fieldsCut}>
                        <p class="slds-text-body_small" data-id="fields-cut">{labels.fieldsCut}</p>
                    </template>
                    <template lwc:if={noMatch}>
                        <c-barn-empty-state
                            data-id="no-match"
                            size="compact"
                            heading={labels.noMatch}
                        ></c-barn-empty-state>
                    </template>
                    <template lwc:else>
                        <div class="slds-scrollable" style="max-height: 30rem">
                            <table
                                class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked"
                                data-id="field-table"
                            >
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col">{labels.columnField}</th>
                                        <th scope="col">{labels.columnApiName}</th>
                                        <th scope="col">{labels.columnType}</th>
                                        <th scope="col">{labels.columnValue}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={rows} for:item="row">
                                        <tr key={row.key} data-row={row.apiName}>
                                            <th scope="row" class="slds-cell-wrap" data-label={labels.columnField}>
                                                {row.label}
                                            </th>
                                            <td class="slds-cell-wrap" data-label={labels.columnApiName}>
                                                <code>{row.apiName}</code>
                                                <lightning-button-icon
                                                    class="copy-button slds-var-m-left_xx-small"
                                                    icon-name="utility:copy"
                                                    variant="bare"
                                                    size="small"
                                                    alternative-text={row.copyLabel}
                                                    title={row.copyLabel}
                                                    data-api-name={row.apiName}
                                                    onclick={handleCopy}
                                                ></lightning-button-icon>
                                                <template lwc:if={row.setupUrl}>
                                                    <a
                                                        class="setup-link slds-var-m-left_xx-small slds-text-body_small"
                                                        href={row.setupUrl}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        title={row.setupLabel}
                                                        >{row.openSetup}</a
                                                    >
                                                </template>
                                                <lightning-button-icon
                                                    class="where-used-button slds-var-m-left_xx-small"
                                                    icon-name="utility:search"
                                                    variant="bare"
                                                    size="small"
                                                    alternative-text={row.whereUsedLabel}
                                                    title={row.whereUsedLabel}
                                                    data-api-name={row.apiName}
                                                    onclick={handleWhereUsed}
                                                ></lightning-button-icon>
                                            </td>
                                            <td class="slds-cell-wrap" data-label={labels.columnType}>{row.type}</td>
                                            <td class="slds-cell-wrap" data-label={labels.columnValue}>
                                                <template lwc:if={row.hasValue}>
                                                    <span data-id="value">{row.value}</span>
                                                    <template lwc:if={row.truncated}>
                                                        <c-barn-status-badge
                                                            class="slds-var-m-left_xx-small"
                                                            status="info"
                                                            label={labels.shortened}
                                                        ></c-barn-status-badge>
                                                    </template>
                                                </template>
                                                <template lwc:else>
                                                    <span class="slds-text-color_weak">
                                                        {row.empty}
                                                    </span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </template>
            </div>
        </lightning-card>
        <template lwc:if={inspection}>
            <c-field-history-panel
                class="slds-show slds-var-m-top_small"
                record-id={inspection.recordId}
                data-id="field-history"
            ></c-field-history-panel>
        </template>
    </template>
    </template>
</template>
