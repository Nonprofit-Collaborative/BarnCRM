<template>
    <template lwc:if={helpReady}>
    <c-barn-page-shell
        title={labels.title}
        purpose={labels.intro}
        title-hidden
        help-storage-key="dataManager"
        data-id="shell"
    >
        <div slot="help" class="slds-var-p-bottom_small" data-id="help">
            <p>{labels.helpChange}</p>
            <p class="slds-var-m-top_xx-small">{labels.helpDelete}</p>
            <c-barn-help learn-more-url={learnMoreUrl}></c-barn-help>
        </div>

        <template lwc:if={panel}>
            <lightning-button
                variant="base"
                icon-name="utility:back"
                label={labels.back}
                onclick={handleBack}
                data-id="back"
            ></lightning-button>
            <div class="slds-var-m-top_small" data-id="panel">
                <template lwc:if={showBackup}>
                    <c-backup-sets></c-backup-sets>
                </template>
            </div>
        </template>
        <template lwc:else>
        <section class="slds-var-m-bottom_medium" data-id="task-search">
            <div class="slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-input
                    type="search"
                    data-id="task-input"
                    label={labels.taskSearch}
                    placeholder={labels.taskSearchPlaceholder}
                    value={taskQuery}
                    onchange={handleTaskInput}
                ></lightning-input>
            </div>
            <div aria-live="polite">
                <template lwc:if={hasTaskResults}>
                    <ul class="slds-has-dividers_bottom-space slds-var-m-top_x-small" aria-label={labels.taskSearch}>
                        <template for:each={taskResults} for:item="task">
                            <li key={task.key} class="slds-item">
                                <button
                                    type="button"
                                    class="slds-button slds-button_reset slds-text-link"
                                    data-id="task-result"
                                    data-tool={task.tool}
                                    onclick={handleTaskSelect}
                                >
                                    {task.text}
                                </button>
                                <span class="slds-text-body_small slds-text-color_weak slds-var-m-left_x-small"
                                    >{task.toolLabel}</span
                                >
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:if={showNoTasks}>
                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small" data-id="task-none">
                        {labels.taskSearchNone}
                    </p>
                </template>
            </div>
        </section>

        <c-barn-tool-grid groups={toolGroups} onselect={handleSelect} data-id="tools"></c-barn-tool-grid>

        <template lwc:if={isAdmin}>
            <section class="slds-var-m-top_medium" data-id="mappings-section">
                <h2 class="slds-text-heading_small">{labels.mappingsHeading}</h2>
                <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-var-m-vertical_x-small">
                    <p class="slds-text-body_small slds-var-m-right_x-small" data-id="mappings-intro">{labels.mappingsIntro}</p>
                    <c-barn-help learn-more-url={learnMoreUrl} data-id="mappings-help"></c-barn-help>
                </div>
                <template lwc:if={mappingsError}>
                    <c-barn-notice variant="error" message={mappingsError} data-id="mappings-error"></c-barn-notice>
                </template>
                <template lwc:elseif={hasMappings}>
                    <lightning-datatable
                        key-field="id"
                        data={mappings}
                        columns={mappingColumns}
                        hide-checkbox-column
                        data-id="mappings"
                    ></lightning-datatable>
                </template>
                <template lwc:else>
                    <c-barn-empty-state
                        data-id="mappings-empty"
                        illustration="no-data"
                        heading={labels.mappingsEmpty}
                        message={labels.mappingsEmptyHint}
                    >
                        <lightning-button
                            data-id="create-template"
                            label={labels.createTemplate}
                            onclick={handleCreateTemplate}
                        ></lightning-button>
                    </c-barn-empty-state>
                </template>
            </section>
        </template>

        <div class="slds-var-m-top_medium">
            <c-data-job-history></c-data-job-history>
        </div>

        <template lwc:if={isAdmin}>
            <div class="slds-var-m-top_medium">
                <c-barn-tool-grid groups={salesforceGroups} data-id="salesforce-tools"></c-barn-tool-grid>
            </div>
        </template>
        </template>
    </c-barn-page-shell>
    </template>
</template>
