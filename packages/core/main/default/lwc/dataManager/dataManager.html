<template>
    <c-barn-page-shell
        title={labels.title}
        purpose={labels.intro}
        title-hidden
        help-storage-key="dataManager"
        data-id="shell"
    >
        <div slot="help" class="slds-var-p-bottom_small" data-id="help">
            <p>{labels.helpChange}</p>
            <p class="slds-var-m-top_xx-small">{labels.helpDelete}</p>
            <c-barn-help learn-more-url={learnMoreUrl}></c-barn-help>
        </div>

        <c-barn-tool-grid groups={toolGroups} onselect={handleSelect} data-id="tools"></c-barn-tool-grid>

        <template lwc:if={isAdmin}>
            <section class="slds-var-m-top_medium" data-id="mappings-section">
                <h2 class="slds-text-heading_small">{labels.mappingsHeading}</h2>
                <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-var-m-vertical_x-small">
                    <p class="slds-text-body_small slds-var-m-right_x-small" data-id="mappings-intro">{labels.mappingsIntro}</p>
                    <c-barn-help learn-more-url={learnMoreUrl} data-id="mappings-help"></c-barn-help>
                </div>
                <template lwc:if={mappingsError}>
                    <p role="alert" class="slds-text-color_error" data-id="mappings-error">{mappingsError}</p>
                </template>
                <template lwc:elseif={hasMappings}>
                    <lightning-datatable
                        key-field="id"
                        data={mappings}
                        columns={mappingColumns}
                        hide-checkbox-column
                        data-id="mappings"
                    ></lightning-datatable>
                </template>
                <template lwc:else>
                    <c-barn-empty-state
                        data-id="mappings-empty"
                        illustration="no-data"
                        heading={labels.mappingsEmpty}
                        message={labels.mappingsEmptyHint}
                    >
                        <lightning-button
                            data-id="create-template"
                            label={labels.createTemplate}
                            onclick={handleCreateTemplate}
                        ></lightning-button>
                    </c-barn-empty-state>
                </template>
            </section>
        </template>

        <div class="slds-var-m-top_medium">
            <c-data-job-history></c-data-job-history>
        </div>

        <template lwc:if={isAdmin}>
            <div class="slds-var-m-top_medium">
                <c-barn-tool-grid groups={salesforceGroups} data-id="salesforce-tools"></c-barn-tool-grid>
            </div>
        </template>
    </c-barn-page-shell>
</template>
