<template>
    <template lwc:if={helpReady}>
    <div>
        <div>
            <h2 class="slds-text-heading_medium slds-var-m-bottom_small">{labels.title}</h2>
            <p class="slds-var-m-bottom_small" data-id="intro">{labels.intro}</p>

            <template lwc:if={errorMessage}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    data-id="error"
                    variant="error"
                    message={errorMessage}
                ></c-barn-notice>
            </template>
            <template lwc:if={noticeMessage}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    data-id="notice"
                    variant="success"
                    message={noticeMessage}
                ></c-barn-notice>
            </template>

            <lightning-layout multiple-rows vertical-align="end">
                <lightning-layout-item size="12" medium-device-size="6" padding="horizontal-small">
                    <lightning-combobox
                        data-id="object"
                        label={labels.chooseLabel}
                        placeholder={labels.choosePlaceholder}
                        options={objectOptions}
                        value={objectName}
                        disabled={pickerDisabled}
                        onchange={handleObject}
                    ></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="12" medium-device-size="6" padding="horizontal-small">
                    <lightning-button-group>
                        <lightning-button
                            data-id="count-again"
                            label={labels.countAgain}
                            disabled={countAgainDisabled}
                            onclick={handleCountAgain}
                        ></lightning-button>
                        <lightning-button
                            data-id="save"
                            label={labels.save}
                            variant="brand"
                            disabled={saveDisabled}
                            onclick={handleSave}
                        ></lightning-button>
                    </lightning-button-group>
                    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="save-help">{labels.saveHelp}</p>
                </lightning-layout-item>
            </lightning-layout>

            <template lwc:if={showProgress}>
                <div class="slds-var-m-vertical_small" data-id="progress">
                    <lightning-progress-bar value={progressValue} size="medium"></lightning-progress-bar>
                    <p class="slds-text-body_small slds-var-m-top_xx-small" role="status" aria-live="polite">
                        {progressText}
                    </p>
                </div>
            </template>

            <template lwc:if={tooLargeMessage}>
                <c-barn-notice
                    class="slds-var-m-vertical_small"
                    data-id="too-large"
                    variant="warning"
                    message={tooLargeMessage}
                ></c-barn-notice>
            </template>
            <template lwc:if={hasNoRecords}>
                <c-barn-empty-state
                    class="slds-var-m-vertical_small"
                    data-id="no-records"
                    illustration="no-data"
                    heading={labels.noRecords}
                ></c-barn-empty-state>
            </template>
            <template lwc:if={hasNoFields}>
                <c-barn-empty-state
                    class="slds-var-m-vertical_small"
                    data-id="no-fields"
                    illustration="no-data"
                    heading={labels.noFields}
                ></c-barn-empty-state>
            </template>

            <template lwc:if={hasRows}>
                <template lwc:if={previousTakenAt}>
                    <p class="slds-text-body_small slds-var-m-bottom_x-small" data-id="compared">
                        {labels.comparedWith}
                        <lightning-formatted-date-time
                            value={previousTakenAt}
                            year="numeric"
                            month="short"
                            day="2-digit"
                            hour="2-digit"
                            minute="2-digit"
                        ></lightning-formatted-date-time>
                    </p>
                </template>
                <template lwc:if={showNeverSaved}>
                    <p class="slds-text-body_small slds-var-m-bottom_x-small" data-id="never-saved">
                        {labels.neverSaved}
                    </p>
                </template>
                <lightning-input
                    class="slds-var-m-bottom_x-small"
                    data-id="technical-names"
                    type="toggle"
                    label={labels.showTechnicalNames}
                    message-toggle-active=""
                    message-toggle-inactive=""
                    checked={showTechnicalNames}
                    onchange={handleTechnicalNames}
                ></lightning-input>
                <lightning-datatable
                    data-id="results"
                    key-field="key"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    onsort={handleSort}
                    onrowaction={handleRowAction}
                ></lightning-datatable>
            </template>

            <template lwc:if={notCountedMessage}>
                <c-barn-notice
                    class="slds-var-m-top_small"
                    data-id="not-counted"
                    variant="warning"
                    message={notCountedMessage}
                ></c-barn-notice>
            </template>

            <template lwc:if={showPicklistUsage}>
                <c-picklist-usage object-name={objectName} disabled={pickerDisabled}></c-picklist-usage>
            </template>

            <template lwc:if={showHistory}>
                <div class="slds-var-m-top_large" data-id="history">
                    <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">
                        {historyLabels.title}
                    </h3>
                    <template lwc:if={hasHistory}>
                        <p class="slds-text-body_small slds-var-m-bottom_x-small">
                            {historyLabels.intro}
                        </p>
                        <lightning-datatable
                            data-id="history-table"
                            key-field="key"
                            data={historyRows}
                            columns={historyColumns}
                            hide-checkbox-column
                            onrowaction={handleHistoryAction}
                        ></lightning-datatable>
                        <template lwc:if={historyLimitMessage}>
                            <p class="slds-text-body_small slds-var-m-top_x-small" data-id="history-limit">
                                {historyLimitMessage}
                            </p>
                        </template>
                    </template>
                    <template lwc:else>
                        <c-barn-empty-state
                            data-id="history-empty"
                            size="compact"
                            heading={historyLabels.empty}
                        ></c-barn-empty-state>
                    </template>

                    <template lwc:if={viewTitle}>
                        <div class="slds-var-m-top_medium" data-id="snapshot-view">
                            <div class="slds-grid slds-grid_vertical-align-center slds-var-m-bottom_x-small">
                                <h4 class="slds-text-title_bold slds-col">{viewTitle}</h4>
                                <lightning-button
                                    data-id="view-close"
                                    label={historyLabels.viewClose}
                                    variant="neutral"
                                    onclick={handleViewClose}
                                ></lightning-button>
                            </div>
                            <lightning-datatable
                                data-id="snapshot-rows"
                                key-field="key"
                                data={viewRows}
                                columns={viewColumns}
                                hide-checkbox-column
                            ></lightning-datatable>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
    </template>
</template>
