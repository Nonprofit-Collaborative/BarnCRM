<template>
  <lightning-modal-header label={label}></lightning-modal-header>
  <lightning-modal-body>
    <p data-id="message">{message}</p>
    <template for:each={detailLines} for:item="line">
      <p key={line.key} class="slds-var-m-top_x-small" data-id="detail">{line.text}</p>
    </template>
    <template lwc:if={asksToType}>
      <lightning-input
        class="slds-show slds-var-m-top_small"
        label={typeToConfirmLabel}
        autocomplete="off"
        data-id="type-to-confirm"
        onchange={handleTyped}
      ></lightning-input>
    </template>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button
      label={cancelLabel}
      onclick={handleCancel}
      data-id="cancel"
    ></lightning-button>
    <lightning-button
      class="slds-var-m-left_x-small"
      variant={buttonVariant}
      label={confirmLabel}
      disabled={confirmDisabled}
      onclick={handleConfirm}
      data-id="confirm"
    ></lightning-button>
  </lightning-modal-footer>
</template>
