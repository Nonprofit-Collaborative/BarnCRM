<template>
  <lightning-card title={labels.panelTitle} icon-name="standard:address">
    <template lwc:if={canAdd}>
      <lightning-button
        slot="actions"
        label={labels.addButton}
        onclick={handleAdd}
        data-id="add-address"
      ></lightning-button>
    </template>

    <div class="slds-var-p-horizontal_medium slds-is-relative">
      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <div role="alert" class="slds-text-color_error slds-var-m-bottom_small" data-id="error">
          {errorMessage}
        </div>
      </template>

      <template lwc:if={isEmpty}>
        <c-barn-empty-state heading={labels.emptyHeading} message={labels.emptyMessage} data-id="empty">
          <template lwc:if={canAdd}>
            <lightning-button label={labels.addButton} onclick={handleAdd} data-id="empty-add"></lightning-button>
          </template>
        </c-barn-empty-state>
      </template>

      <template for:each={groups} for:item="group">
        <div key={group.key} data-id={group.dataId}>
          <template lwc:if={group.isFormer}>
            <h3 class="slds-section__title slds-var-m-vertical_small">
              <button
                class="slds-button slds-section__title-action"
                aria-expanded={group.expanded}
                onclick={handleToggleFormer}
                data-id="former-toggle"
              >
                <lightning-icon
                  icon-name={group.icon}
                  size="x-small"
                  class="slds-var-m-right_x-small"
                ></lightning-icon>
                <span>{group.heading}</span>
              </button>
            </h3>
          </template>
          <template for:each={group.cards} for:item="address">
            <div key={address.id} class={address.cardClass} data-id="address-card">
              <template lwc:if={address.flagUndeliverable}>
                <div
                  role="alert"
                  class="slds-text-color_error slds-var-m-bottom_x-small"
                  data-id="undeliverable-primary"
                >
                  {labels.undeliverablePrimary}
                </div>
              </template>
              <div class="slds-media slds-media_small">
                <div class="slds-media__figure">
                  <lightning-icon icon-name="utility:location" size="small" data-id="address-icon"></lightning-icon>
                </div>
                <div class="slds-media__body">
                  <div class="slds-grid slds-grid_vertical-align-start">
                    <div class="slds-col slds-grid slds-wrap slds-grid_vertical-align-center">
                      <p class="slds-text-title_caps slds-var-m-right_x-small" data-id="address-type">
                        {address.addressType}
                      </p>
                      <template lwc:if={address.isDefault}>
                        <lightning-badge label={labels.defaultBadge} data-id="default-badge"></lightning-badge>
                      </template>
                      <template lwc:if={address.isUndeliverable}>
                        <lightning-badge
                          label={labels.undeliverableBadge}
                          class="slds-theme_error"
                          data-id="undeliverable-badge"
                        ></lightning-badge>
                      </template>
                    </div>
                    <template lwc:if={address.showStatusMenu}>
                      <lightning-button-menu
                        alternative-text={labels.statusMenu}
                        title={labels.statusMenu}
                        menu-alignment="auto"
                        icon-size="small"
                        data-id={address.id}
                        onselect={handleStatusSelect}
                        class="status-menu slds-no-flex"
                      >
                        <template for:each={address.statusActions} for:item="action">
                          <lightning-menu-item
                            key={action.value}
                            value={action.value}
                            label={action.label}
                          ></lightning-menu-item>
                        </template>
                      </lightning-button-menu>
                    </template>
                  </div>
                  <p data-id="address-street">{address.street}</p>
                  <p data-id="address-city">{address.cityLine}</p>
                  <p data-id="address-country">{address.country}</p>
                  <template lwc:if={address.seasonalText}>
                    <p class="slds-text-body_small" data-id="address-seasonal">
                      {address.seasonalText}
                    </p>
                  </template>
                  <template lwc:if={address.dateText}>
                    <p class="slds-text-body_small" data-id="address-dates">{address.dateText}</p>
                  </template>
                  <template lwc:if={address.hasCardFields}>
                    <lightning-record-view-form
                      record-id={address.id}
                      object-api-name={addressObject}
                      density="compact"
                      data-id="card-fields"
                    >
                      <template for:each={address.cardFields} for:item="field">
                        <lightning-output-field
                          key={field.apiName}
                          field-name={field.apiName}
                        ></lightning-output-field>
                      </template>
                    </lightning-record-view-form>
                  </template>
                  <div class="slds-grid slds-wrap">
                    <template lwc:if={canSetDefault}>
                      <template lwc:if={address.showSetDefault}>
                        <lightning-button
                          label={labels.setDefaultButton}
                          data-id={address.id}
                          onclick={handleSetDefault}
                          class="set-default slds-var-m-top_x-small slds-var-m-right_x-small"
                        ></lightning-button>
                      </template>
                    </template>
                    <template lwc:if={address.showUseForHousehold}>
                      <lightning-button
                        label={labels.useForHouseholdButton}
                        data-id={address.id}
                        disabled={moveBusy}
                        onclick={handleUseForHousehold}
                        class="use-for-household slds-var-m-top_x-small slds-var-m-right_x-small"
                      ></lightning-button>
                    </template>
                    <template lwc:if={address.showUpdateEveryone}>
                      <lightning-button
                        label={labels.updateEveryoneButton}
                        data-id={address.id}
                        disabled={moveBusy}
                        onclick={handleUpdateEveryone}
                        class="update-everyone slds-var-m-top_x-small slds-var-m-right_x-small"
                      ></lightning-button>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-box slds-var-m-top_small" data-id="add-form">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addFormTitle}</h3>
          <lightning-record-edit-form
            object-api-name={addressObject}
            onsuccess={handleFormSuccess}
            onerror={handleFormError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name={ownerFieldName}
              value={recordId}
              variant="label-hidden"
            ></lightning-input-field>
            <template lwc:if={isFirstAddress}>
              <lightning-input-field
                field-name="Is_Default__c"
                value={isFirstAddress}
                class="slds-hide"
                data-id="first-address-default"
              ></lightning-input-field>
            </template>
            <template lwc:else>
              <!-- A new address saved as the primary is a move: it ends the old one (R-AD10). -->
              <lightning-input-field
                field-name="Is_Default__c"
                data-id="new-address-primary"
              ></lightning-input-field>
            </template>
            <template for:each={formFields} for:item="fieldName">
              <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
            </template>
            <div class="slds-var-m-top_small">
              <lightning-button
                variant="neutral"
                label={labels.cancelButton}
                onclick={handleCancel}
                data-id="cancel"
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="brand"
                type="submit"
                label={labels.addButton}
                data-id="save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
