<template>
    <template lwc:if={isShown}>
  <lightning-card title={labels.panelTitle} icon-name={icons.address}>
    <template lwc:if={canAdd}>
      <lightning-button
        slot="actions"
        label={labels.addButton}
        onclick={handleAdd}
        data-id="add-address"
      ></lightning-button>
    </template>

    <div class="slds-var-p-horizontal_medium slds-is-relative">
      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <c-barn-notice
          class="slds-var-m-bottom_small"
          variant="error"
          message={errorMessage}
          data-id="error"
        ></c-barn-notice>
      </template>

      <template lwc:if={isEmpty}>
        <c-barn-empty-state heading={labels.emptyHeading} message={labels.emptyMessage} data-id="empty">
          <template lwc:if={canAdd}>
            <lightning-button label={labels.addButton} onclick={handleAdd} data-id="empty-add"></lightning-button>
          </template>
        </c-barn-empty-state>
      </template>

      <template for:each={groups} for:item="group">
        <div key={group.key} data-id={group.dataId}>
          <template lwc:if={group.isFormer}>
            <h3 class="slds-section__title slds-var-m-vertical_small">
              <button
                class="slds-button slds-section__title-action"
                aria-expanded={group.expanded}
                onclick={handleToggleFormer}
                data-id="former-toggle"
              >
                <lightning-icon
                  icon-name={group.icon}
                  size="x-small"
                  class="slds-var-m-right_x-small"
                ></lightning-icon>
                <span>{group.heading}</span>
              </button>
            </h3>
          </template>
          <ul class="slds-has-dividers_bottom-space">
          <template for:each={group.cards} for:item="address">
            <li key={address.id} class={address.rowClass} data-id="address-card">
              <template lwc:if={address.flagUndeliverable}>
                <c-barn-notice
                  class="slds-var-m-bottom_x-small"
                  variant="warning"
                  message={labels.undeliverablePrimary}
                  data-id="undeliverable-primary"
                ></c-barn-notice>
              </template>
              <div class="slds-media slds-media_small">
                <div class="slds-media__figure" aria-hidden="true">
                  <lightning-avatar
                    variant="circle"
                    size="small"
                    fallback-icon-name="standard:address"
                    data-id="address-icon"
                  ></lightning-avatar>
                </div>
                <div class="slds-media__body">
                  <div class="slds-grid slds-grid_vertical-align-start">
                    <div class="slds-col slds-grid slds-wrap slds-grid_vertical-align-center">
                      <h3 class="slds-text-heading_small slds-var-m-right_x-small">
                        <a
                          href={address.href}
                          data-record-id={address.id}
                          onclick={handleOpenRecord}
                          data-id="address-type"
                        >{address.headline}</a>
                      </h3>
                      <template lwc:if={address.isDefault}>
                        <c-barn-status-badge
                          class="slds-var-m-right_xx-small"
                          status="success"
                          icon-name="utility:favorite"
                          label={labels.defaultBadge}
                          data-id="default-badge"
                        ></c-barn-status-badge>
                      </template>
                      <template lwc:if={address.isUndeliverable}>
                        <c-barn-status-badge
                          status="error"
                          label={labels.undeliverableBadge}
                          data-id="undeliverable-badge"
                        ></c-barn-status-badge>
                      </template>
                    </div>
                    <template lwc:if={address.showMoreMenu}>
                      <lightning-button-menu
                        alternative-text={labels.moreMenu}
                        title={labels.moreMenu}
                        menu-alignment="auto"
                        icon-size="small"
                        data-id={address.id}
                        disabled={moveBusy}
                        onselect={handleMoreSelect}
                        class="status-menu slds-no-flex"
                      >
                        <template for:each={address.menuActions} for:item="action">
                          <lightning-menu-item
                            key={action.value}
                            value={action.value}
                            label={action.label}
                          ></lightning-menu-item>
                        </template>
                      </lightning-button-menu>
                    </template>
                  </div>
                  <p data-id="address-street">{address.street}</p>
                  <p data-id="address-city">{address.cityLine}</p>
                  <p data-id="address-country">{address.country}</p>
                  <template lwc:if={address.seasonalText}>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="address-seasonal">
                      {address.seasonalText}
                    </p>
                  </template>
                  <template lwc:if={address.dateText}>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="address-dates">{address.dateText}</p>
                  </template>
                  <template lwc:if={address.hasCardFields}>
                    <lightning-record-view-form
                      record-id={address.id}
                      object-api-name={addressObject}
                      density="compact"
                      data-id="card-fields"
                    >
                      <template for:each={address.cardFields} for:item="field">
                        <lightning-output-field
                          key={field.apiName}
                          field-name={field.apiName}
                        ></lightning-output-field>
                      </template>
                    </lightning-record-view-form>
                  </template>
                  <template lwc:if={canSetDefault}>
                    <template lwc:if={address.showSetDefault}>
                      <lightning-button
                        label={labels.setDefaultButton}
                        data-id={address.id}
                        onclick={handleSetDefault}
                        class="set-default slds-var-m-top_x-small"
                      ></lightning-button>
                    </template>
                  </template>
                </div>
              </div>
            </li>
          </template>
          </ul>
        </div>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-box slds-var-m-top_small" data-id="add-form">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addFormTitle}</h3>
          <lightning-record-edit-form
            object-api-name={addressObject}
            onsuccess={handleFormSuccess}
            onerror={handleFormError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name={ownerFieldName}
              value={recordId}
              variant="label-hidden"
            ></lightning-input-field>
            <template lwc:if={isFirstAddress}>
              <lightning-input-field
                field-name={isDefaultField}
                value={isFirstAddress}
                class="slds-hide"
                data-id="first-address-default"
              ></lightning-input-field>
            </template>
            <template lwc:else>
              <!-- A new address saved as the primary is a move: it ends the old one (R-AD10). -->
              <lightning-input-field
                field-name={isDefaultField}
                data-id="new-address-primary"
              ></lightning-input-field>
            </template>
            <template for:each={formFields} for:item="fieldName">
              <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
            </template>
            <div class="slds-var-m-top_small">
              <lightning-button
                variant="neutral"
                label={labels.cancelButton}
                onclick={handleCancel}
                data-id="cancel"
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="brand"
                type="submit"
                label={labels.addButton}
                data-id="save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </template>
    </div>
  </lightning-card>
    </template>
</template>
