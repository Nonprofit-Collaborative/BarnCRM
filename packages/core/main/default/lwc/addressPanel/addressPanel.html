<template>
  <lightning-card title={labels.panelTitle} icon-name="standard:address">
    <template lwc:if={canAdd}>
      <lightning-button
        slot="actions"
        label={labels.addButton}
        onclick={handleAdd}
        data-id="add-address"
      ></lightning-button>
    </template>

    <div class="slds-var-p-horizontal_medium slds-is-relative">
      <template lwc:if={isLoading}>
        <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <div role="alert" class="slds-text-color_error slds-var-m-bottom_small" data-id="error">
          {errorMessage}
        </div>
      </template>

      <template lwc:if={isEmpty}>
        <p class="slds-text-body_regular" data-id="empty">{labels.emptyMessage}</p>
      </template>

      <template for:each={cards} for:item="address">
        <div key={address.id} class={address.cardClass} data-id="address-card">
          <div class="slds-grid slds-grid_align-spread">
            <div>
              <p class="slds-text-title_caps" data-id="address-type">{address.addressType}</p>
              <p data-id="address-street">{address.street}</p>
              <p data-id="address-city">{address.cityLine}</p>
              <p data-id="address-country">{address.country}</p>
              <template lwc:if={address.seasonalText}>
                <p class="slds-text-body_small" data-id="address-seasonal">
                  {address.seasonalText}
                </p>
              </template>
            </div>
            <div>
              <template lwc:if={address.isDefault}>
                <lightning-badge label={labels.defaultBadge} data-id="default-badge"></lightning-badge>
              </template>
              <template lwc:if={canSetDefault}>
                <template lwc:if={address.showSetDefault}>
                  <lightning-button
                    label={labels.setDefaultButton}
                    data-id={address.id}
                    onclick={handleSetDefault}
                    class="set-default"
                  ></lightning-button>
                </template>
              </template>
              <template lwc:if={address.showUseForHousehold}>
                <lightning-button
                  label={labels.useForHouseholdButton}
                  data-id={address.id}
                  onclick={handleUseForHousehold}
                  class="use-for-household slds-var-m-left_x-small"
                ></lightning-button>
              </template>
              <template lwc:if={address.showUpdateEveryone}>
                <lightning-button
                  label={labels.updateEveryoneButton}
                  data-id={address.id}
                  onclick={handleUpdateEveryone}
                  class="update-everyone slds-var-m-left_x-small"
                ></lightning-button>
              </template>
            </div>
          </div>
        </div>
      </template>

      <template lwc:if={isMovingForHousehold}>
        <div class="slds-box slds-var-m-top_small" data-id="use-for-household-confirm">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">
            {labels.useForHouseholdTitle}
          </h3>
          <p class="slds-var-m-bottom_small">{labels.useForHouseholdHelp}</p>
          <template lwc:if={showHouseholdPicker}>
            <lightning-radio-group
              label={labels.useForHouseholdPick}
              options={householdOptions}
              value={moveHouseholdId}
              onchange={handlePickHousehold}
              data-id="household-picker"
            ></lightning-radio-group>
          </template>
          <div class="slds-var-m-top_small">
            <lightning-button
              label={labels.cancelButton}
              onclick={handleCancelMove}
              data-id="cancel-move"
            ></lightning-button>
            <lightning-button
              class="slds-var-m-left_x-small"
              variant="brand"
              label={labels.useForHouseholdButton}
              onclick={handleConfirmMove}
              disabled={moveBusy}
              data-id="confirm-move"
            ></lightning-button>
          </div>
        </div>
      </template>

      <template lwc:if={isMovingEveryone}>
        <div class="slds-box slds-var-m-top_small" data-id="update-everyone-confirm">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">
            {labels.updateEveryoneTitle}
          </h3>
          <template lwc:if={hasMoving}>
            <p>{labels.updateEveryoneMoving}</p>
            <ul class="slds-list_dotted slds-var-m-bottom_small">
              <template for:each={move.moving} for:item="person">
                <li key={person.id} data-id="moving-person">{person.name}</li>
              </template>
            </ul>
          </template>
          <template lwc:else>
            <p class="slds-var-m-bottom_small" data-id="nobody-moving">
              {labels.updateEveryoneNobody}
            </p>
          </template>
          <template lwc:if={hasWithTheirOwn}>
            <p>{labels.updateEveryoneOwn}</p>
            <template for:each={move.withTheirOwn} for:item="person">
              <lightning-input
                key={person.id}
                type="checkbox"
                label={person.name}
                data-id={person.id}
                onchange={handleTick}
                class="own-address-person"
              ></lightning-input>
            </template>
          </template>
          <div class="slds-var-m-top_small">
            <lightning-button
              label={labels.cancelButton}
              onclick={handleCancelMove}
              data-id="cancel-move"
            ></lightning-button>
            <lightning-button
              class="slds-var-m-left_x-small"
              variant="brand"
              label={labels.updateEveryoneButton}
              onclick={handleConfirmMove}
              disabled={moveBusy}
              data-id="confirm-move"
            ></lightning-button>
          </div>
        </div>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-box slds-var-m-top_small" data-id="add-form">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addFormTitle}</h3>
          <lightning-record-edit-form
            object-api-name={addressObject}
            onsuccess={handleFormSuccess}
            onerror={handleFormError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name={ownerFieldName}
              value={recordId}
              variant="label-hidden"
            ></lightning-input-field>
            <template lwc:if={isFirstAddress}>
              <lightning-input-field
                field-name="Is_Default__c"
                value={isFirstAddress}
                class="slds-hide"
                data-id="first-address-default"
              ></lightning-input-field>
            </template>
            <template for:each={formFields} for:item="fieldName">
              <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
            </template>
            <div class="slds-var-m-top_small">
              <lightning-button
                variant="neutral"
                label={labels.cancelButton}
                onclick={handleCancel}
                data-id="cancel"
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="brand"
                type="submit"
                label={labels.addButton}
                data-id="save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
