<template>
    <template lwc:if={helpReady}>
  <lightning-quick-action-panel header={label.title}>
    <template lwc:if={allowed}>
      <c-barn-notice
        class="slds-var-m-bottom_small"
        variant="warning"
        message={label.warning}
        data-id="warning"
      ></c-barn-notice>
      <template lwc:if={error}>
        <c-barn-notice
          class="slds-var-m-bottom_small"
          variant="error"
          message={error}
          data-id="error"
        ></c-barn-notice>
      </template>
      <template lwc:if={working}>
        <lightning-spinner alternative-text={label.working} size="small"></lightning-spinner>
      </template>
      <template lwc:if={hasRows}>
        <lightning-datatable
          key-field="key"
          data={rows}
          columns={columns}
          hide-checkbox-column
          aria-label={label.changesTable}
          data-id="changes"
        ></lightning-datatable>
      </template>
      <!-- Present from the start, so screen readers announce the result when it appears. -->
      <div role="status" data-id="status">
        <template lwc:if={erased}>
          <c-barn-notice
            class="slds-var-m-top_small"
            variant="success"
            message={label.done}
            data-id="done"
          ></c-barn-notice>
        </template>
      </div>
      <template lwc:if={confirming}>
        <lightning-input
          class="slds-var-m-top_small"
          label={label.reference}
          field-level-help={label.referenceHelp}
          max-length="80"
          value={reference}
          onchange={handleReference}
          data-id="reference"
        ></lightning-input>
        <lightning-input
          label={confirmLabel}
          value={typedName}
          onchange={handleTypedName}
          data-id="confirm"
        ></lightning-input>
      </template>
    </template>
    <template lwc:else>
      <p data-id="no-permission">{label.noPermission}</p>
    </template>
    <div slot="footer">
      <lightning-button label={label.close} onclick={handleClose} data-id="close"></lightning-button>
      <template lwc:if={allowed}>
        <template lwc:if={erased}>
          <lightning-button
            class="slds-var-m-left_x-small"
            variant="brand"
            label={label.openAudit}
            onclick={handleOpenAudit}
            data-id="open-audit"
          ></lightning-button>
        </template>
        <template lwc:else>
          <lightning-button
            class="slds-var-m-left_x-small"
            label={label.preview}
            onclick={handlePreview}
            disabled={working}
            data-id="preview"
          ></lightning-button>
          <template lwc:if={hasRows}>
            <lightning-button
              class="slds-var-m-left_x-small"
              variant="destructive"
              label={label.erase}
              onclick={handleErase}
              disabled={eraseDisabled}
              data-id="erase"
            ></lightning-button>
          </template>
        </template>
      </template>
    </div>
  </lightning-quick-action-panel>
    </template>
</template>
