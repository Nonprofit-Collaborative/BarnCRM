<template>
    <template lwc:if={helpReady}>
        <section data-id="archived-records">
            <h2 class="slds-text-heading_medium">{labels.title}</h2>
            <p class="slds-var-m-vertical_x-small">{labels.intro}</p>
            <c-barn-notice variant="info" message={labels.everyField} data-id="every-field"></c-barn-notice>
            <template lwc:if={errorMessage}>
                <c-barn-notice variant="error" message={errorMessage} data-id="error"></c-barn-notice>
            </template>
            <template lwc:if={noticeMessage}>
                <c-barn-notice variant="success" message={noticeMessage} data-id="notice"></c-barn-notice>
            </template>
            <template lwc:if={loading}>
                <lightning-spinner size="small" alternative-text={labels.title}></lightning-spinner>
            </template>
            <template lwc:elseif={viewer}>
                <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small" data-id="usage">{usageText}</p>
                <template lwc:if={hasObjects}>
                    <div class="slds-grid slds-grid_vertical-align-end slds-wrap slds-gutters_x-small slds-var-m-top_small" data-id="filters">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                            <lightning-combobox
                                label={labels.object}
                                options={objectOptions}
                                value={objectName}
                                onchange={handleObject}
                                data-id="object"
                            ></lightning-combobox>
                        </div>
                        <div class="slds-col">
                            <lightning-input type="date" label={labels.fromDay} value={fromDay} onchange={handleFrom} data-id="from"></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-input type="date" label={labels.toDay} value={toDay} onchange={handleTo} data-id="to"></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-button label={labels.show} variant="brand" disabled={busy} onclick={handleShow} data-id="show"></lightning-button>
                        </div>
                    </div>

                    <template lwc:if={hasRows}>
                        <h3 class="slds-text-heading_small slds-var-m-top_medium">{labels.rowsHeading}</h3>
                        <template lwc:if={canRestore}>
                            <p class="slds-text-body_small slds-var-m-vertical_x-small" data-id="restore-note">{labels.restoreNote}</p>
                        </template>
                        <lightning-datatable
                            key-field="id"
                            data={rows}
                            columns={columns}
                            hide-checkbox-column={hideCheckbox}
                            max-row-selection={mostRestored}
                            onrowselection={handleSelection}
                            onrowaction={handleRowAction}
                            data-id="rows"
                        ></lightning-datatable>
                        <div class="slds-grid slds-wrap slds-var-m-top_small" data-id="paging">
                            <lightning-button label={labels.previous} disabled={previousDisabled} onclick={handlePrevious} data-id="previous"></lightning-button>
                            <lightning-button class="slds-var-m-left_x-small" label={labels.next} disabled={nextDisabled} onclick={handleNext} data-id="next"></lightning-button>
                            <template lwc:if={canRestore}>
                                <lightning-button
                                    class="slds-col_bump-left"
                                    variant="brand"
                                    icon-name="utility:undo"
                                    label={restoreLabel}
                                    disabled={restoreDisabled}
                                    onclick={handleRestore}
                                    data-id="restore"
                                ></lightning-button>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={showNoRows}>
                        <p class="slds-text-color_weak slds-var-m-top_small" data-id="no-rows">{labels.noRows}</p>
                    </template>

                    <template lwc:if={detail}>
                        <section class="slds-box slds-var-m-top_medium" data-id="detail" aria-label={detail.heading}>
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <h3 class="slds-text-heading_small">{detail.heading}</h3>
                                <lightning-button class="slds-col_bump-left" variant="base" label={labels.close} onclick={handleCloseDetail} data-id="close"></lightning-button>
                            </div>
                            <h4 class="slds-text-title_bold slds-var-m-top_small">{labels.fieldsHeading}</h4>
                            <dl class="slds-dl_horizontal slds-var-m-top_x-small" data-id="fields">
                                <template for:each={detail.fields} for:item="field">
                                    <dt key={field.name} class="slds-dl_horizontal__label slds-truncate" title={field.name}>{field.label}</dt>
                                    <dd key={field.valueKey} class="slds-dl_horizontal__detail">{field.value}</dd>
                                </template>
                            </dl>
                            <template lwc:if={detail.hasChildren}>
                                <h4 class="slds-text-title_bold slds-var-m-top_small">{labels.relatedHeading}</h4>
                                <ul class="slds-var-m-top_x-small" data-id="related">
                                    <template for:each={detail.children} for:item="group">
                                        <li key={group.objectName}>{group.text}</li>
                                    </template>
                                </ul>
                            </template>
                        </section>
                    </template>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak slds-var-m-top_small" data-id="no-objects">{labels.noObjects}</p>
                </template>
            </template>
        </section>
    </template>
</template>
