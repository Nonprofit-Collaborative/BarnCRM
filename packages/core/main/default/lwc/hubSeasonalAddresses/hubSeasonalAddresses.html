<template>
    <template lwc:if={helpReady}>
    <lightning-card title={labels.heading} icon-name="standard:address">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={errorMessage}>
                <c-barn-notice variant="error" message={errorMessage} data-id="load-error"></c-barn-notice>
            </template>
            <template lwc:elseif={lastRun}>
                <p data-id="seasonal-last-run">
                    <lightning-formatted-date-time
                        value={lastRun}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time>
                </p>
                <template lwc:if={lastRunSummary}>
                    <p class="slds-text-body_small slds-text-color_weak" data-id="seasonal-last-run-summary">
                        {lastRunSummary}
                    </p>
                </template>
            </template>
            <template lwc:elseif={loaded}>
                <c-barn-status-badge
                    status="not run"
                    label={labels.notRun}
                    data-id="seasonal-not-run"
                ></c-barn-status-badge>
                <p class="slds-text-body_small slds-text-color_weak" data-id="seasonal-never">{labels.never}</p>
            </template>
            <template lwc:if={notScheduled}>
                <c-barn-notice
                    message={labels.notScheduled}
                    data-id="seasonal-not-scheduled"
                    class="slds-var-m-vertical_x-small"
                ></c-barn-notice>
            </template>
            <template lwc:if={stale}>
                <c-barn-status-badge
                    status="overdue"
                    label={labels.overdue}
                    data-id="seasonal-overdue"
                ></c-barn-status-badge>
                <c-barn-notice
                    variant="warning"
                    message={labels.stale}
                    data-id="seasonal-stale"
                    class="slds-var-m-vertical_x-small"
                ></c-barn-notice>
            </template>
            <lightning-button
                variant="base"
                label={labels.link}
                data-id="open-addresses"
                onclick={handleOpenAddresses}
            ></lightning-button>
        </div>
    </lightning-card>
    </template>
</template>
