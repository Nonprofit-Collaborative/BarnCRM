<template>
  <div class="slds-var-p-around_medium">
    <h2 class="slds-text-heading_medium slds-var-m-bottom_small">{title}</h2>

    <lightning-record-edit-form
      object-api-name={scheduleObject}
      record-id={scheduleId}
      onload={handleLoad}
      onsuccess={handleSuccess}
      onerror={handleError}
    >
      <lightning-messages></lightning-messages>
      <lightning-input-field field-name="Name"></lightning-input-field>
      <lightning-input-field field-name={fields.job} value={jobId}></lightning-input-field>
      <lightning-input-field field-name={fields.location}></lightning-input-field>
      <lightning-input-field field-name={fields.needed}></lightning-input-field>
      <lightning-input-field field-name={fields.weekdays} onchange={handleFieldChange}></lightning-input-field>
      <lightning-input-field field-name={fields.everyNWeeks} onchange={handleFieldChange}></lightning-input-field>
      <lightning-input-field field-name={fields.startTime} onchange={handleFieldChange}></lightning-input-field>
      <lightning-input-field field-name={fields.endTime}></lightning-input-field>
      <lightning-input-field field-name={fields.startDate} onchange={handleFieldChange}></lightning-input-field>
      <lightning-input-field field-name={fields.endDate} onchange={handleFieldChange}></lightning-input-field>
      <lightning-input-field field-name={fields.active} onchange={handleFieldChange}></lightning-input-field>
    </lightning-record-edit-form>

    <template lwc:if={previewText}>
      <p class="slds-var-m-top_small slds-text-body_regular" data-id="preview" aria-live="polite">{previewText}</p>
    </template>

    <div class="slds-var-m-top_medium slds-text-align_right">
      <lightning-button
        data-id="cancel"
        label={labels.cancel}
        onclick={handleCancel}
        class="slds-var-m-right_x-small"
      ></lightning-button>
      <lightning-button
        data-id="save"
        variant="brand"
        label={labels.save}
        disabled={saveDisabled}
        onclick={handleSave}
      ></lightning-button>
    </div>
  </div>
</template>
