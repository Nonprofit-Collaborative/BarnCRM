<template>
  <div class="slds-var-p-around_medium">
    <h2 class="slds-text-heading_medium slds-var-m-bottom_small">{labels.title}</h2>

    <template lwc:if={isLoading}>
      <div class="slds-is-relative slds-var-p-around_large" data-id="loading">
        <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
      </div>
    </template>

    <template lwc:if={blocker}>
      <c-barn-notice variant="error" message={blocker} data-id="blocker"></c-barn-notice>
    </template>

    <template lwc:if={showForm}>
      <lightning-record-edit-form
        object-api-name={hoursObject}
        onsuccess={handleSuccess}
        onerror={handleError}
      >
        <lightning-messages></lightning-messages>
        <div class="slds-var-p-horizontal_xx-small slds-var-m-bottom_x-small">
          <lightning-record-picker
            data-id="person-picker"
            label={labels.person}
            object-api-name={context.personObject}
            filter={personFilter}
            value={personId}
            required
            onchange={handlePersonChange}
          ></lightning-record-picker>
        </div>
        <lightning-input-field field-name="Volunteer_Job__c" value={context.jobId}></lightning-input-field>
        <lightning-input-field
          field-name="Volunteer_Shift__c"
          value={context.shiftId}
        ></lightning-input-field>
        <lightning-input-field
          field-name="Date_Worked__c"
          value={context.dateWorked}
          required
        ></lightning-input-field>
        <lightning-input-field field-name="Hours__c" value={context.hours} required></lightning-input-field>
        <lightning-input-field field-name="Notes__c"></lightning-input-field>
      </lightning-record-edit-form>
    </template>

    <div class="slds-var-m-top_medium slds-text-align_right">
      <lightning-button
        data-id="cancel"
        label={labels.cancel}
        onclick={handleCancel}
        class="slds-var-m-right_x-small"
      ></lightning-button>
      <lightning-button
        data-id="save"
        variant="brand"
        label={labels.save}
        disabled={saveDisabled}
        onclick={handleSave}
      ></lightning-button>
    </div>
  </div>
</template>
