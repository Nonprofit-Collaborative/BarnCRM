<template>
  <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name="custom:custom2">
      <div slot="actions">
        <template lwc:if={canClose}>
          <lightning-button
            data-id="close-shift"
            class="slds-var-m-right_x-small"
            label={labels.closeShift}
            disabled={busy}
            onclick={handleCloseShift}
          ></lightning-button>
        </template>
        <template lwc:if={canAdd}>
          <lightning-button
            data-id="add-button"
            label={labels.add}
            disabled={addDisabled}
            onclick={handleShowForm}
          ></lightning-button>
        </template>
      </div>

      <div class="slds-var-p-horizontal_medium slds-is-relative">
        <template lwc:if={showSpinner}>
          <lightning-spinner alternative-text={labels.loading} size="small" data-id="loading"></lightning-spinner>
        </template>

        <template lwc:if={hasError}>
          <div tabindex="-1" data-id="error-message" class="slds-var-m-bottom_small">
            <c-barn-notice variant="error" message={errorMessage}></c-barn-notice>
          </div>
        </template>

        <template lwc:if={loaded}>
          <div class="slds-grid slds-wrap slds-gutters_x-small">
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3 slds-var-m-bottom_x-small">
              <c-barn-stat-tile
                data-id="needed"
                label={labels.needed}
                value={panel.volunteersNeeded}
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3 slds-var-m-bottom_x-small">
              <c-barn-stat-tile
                data-id="filled"
                label={labels.filled}
                value={panel.slotsFilled}
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3 slds-var-m-bottom_x-small">
              <c-barn-stat-tile
                data-id="remaining"
                label={labels.remaining}
                value={panel.slotsRemaining}
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
          </div>
          <template lwc:if={hasMeter}>
            <div class="slds-var-m-bottom_small">
              <c-barn-meter
                data-id="filled-meter"
                label={labels.filled}
                value={panel.slotsFilled}
                max={panel.volunteersNeeded}
              ></c-barn-meter>
            </div>
          </template>
        </template>

        <template lwc:if={showForm}>
          <div data-id="add-form" class="slds-box slds-theme_shade slds-var-m-bottom_small">
            <lightning-record-picker
              data-id="person-picker"
              label={labels.person}
              object-api-name={personObjectApiName}
              filter={personFilter}
              required
              onchange={handlePersonChange}
            ></lightning-record-picker>
            <lightning-combobox
              data-id="draft-status"
              label={labels.status}
              value={draftStatus}
              options={statusOptions}
              onchange={handleDraftStatusChange}
            ></lightning-combobox>
            <div class="slds-var-m-top_small">
              <lightning-button
                data-id="save-button"
                variant="brand"
                label={labels.save}
                disabled={saveDisabled}
                onclick={handleSave}
              ></lightning-button>
              <lightning-button
                data-id="cancel-button"
                class="slds-var-m-left_x-small"
                label={labels.cancel}
                onclick={handleCancel}
              ></lightning-button>
            </div>
          </div>
        </template>

        <div data-id="result" tabindex="-1" role="status" class="slds-var-m-bottom_small">
          <template lwc:if={resultMessage}>
            <p class="slds-text-body_regular" data-id="result-text">
              <template lwc:if={resultIsWarning}>
                <lightning-icon
                  data-id="result-warning"
                  icon-name="utility:warning"
                  variant="warning"
                  size="x-small"
                  alternative-text=""
                  class="slds-var-m-right_x-small"
                ></lightning-icon>
              </template>
              {resultMessage}
            </p>
          </template>
        </div>

        <template lwc:if={isEmpty}>
          <c-barn-empty-state data-id="empty-state" illustration="no-data" size="small" heading={labels.empty}>
            <template lwc:if={showEmptyAdd}>
              <lightning-button data-id="empty-add" label={labels.add} onclick={handleShowForm}></lightning-button>
            </template>
          </c-barn-empty-state>
        </template>

        <template lwc:if={hasSignups}>
          <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked">
            <caption data-id="caption" class="slds-text-title_bold slds-text-align_left slds-var-p-vertical_x-small">
              {caption}
            </caption>
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{labels.person}</th>
                <th scope="col">{labels.status}</th>
                <template lwc:if={showAttendance}>
                  <th scope="col">{labels.actions}</th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={signups} for:item="signup">
                <tr key={signup.recordId} data-id="signup">
                  <th scope="row" data-label={labels.person}>
                    <a data-id="signup-link" href={signup.href} data-record-id={signup.recordId} onclick={handleOpenSignup}
                      >{signup.displayName}</a
                    >
                  </th>
                  <td data-label={labels.status}>
                    <template lwc:if={signup.showPicker}>
                      <lightning-combobox
                        class="status-picker"
                        data-record-id={signup.recordId}
                        label={signup.statusFor}
                        variant="label-hidden"
                        value={signup.status}
                        options={statusOptions}
                        disabled={busy}
                        onchange={handleStatusChange}
                      ></lightning-combobox>
                    </template>
                    <template lwc:else>
                      <c-barn-status-badge
                        class="status-badge"
                        status={signup.tone}
                        label={signup.statusLabel}
                      ></c-barn-status-badge>
                      <template lwc:if={signup.showChange}>
                        <lightning-button
                          class="change-status slds-var-m-left_x-small"
                          variant="base"
                          data-record-id={signup.recordId}
                          label={labels.change}
                          aria-label={signup.statusFor}
                          disabled={busy}
                          onclick={handleChangeStatus}
                        ></lightning-button>
                      </template>
                    </template>
                  </td>
                  <template lwc:if={showAttendance}>
                    <td data-label={labels.actions}>
                      <template lwc:if={signup.showAttended}>
                        <lightning-button
                          class="mark-attended slds-var-m-right_x-small"
                          data-record-id={signup.recordId}
                          label={labels.attended}
                          aria-label={signup.markAttended}
                          disabled={busy}
                          onclick={handleMarkAttended}
                        ></lightning-button>
                      </template>
                      <template lwc:if={signup.showNoShow}>
                        <lightning-button
                          class="mark-no-show"
                          data-record-id={signup.recordId}
                          label={labels.noShow}
                          aria-label={signup.markNoShow}
                          disabled={busy}
                          onclick={handleMarkNoShow}
                        ></lightning-button>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
          <template lwc:if={panel.moreThanShown}>
            <p data-id="more-than-shown" class="slds-text-body_small slds-var-m-top_x-small">
              {moreThanShownText}
            </p>
          </template>
        </template>
      </div>
    </lightning-card>
  </template>
</template>
