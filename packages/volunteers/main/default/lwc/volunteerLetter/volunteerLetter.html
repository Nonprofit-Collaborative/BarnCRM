<template>
  <div class="slds-var-p-around_medium">
    <h2 class="slds-text-heading_medium slds-var-m-bottom_small">{labels.heading}</h2>

    <template lwc:if={isLoading}>
      <div class="slds-is-relative slds-var-p-around_large" data-id="loading">
        <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
      </div>
    </template>
    <template lwc:if={working}>
      <div class="slds-is-relative slds-var-p-around_medium" data-id="working">
        <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
      </div>
    </template>

    <template lwc:if={blocker}>
      <c-barn-notice variant="error" message={blocker} data-id="blocker"></c-barn-notice>
    </template>

    <template lwc:if={showForm}>
      <template lwc:if={showLegalNameWarning}>
        <c-barn-notice
          class="slds-var-m-bottom_small"
          variant="warning"
          message={labels.noLegalName}
          data-id="legal-name-warning"
        ></c-barn-notice>
      </template>
      <lightning-combobox
        data-id="template"
        label={labels.template}
        options={templateOptions}
        value={templateId}
        required
        onchange={handleTemplateChange}
      ></lightning-combobox>
      <lightning-combobox
        data-id="period"
        label={labels.period}
        options={periodOptions}
        value={period}
        onchange={handlePeriodChange}
      ></lightning-combobox>
      <template lwc:if={isCustom}>
        <div class="slds-grid slds-wrap slds-gutters_x-small">
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <lightning-input
              data-id="from"
              type="date"
              label={labels.fromDate}
              value={fromDate}
              required
              onchange={handleFromChange}
            ></lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <lightning-input
              data-id="to"
              type="date"
              label={labels.toDate}
              value={toDate}
              required
              onchange={handleToChange}
            ></lightning-input>
          </div>
        </div>
      </template>

      <div aria-live="polite">
        <template lwc:if={notice}>
          <c-barn-notice class="slds-var-m-top_small" variant="warning" message={notice} data-id="notice"></c-barn-notice>
        </template>
      </div>

      <template lwc:if={previewBody}>
        <section
          class="preview slds-box slds-var-m-top_small slds-scrollable_y"
          tabindex="0"
          aria-label={labels.preview}
          data-id="preview"
        >
          <lightning-formatted-rich-text value={previewBody}></lightning-formatted-rich-text>
        </section>
      </template>
    </template>

    <div class="slds-var-m-top_medium slds-text-align_right">
      <lightning-button
        data-id="cancel"
        label={labels.cancel}
        onclick={handleCancel}
        class="slds-var-m-right_x-small"
      ></lightning-button>
      <lightning-button
        data-id="preview-button"
        label={labels.preview}
        disabled={buttonsDisabled}
        onclick={handlePreview}
        class="slds-var-m-right_x-small"
      ></lightning-button>
      <lightning-button
        data-id="generate"
        variant="brand"
        label={labels.generate}
        disabled={buttonsDisabled}
        onclick={handleGenerate}
      ></lightning-button>
    </div>
  </div>
</template>
