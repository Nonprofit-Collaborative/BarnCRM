<template>
    <template lwc:if={helpReady}>
    <lightning-card icon-name={cardIcon} title={cardTitle}>
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <template lwc:if={formError}>
                <c-barn-notice
                    class="slds-show slds-var-m-bottom_small"
                    variant="error"
                    title={labels.errorTitle}
                    message={formError}
                    data-id="form-error"
                ></c-barn-notice>
            </template>

            <template lwc:if={saveWarning}>
                <c-barn-notice
                    class="slds-show slds-var-m-bottom_small"
                    variant="warning"
                    message={saveWarning}
                    data-id="save-warning"
                ></c-barn-notice>
            </template>

            <template lwc:if={savedGift}>
                <c-barn-notice
                    class="slds-show slds-var-m-bottom_small"
                    variant="success"
                    message={savedMessage}
                    action-label={labels.openGiftLink}
                    action-href={savedGift.url}
                    data-id="saved"
                ></c-barn-notice>
            </template>

            <lightning-radio-group
                name="donorKind"
                type="button"
                label={labels.donorKindLabel}
                options={donorKindOptions}
                value={donorKind}
                onchange={handleDonorKindChange}
                data-id="donor-kind"
            ></lightning-radio-group>

            <div class="slds-var-m-top_small">
                <template lwc:if={isPersonDonor}>
                    <lightning-record-picker
                        label={labels.personLabel}
                        placeholder={labels.donorPlaceholder}
                        object-api-name={personObjectApiName}
                        display-info={personDisplayInfo}
                        value={donorId}
                        required
                        onchange={handleDonorChange}
                        data-id="donor-person"
                    ></lightning-record-picker>
                    <lightning-button
                        variant="base"
                        label={labels.newPerson}
                        onclick={handleNewPerson}
                        data-id="new-person"
                    ></lightning-button>
                </template>
                <template lwc:else>
                    <lightning-record-picker
                        label={labels.organizationLabel}
                        placeholder={labels.donorPlaceholder}
                        object-api-name={accountObjectApiName}
                        display-info={organizationDisplayInfo}
                        value={donorId}
                        required
                        onchange={handleDonorChange}
                        data-id="donor-organization"
                    ></lightning-record-picker>
                </template>
            </div>

            <template lwc:if={isMoneyGift}>
                <div class="slds-var-m-top_small">
                    <lightning-input
                        type="number"
                        formatter="currency"
                        step="0.01"
                        min="0.01"
                        required
                        label={labels.amountLabel}
                        value={amount}
                        onchange={handleAmountChange}
                        data-id="amount"
                    ></lightning-input>
                </div>
            </template>

            <div class="slds-var-m-top_small">
                <lightning-input
                    type="date"
                    required
                    label={labels.dateLabel}
                    value={giftDate}
                    onchange={handleDateChange}
                    data-id="gift-date"
                ></lightning-input>
            </div>

            <template lwc:if={showPayments}>
                <div class="slds-var-m-top_small">
                    <lightning-combobox
                        label={labels.paysLabel}
                        field-level-help={labels.paysHelp}
                        options={paymentOptions}
                        value={installmentId}
                        onchange={handlePaymentChange}
                        data-id="pays"
                    ></lightning-combobox>
                    <p class="slds-form-element__help" aria-live="polite" data-id="pays-note">
                        {paymentNote}
                    </p>
                </div>
            </template>
            <template lwc:if={paymentLoadFailed}>
                <p
                    class="slds-var-m-top_small slds-text-body_small slds-text-color_weak"
                    role="status"
                    data-id="pays-error"
                >
                    {labels.paysErrorLoad}
                </p>
            </template>

            <div class="slds-var-m-top_small">
                <lightning-combobox
                    required
                    label={labels.typeLabel}
                    placeholder={labels.typePlaceholder}
                    options={giftTypeOptions}
                    value={giftType}
                    onchange={handleTypeChange}
                    data-id="gift-type"
                ></lightning-combobox>
            </div>

            <template lwc:if={isInKindGift}>
                <div class="slds-var-m-top_small">
                    <lightning-textarea
                        required
                        max-length="32768"
                        label={labels.inKindDescriptionLabel}
                        field-level-help={labels.inKindDescriptionHelp}
                        value={inKindDescription}
                        onchange={handleInKindDescriptionChange}
                        data-id="in-kind-description"
                    ></lightning-textarea>
                </div>

                <div class="slds-var-m-top_small">
                    <lightning-input
                        type="number"
                        formatter="currency"
                        step="0.01"
                        min="0"
                        label={labels.fairMarketValueLabel}
                        value={fairMarketValue}
                        onchange={handleFairMarketValueChange}
                        data-id="fair-market-value"
                    ></lightning-input>
                    <p class="slds-form-element__help" data-id="fair-market-value-help">
                        {labels.fairMarketValueHelp}
                    </p>
                </div>
            </template>

            <div class="slds-var-m-top_small">
                <lightning-input
                    type="text"
                    max-length="255"
                    label={labels.paymentReferenceLabel}
                    value={paymentReference}
                    onchange={handlePaymentReferenceChange}
                    data-id="payment-reference"
                ></lightning-input>
            </div>

            <div class="slds-var-m-top_small">
                <lightning-record-picker
                    label={labels.appealLabel}
                    placeholder={labels.donorPlaceholder}
                    object-api-name={appealObjectApiName}
                    value={appealId}
                    onchange={handleAppealChange}
                    data-id="appeal"
                ></lightning-record-picker>
            </div>

            <div class="slds-var-m-top_small">
                <lightning-record-picker
                    label={labels.fundLabel}
                    placeholder={labels.donorPlaceholder}
                    object-api-name={fundObjectApiName}
                    value={fundId}
                    onchange={handleFundChange}
                    data-id="fund"
                ></lightning-record-picker>
            </div>

            <lightning-accordion
                class="slds-show slds-var-m-top_small"
                allow-multiple-sections-open
                active-section-name={openSections}
                onsectiontoggle={handleSectionToggle}
                data-id="more"
            >
                <lightning-accordion-section name="tribute" label={labels.tributeSection} data-id="tribute-section">
                    <lightning-combobox
                        label={fieldLabels.tributeType}
                        placeholder={labels.typePlaceholder}
                        options={tributeTypeOptions}
                        value={tributeType}
                        onchange={handleTributeField}
                        data-field="tributeType"
                        data-id="tribute-type"
                    ></lightning-combobox>
                    <div class="slds-var-m-top_small">
                        <lightning-record-picker
                            label={honoreeLabel}
                            placeholder={labels.donorPlaceholder}
                            object-api-name={personObjectApiName}
                            display-info={personDisplayInfo}
                            value={honoreeId}
                            onchange={handleTributeField}
                            data-field="honoreeId"
                            data-id="honoree"
                        ></lightning-record-picker>
                    </div>
                    <div class="slds-var-m-top_small">
                        <lightning-input
                            type="text"
                            max-length="255"
                            label={fieldLabels.honoreeName}
                            value={honoreeName}
                            onchange={handleTributeField}
                            data-field="honoreeName"
                            data-id="honoree-name"
                        ></lightning-input>
                    </div>
                    <div class="slds-var-m-top_small">
                        <lightning-record-picker
                            label={notifyLabel}
                            placeholder={labels.donorPlaceholder}
                            object-api-name={personObjectApiName}
                            display-info={personDisplayInfo}
                            value={notifyId}
                            onchange={handleTributeField}
                            data-field="notifyId"
                            data-id="notify"
                        ></lightning-record-picker>
                    </div>
                    <div class="slds-var-m-top_small">
                        <lightning-input
                            type="text"
                            max-length="255"
                            label={fieldLabels.notifyName}
                            value={notifyName}
                            onchange={handleTributeField}
                            data-field="notifyName"
                            data-id="notify-name"
                        ></lightning-input>
                    </div>
                </lightning-accordion-section>
                <template lwc:if={showMatch}>
                    <lightning-accordion-section name="match" label={labels.matchSection} data-id="match-section">
                        <template lwc:if={hasMatchChoices}>
                            <lightning-combobox
                                label={fieldLabels.matchedGift}
                                field-level-help={labels.matchHelp}
                                options={matchOptions}
                                value={matchedGiftId}
                                onchange={handleMatchChange}
                                data-id="matched-gift"
                            ></lightning-combobox>
                        </template>
                        <template lwc:elseif={matchLoaded}>
                            <p class="slds-text-body_small slds-text-color_weak" data-id="match-empty">
                                {labels.matchEmpty}
                            </p>
                        </template>
                    </lightning-accordion-section>
                </template>
            </lightning-accordion>

            <div class="slds-var-m-top_medium slds-grid slds-grid_vertical-align-center slds-wrap">
                <lightning-button
                    class="slds-var-m-right_x-small"
                    variant="brand"
                    label={labels.saveButton}
                    disabled={isSaveDisabled}
                    onclick={handleSave}
                    data-id="save"
                ></lightning-button>
                <lightning-button
                    label={labels.saveAndNewButton}
                    disabled={isSaveDisabled}
                    onclick={handleSaveAndNew}
                    data-id="save-and-new"
                ></lightning-button>
                <template lwc:if={saving}>
                    <span class="slds-var-m-left_small" role="status">{labels.savingMessage}</span>
                </template>
            </div>
        </div>
    </lightning-card>
    </template>
</template>
