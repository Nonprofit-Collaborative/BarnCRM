<template>
    <template lwc:if={helpReady}>
  <lightning-card title={labels.title} icon-name={icons.batch}>
    <div class="slds-var-p-horizontal_medium">
      <template lwc:if={loaded}>
        <div class="slds-grid slds-wrap slds-gutters_x-small">
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              label={labels.controlTotalLabel}
              value={controlTotal}
              format-style="currency"
              bordered
              align="start"
              data-id="control-total"
            ></c-barn-stat-tile>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
            <c-barn-stat-tile
              label={labels.enteredLabel}
              value={enteredTotal}
              format-style="currency"
              bordered
              align="start"
              data-id="entered-total"
            ></c-barn-stat-tile>
          </div>
        </div>
        <template lwc:if={posted}>
          <c-barn-notice
            class="slds-show slds-var-m-bottom_small"
            variant="success"
            message={labels.createdNote}
            data-id="posted-note"
          ></c-barn-notice>
        </template>
        <template lwc:else>
          <c-barn-notice
            class="slds-show slds-var-m-bottom_small"
            variant={balanceVariant}
            message={balanceText}
            data-id="balance"
          ></c-barn-notice>
          <template lwc:if={readOnly}>
            <c-barn-notice
              class="slds-show slds-var-m-bottom_small"
              message={labels.noAccess}
              data-id="read-only-note"
            ></c-barn-notice>
          </template>
          <template lwc:else>
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
              {labels.fromBatchHelp}
            </p>
          </template>
        </template>
      </template>

      <template lwc:if={formError}>
        <c-barn-notice
          class="slds-show slds-var-m-bottom_small"
          variant="error"
          message={formError}
          data-id="form-error"
        ></c-barn-notice>
      </template>

      <template lwc:if={paymentLoadFailed}>
        <c-barn-notice
          class="slds-show slds-var-m-bottom_small"
          variant="warning"
          message={labels.paysErrorLoad}
          data-id="pays-error"
        ></c-barn-notice>
      </template>

      <template lwc:if={isPhone}>
        <c-barn-notice
          class="slds-show slds-var-m-bottom_small"
          message={labels.useComputer}
          data-id="use-computer"
        ></c-barn-notice>
      </template>

      <template lwc:if={hasLines}>
        <div class="slds-scrollable_x">
          <table
            class="slds-table slds-table_bordered slds-table_cell-buffer"
            aria-label={labels.title}
            data-wide-table
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col" data-label={labels.columnLine}>{labels.columnLine}</th>
                <th scope="col" data-label={labels.columnDonor}>{labels.columnDonor}</th>
                <th scope="col" data-label={labels.columnAmount}>{labels.columnAmount}</th>
                <th scope="col" data-label={labels.columnReference}>{labels.columnReference}</th>
                <th scope="col" data-label={labels.columnDate}>{labels.columnDate}</th>
                <th scope="col" data-label={labels.columnMethod}>{labels.columnMethod}</th>
                <th scope="col" data-label={labels.columnFund}>{labels.columnFund}</th>
                <th scope="col" data-label={labels.columnAppeal}>{labels.columnAppeal}</th>
                <th scope="col" data-label={labels.columnPays}>{labels.columnPays}</th>
                <th scope="col" data-label={labels.columnGift}>{labels.columnGift}</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={rows} for:item="row">
                <tr key={row.key} data-id="line">
                  <td data-label={labels.columnLine}>
                    {row.number}
                    <template lwc:if={row.hasErrors}>
                      <c-barn-notice
                        class="slds-show slds-var-m-top_xx-small"
                        variant="error"
                        message={row.errors}
                        data-id="line-error"
                      ></c-barn-notice>
                    </template>
                  </td>
                  <td data-label={labels.columnDonor}>
                    <template lwc:if={showKind}>
                      <lightning-combobox
                        label={row.cellLabels.kind}
                        variant="label-hidden"
                        options={kindOptions}
                        value={row.kind}
                        disabled={locked}
                        data-key={row.key}
                        data-id="kind"
                        onchange={handleKind}
                      ></lightning-combobox>
                    </template>
                    <template lwc:if={row.isPerson}>
                      <lightning-record-picker
                        label={row.cellLabels.donor}
                        variant="label-hidden"
                        placeholder={labels.donorPlaceholder}
                        object-api-name={row.donorObject}
                        display-info={personDisplayInfo}
                        value={row.donorId}
                        disabled={locked}
                        data-key={row.key}
                        data-id="donor"
                        onchange={handleDonor}
                      ></lightning-record-picker>
                    </template>
                    <template lwc:else>
                      <lightning-record-picker
                        label={row.cellLabels.donor}
                        variant="label-hidden"
                        placeholder={labels.donorPlaceholder}
                        object-api-name="Account"
                        display-info={organizationDisplayInfo}
                        value={row.donorId}
                        disabled={locked}
                        data-key={row.key}
                        data-id="donor"
                        onchange={handleDonor}
                      ></lightning-record-picker>
                    </template>
                  </td>
                  <td data-label={labels.columnAmount}>
                    <lightning-input
                      type="number"
                      formatter="currency"
                      step="0.01"
                      label={row.cellLabels.amount}
                      variant="label-hidden"
                      value={row.amount}
                      disabled={locked}
                      data-key={row.key}
                      data-field="amount"
                      onchange={handleField}
                    ></lightning-input>
                  </td>
                  <td data-label={labels.columnReference}>
                    <lightning-input
                      label={row.cellLabels.reference}
                      variant="label-hidden"
                      max-length="255"
                      value={row.paymentReference}
                      disabled={locked}
                      data-key={row.key}
                      data-field="paymentReference"
                      onchange={handleField}
                    ></lightning-input>
                  </td>
                  <td data-label={labels.columnDate}>
                    <lightning-input
                      type="date"
                      label={row.cellLabels.date}
                      variant="label-hidden"
                      value={row.giftDate}
                      disabled={locked}
                      data-key={row.key}
                      data-field="giftDate"
                      onchange={handleField}
                    ></lightning-input>
                  </td>
                  <td data-label={labels.columnMethod}>
                    <lightning-combobox
                      label={row.cellLabels.method}
                      variant="label-hidden"
                      options={methodOptions}
                      value={row.methodValue}
                      disabled={locked}
                      data-key={row.key}
                      data-field="paymentMethod"
                      onchange={handleField}
                    ></lightning-combobox>
                  </td>
                  <td data-label={labels.columnFund}>
                    <lightning-record-picker
                      label={row.cellLabels.fund}
                      variant="label-hidden"
                      object-api-name={fundObject}
                      value={row.fundId}
                      disabled={locked}
                      data-key={row.key}
                      data-field="fundId"
                      onchange={handleField}
                    ></lightning-record-picker>
                  </td>
                  <td data-label={labels.columnAppeal}>
                    <lightning-record-picker
                      label={row.cellLabels.appeal}
                      variant="label-hidden"
                      object-api-name={appealObject}
                      value={row.appealId}
                      disabled={locked}
                      data-key={row.key}
                      data-field="appealId"
                      onchange={handleField}
                    ></lightning-record-picker>
                  </td>
                  <td data-label={labels.columnPays}>
                    <template lwc:if={row.showPays}>
                      <lightning-combobox
                        label={row.cellLabels.pays}
                        variant="label-hidden"
                        options={row.payOptions}
                        value={row.payValue}
                        disabled={locked}
                        data-key={row.key}
                        data-id="pays"
                        onchange={handlePays}
                      ></lightning-combobox>
                      <p class="slds-text-body_small slds-text-color_weak" aria-live="polite" data-id="pays-note">
                        {row.paysNote}
                      </p>
                    </template>
                  </td>
                  <td data-label={labels.columnGift}>
                    <template lwc:if={row.giftUrl}>
                      <a href={row.giftUrl} data-id="gift-link">{row.giftName}</a>
                    </template>
                    <template lwc:elseif={editable}>
                      <lightning-button-icon
                        icon-name="utility:delete"
                        alternative-text={row.cellLabels.remove}
                        title={row.cellLabels.remove}
                        data-key={row.key}
                        data-id="remove"
                        onclick={handleRemove}
                      ></lightning-button-icon>
                    </template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
      <template lwc:elseif={editable}>
        <c-barn-empty-state
          heading={labels.noLines}
          message={labels.noLinesHelp}
          data-id="no-lines"
        >
          <lightning-button
            label={labels.addLine}
            icon-name="utility:add"
            disabled={busy}
            data-id="empty-add"
            onclick={handleAdd}
          ></lightning-button>
        </c-barn-empty-state>
      </template>
    </div>

    <template lwc:if={editable}>
      <div slot="footer" class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
        <div>
          <template lwc:if={dirty}>
            <span class="slds-text-color_weak" data-id="unsaved">{labels.unsaved}</span>
          </template>
          <template lwc:if={busy}>
            <span class="slds-text-color_weak" role="status">{labels.working}</span>
          </template>
        </div>
        <div>
          <lightning-button
            label={labels.addLine}
            icon-name="utility:add"
            class="slds-var-m-right_x-small"
            disabled={busy}
            data-id="add"
            onclick={handleAdd}
          ></lightning-button>
          <lightning-button
            label={labels.saveButton}
            class="slds-var-m-right_x-small"
            disabled={busy}
            data-id="save"
            onclick={handleSave}
          ></lightning-button>
          <lightning-button
            label={labels.postButton}
            variant="brand"
            disabled={postDisabled}
            data-id="post"
            onclick={handlePost}
          ></lightning-button>
        </div>
      </div>
    </template>
  </lightning-card>
    </template>
</template>
