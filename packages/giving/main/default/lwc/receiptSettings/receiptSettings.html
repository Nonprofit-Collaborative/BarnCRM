<template>
  <div class="slds-p-around_medium">
    <template lwc:if={loadError}>
      <p data-id="load-error" class="slds-text-color_error slds-m-bottom_small">{loadError}</p>
    </template>

    <lightning-tabset>
      <lightning-tab label={labels.templatesTab}>
        <template lwc:if={hasTemplates}>
          <template lwc:if={readOnly}>
            <p data-id="read-only" class="slds-text-body_small slds-m-bottom_small">
              {labels.readOnly}
            </p>
          </template>

          <lightning-combobox
            data-id="letter"
            label={labels.letterPicker}
            value={selectedTemplateId}
            options={templateOptions}
            onchange={handleTemplateChange}
          ></lightning-combobox>

          <p class="slds-text-body_small slds-m-top_small">{labels.letterheadNote}</p>

          <lightning-input-rich-text
            data-id="editor"
            class="slds-m-top_small"
            label={labels.editor}
            label-visible
            formats={formats}
            value={draftBody}
            disabled={readOnly}
            onchange={handleBodyChange}
          ></lightning-input-rich-text>

          <div class="slds-m-top_small">
            <lightning-button
              data-id="save"
              label={labels.save}
              variant="brand"
              disabled={cannotEdit}
              onclick={handleSave}
            ></lightning-button>
            <lightning-button
              data-id="preview"
              class="slds-m-left_x-small"
              label={labels.preview}
              disabled={busy}
              onclick={handlePreview}
            ></lightning-button>
            <template lwc:if={showUseLetter}>
              <lightning-button
                data-id="use-letter"
                class="slds-m-left_x-small"
                label={labels.useLetter}
                disabled={cannotEdit}
                onclick={handleActivate}
              ></lightning-button>
            </template>
          </div>

          <template lwc:if={previewHtml}>
            <div data-id="preview-box" class="slds-box slds-m-top_medium">
              <h3 class="slds-text-heading_small">{labels.previewHeading}</h3>
              <p class="slds-text-body_small slds-m-bottom_small">{labels.previewNote}</p>
              <lightning-formatted-rich-text value={previewHtml}></lightning-formatted-rich-text>
            </div>
          </template>

          <p class="slds-text-body_small slds-m-top_small">{labels.taxNote}</p>

          <p class="slds-text-body_small slds-m-top_small">{labels.tokensIntro}</p>
          <ul class="slds-list_dotted">
            <template for:each={tokens} for:item="token">
              <li key={token}>{token}</li>
            </template>
          </ul>
        </template>
        <template lwc:else>
          <p data-id="no-templates" class="slds-text-body_regular slds-m-bottom_small">
            {labels.noTemplates}
          </p>
          <lightning-button
            data-id="restore"
            label={labels.restore}
            variant="brand"
            disabled={cannotEdit}
            onclick={handleRestore}
          ></lightning-button>
        </template>
      </lightning-tab>

      <lightning-tab label={labels.statementsTab}>
        <lightning-input
          data-id="statement-year"
          type="number"
          label={labels.statementYear}
          value={statementYear}
          onchange={handleYearChange}
        ></lightning-input>
        <div class="slds-m-top_small">
          <lightning-button
            data-id="generate"
            label={labels.generate}
            variant="brand"
            disabled={busy}
            onclick={handleGenerate}
          ></lightning-button>
          <lightning-button
            data-id="refresh"
            class="slds-m-left_x-small"
            label={labels.refresh}
            onclick={handleRefreshRuns}
          ></lightning-button>
        </div>

        <template lwc:if={hasRuns}>
          <table class="slds-table slds-table_bordered slds-m-top_medium">
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{labels.columnRun}</th>
                <th scope="col">{labels.columnYear}</th>
                <th scope="col">{labels.columnStatus}</th>
                <th scope="col">{labels.columnDonors}</th>
                <th scope="col">{labels.columnIssued}</th>
                <th scope="col">{labels.columnErrors}</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={runs} for:item="run">
                <tr key={run.id}>
                  <td>{run.name}</td>
                  <td>{run.statementYear}</td>
                  <td>{run.status}</td>
                  <td>{run.donorsProcessed}</td>
                  <td>{run.receiptsIssued}</td>
                  <td>{run.errors}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
        <template lwc:else>
          <p data-id="no-runs" class="slds-text-body_regular slds-m-top_medium">
            {labels.noRuns}
          </p>
        </template>
      </lightning-tab>
    </lightning-tabset>
  </div>
</template>
