<template>
    <template lwc:if={helpReady}>
  <div class="slds-var-p-around_medium">
    <c-settings-setup-notes notes={setupNotes}></c-settings-setup-notes>
    <template lwc:if={loadError}>
      <c-barn-notice
        class="slds-show slds-var-m-bottom_small"
        variant="error"
        message={loadError}
        data-id="load-error"
      ></c-barn-notice>
    </template>
    <template lwc:if={resultMessage}>
      <c-barn-notice
        class="slds-show slds-var-m-bottom_small"
        variant={resultVariant}
        message={resultMessage}
        data-id="result"
      ></c-barn-notice>
    </template>

    <lightning-tabset>
      <lightning-tab label={labels.templatesTab}>
        <template lwc:if={hasTemplates}>
          <template lwc:if={readOnly}>
            <c-barn-notice
              class="slds-show slds-var-m-bottom_small"
              variant="info"
              message={labels.readOnly}
              data-id="read-only"
            ></c-barn-notice>
          </template>

          <lightning-combobox
            data-id="letter"
            label={labels.letterPicker}
            value={selectedTemplateId}
            options={templateOptions}
            onchange={handleTemplateChange}
          ></lightning-combobox>

          <p class="slds-text-body_small slds-var-m-top_small">{labels.letterheadNote}</p>

          <lightning-input-rich-text
            data-id="editor"
            class="slds-var-m-top_small"
            label={labels.editor}
            label-visible
            formats={formats}
            value={draftBody}
            disabled={readOnly}
            onchange={handleBodyChange}
          ></lightning-input-rich-text>

          <div class="slds-var-m-top_small">
            <lightning-button
              data-id="save"
              label={labels.save}
              variant="brand"
              disabled={cannotEdit}
              onclick={handleSave}
            ></lightning-button>
            <lightning-button
              data-id="preview"
              class="slds-var-m-left_x-small"
              label={labels.preview}
              disabled={busy}
              onclick={handlePreview}
            ></lightning-button>
            <template lwc:if={showUseLetter}>
              <lightning-button
                data-id="use-letter"
                class="slds-var-m-left_x-small"
                label={labels.useLetter}
                disabled={cannotEdit}
                onclick={handleActivate}
              ></lightning-button>
            </template>
          </div>

          <template lwc:if={previewHtml}>
            <div data-id="preview-box" class="slds-box slds-var-m-top_medium">
              <h3 class="slds-text-heading_small">{labels.previewHeading}</h3>
              <p class="slds-text-body_small slds-var-m-bottom_small">{labels.previewNote}</p>
              <lightning-formatted-rich-text value={previewHtml}></lightning-formatted-rich-text>
            </div>
          </template>

          <p class="slds-text-body_small slds-var-m-top_small">{labels.taxNote}</p>

          <p class="slds-text-body_small slds-var-m-top_small">{labels.tokensIntro}</p>
          <ul class="slds-list_dotted">
            <template for:each={tokens} for:item="token">
              <li key={token}>{token}</li>
            </template>
          </ul>
        </template>
        <template lwc:else>
          <c-barn-empty-state
            illustration="setup"
            heading={labels.noTemplatesHeading}
            message={labels.noTemplates}
            data-id="no-templates"
          >
            <lightning-button
              data-id="restore"
              label={labels.restore}
              variant="brand"
              disabled={cannotEdit}
              onclick={handleRestore}
            ></lightning-button>
          </c-barn-empty-state>
        </template>
      </lightning-tab>

      <lightning-tab label={labels.statementsTab}>
        <lightning-input
          data-id="statement-year"
          type="number"
          label={labels.statementYear}
          value={statementYear}
          onchange={handleYearChange}
        ></lightning-input>
        <div class="slds-var-m-top_small">
          <lightning-button
            data-id="generate"
            label={labels.generate}
            variant="brand"
            disabled={busy}
            onclick={handleGenerate}
          ></lightning-button>
          <lightning-button
            data-id="refresh"
            class="slds-var-m-left_x-small"
            label={labels.refresh}
            onclick={handleRefreshRuns}
          ></lightning-button>
        </div>

        <template lwc:if={hasRuns}>
          <table
            class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked slds-var-m-top_medium"
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{labels.columnRun}</th>
                <th scope="col">{labels.columnYear}</th>
                <th scope="col">{labels.columnStatus}</th>
                <th scope="col">{labels.columnDonors}</th>
                <th scope="col">{labels.columnIssued}</th>
                <th scope="col">{labels.columnErrors}</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={runRows} for:item="run">
                <tr key={run.id} data-id="run">
                  <td data-label={labels.columnRun}>{run.name}</td>
                  <td data-label={labels.columnYear}>{run.statementYear}</td>
                  <td data-label={labels.columnStatus}>
                    <c-barn-status-badge
                      data-id="run-status"
                      status={run.tone}
                      label={run.status}
                    ></c-barn-status-badge>
                  </td>
                  <td data-label={labels.columnDonors}>{run.donorsProcessed}</td>
                  <td data-label={labels.columnIssued}>{run.receiptsIssued}</td>
                  <td data-label={labels.columnErrors}>{run.errors}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
        <template lwc:else>
          <c-barn-empty-state
            class="slds-show slds-var-m-top_medium"
            size="compact"
            heading={labels.noRuns}
            message={labels.noRunsMessage}
            data-id="no-runs"
          ></c-barn-empty-state>
        </template>
      </lightning-tab>
    </lightning-tabset>
  </div>
    </template>
</template>
