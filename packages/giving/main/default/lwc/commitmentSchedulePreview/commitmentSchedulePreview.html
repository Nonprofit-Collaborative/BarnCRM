<template>
  <lightning-card title={labels.title} icon-name="standard:timeslot">
    <div class="slds-var-p-horizontal_medium">
      <template lwc:if={loading}>
        <lightning-spinner alternative-text={labels.title} size="small"></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <p role="alert" class="slds-text-color_error" data-id="error">{errorMessage}</p>
      </template>

      <template lwc:if={noticeMessage}>
        <p role="status" class="slds-text-color_success" data-id="notice">{noticeMessage}</p>
      </template>

      <template lwc:if={isEmpty}>
        <p data-id="empty">{labels.empty}</p>
        <template lwc:if={canGenerate}>
          <lightning-button
            label={labels.generateNow}
            variant="brand"
            data-id="generate"
            class="slds-var-m-top_small"
            onclick={handleGenerate}
          ></lightning-button>
        </template>
      </template>

      <template lwc:if={hasActions}>
        <div class="slds-var-m-bottom_small" data-id="actions">
          <template lwc:if={canPause}>
            <lightning-button
              label={labels.pause}
              data-id="pause"
              data-action="pause"
              class="slds-var-m-right_x-small"
              onclick={handleStatusChange}
            ></lightning-button>
          </template>
          <template lwc:if={canResume}>
            <lightning-button
              label={labels.resume}
              data-id="resume"
              data-action="resume"
              class="slds-var-m-right_x-small"
              onclick={handleStatusChange}
            ></lightning-button>
          </template>
          <template lwc:if={canEnd}>
            <lightning-button
              label={labels.complete}
              data-id="complete"
              data-action="complete"
              class="slds-var-m-right_x-small"
              onclick={handleStatusChange}
            ></lightning-button>
            <lightning-button
              label={labels.cancel}
              data-id="cancel"
              data-action="cancel"
              onclick={handleStatusChange}
            ></lightning-button>
          </template>
        </div>
      </template>

      <template lwc:if={hasInstallments}>
        <table class="slds-table slds-table_cell-buffer slds-table_bordered" data-id="schedule">
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col">{labels.sequence}</th>
              <th scope="col">{labels.dueDate}</th>
              <th scope="col">{labels.amount}</th>
              <th scope="col">{labels.paid}</th>
              <th scope="col">{labels.status}</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={installments} for:item="installment">
              <tr key={installment.key} class="slds-hint-parent">
                <td>{installment.sequence}</td>
                <td>
                  <lightning-formatted-date-time
                    value={installment.dueDate}
                  ></lightning-formatted-date-time>
                </td>
                <td>
                  <lightning-formatted-number
                    format-style="currency"
                    value={installment.expectedAmount}
                  ></lightning-formatted-number>
                </td>
                <td>
                  <lightning-formatted-number
                    format-style="currency"
                    value={installment.paidAmount}
                  ></lightning-formatted-number>
                </td>
                <td>
                  <lightning-badge
                    label={installment.status}
                    class={installment.badgeClass}
                  ></lightning-badge>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <p class="slds-var-m-top_small slds-text-title_bold" data-id="total">
          {labels.total}
          <lightning-formatted-number
            format-style="currency"
            value={expectedTotal}
          ></lightning-formatted-number>
        </p>
      </template>
    </div>
  </lightning-card>
</template>
