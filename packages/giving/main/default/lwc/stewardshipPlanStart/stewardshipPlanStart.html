<template>
  <div lwc:if={helpReady} class="slds-var-p-around_medium">
    <h2 class="slds-text-heading_medium slds-var-m-bottom_small">{labels.heading}</h2>

    <template lwc:if={loadError}>
      <c-barn-notice
        class="slds-var-m-bottom_small"
        data-id="load-error"
        variant="error"
        message={loadError}
      ></c-barn-notice>
    </template>
    <template lwc:elseif={noAccess}>
      <c-barn-notice
        class="slds-var-m-bottom_small"
        data-id="no-access"
        variant="warning"
        message={labels.noAccess}
      ></c-barn-notice>
    </template>
    <template lwc:elseif={noPlans}>
      <c-barn-empty-state
        class="slds-var-m-bottom_small"
        data-id="no-plans"
        size="compact"
        illustration="setup"
        message={labels.none}
      ></c-barn-empty-state>
    </template>
    <template lwc:elseif={loaded}>
      <lightning-combobox
        data-id="plan"
        label={labels.plan}
        placeholder={labels.choose}
        options={planOptions}
        value={templateId}
        onchange={handlePlanChange}
      ></lightning-combobox>
      <template lwc:if={description}>
        <p
          class="slds-var-m-top_x-small slds-text-body_small slds-text-color_weak"
          data-id="description"
        >
          {description}
        </p>
      </template>
    </template>

    <div class="slds-var-m-top_medium slds-text-align_right">
      <lightning-button
        data-id="cancel"
        label={labels.cancel}
        onclick={handleCancel}
        class="slds-var-m-right_x-small"
      ></lightning-button>
      <template lwc:if={canChoose}>
        <lightning-button
          data-id="start"
          variant="brand"
          label={labels.start}
          disabled={working}
          onclick={handleStart}
        ></lightning-button>
      </template>
    </div>
  </div>
</template>
