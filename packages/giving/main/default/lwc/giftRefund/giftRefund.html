<template>
  <div lwc:if={helpReady} class="slds-var-p-around_medium">
    <h2 class="slds-text-heading_medium slds-var-m-bottom_small">{labels.heading}</h2>

    <template lwc:if={loadError}>
      <div class="slds-var-m-bottom_small">
        <c-barn-notice variant="error" message={loadError} data-id="load-error"></c-barn-notice>
      </div>
    </template>

    <template lwc:if={noAccess}>
      <div class="slds-var-m-bottom_small">
        <c-barn-notice variant="warning" message={labels.noAccess} data-id="no-access"></c-barn-notice>
      </div>
    </template>
    <template lwc:else>
      <lightning-radio-group
        data-id="mode"
        name="mode"
        label={labels.heading}
        variant="label-hidden"
        options={modeOptions}
        value={mode}
        onchange={handleModeChange}
      ></lightning-radio-group>

      <p class="slds-var-m-vertical_x-small" data-id="remaining">
        {labels.remaining}:
        <lightning-formatted-number
          value={remainingAmount}
          format-style="currency"
        ></lightning-formatted-number>
      </p>

      <template lwc:if={showAmount}>
        <lightning-input
          data-id="amount"
          type="number"
          formatter="currency"
          step="0.01"
          label={labels.amount}
          value={amount}
          onchange={handleAmountChange}
        ></lightning-input>
      </template>

      <lightning-input
        data-id="reason"
        type="text"
        max-length="255"
        label={labels.reason}
        value={reason}
        onchange={handleReasonChange}
      ></lightning-input>
    </template>

    <div class="slds-var-m-top_medium slds-text-align_right">
      <lightning-button
        data-id="cancel"
        label={labels.cancel}
        onclick={handleCancel}
        class="slds-var-m-right_x-small"
      ></lightning-button>
      <template lwc:if={canEnter}>
        <lightning-button
          data-id="confirm"
          variant="brand"
          label={labels.confirm}
          disabled={confirmDisabled}
          onclick={handleConfirm}
        ></lightning-button>
      </template>
    </div>
  </div>
</template>
