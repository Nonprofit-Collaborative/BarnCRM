<template>
    <template lwc:if={helpReady}>
  <lightning-card title={labels.title} icon-name="custom:custom65">
    <div class="slds-var-p-horizontal_medium">
      <p class="slds-text-body_regular slds-var-m-bottom_small">{labels.intro}</p>

      <template lwc:if={hasError}>
        <c-barn-notice
          class="slds-show slds-var-m-bottom_small"
          variant="error"
          message={errorMessage}
          data-id="error-message"
        ></c-barn-notice>
      </template>

      <template lwc:if={hasNotice}>
        <c-barn-notice
          class="slds-show slds-var-m-bottom_small"
          variant="success"
          message={noticeMessage}
          data-id="notice-message"
        ></c-barn-notice>
      </template>

      <template lwc:if={showOffNotice}>
        <c-barn-notice
          class="slds-show slds-var-m-bottom_small"
          variant="warning"
          message={labels.off}
          data-id="off-notice"
        ></c-barn-notice>
      </template>

      <dl class="slds-dl_horizontal slds-var-m-bottom_small">
        <dt class="slds-dl_horizontal__label">{labels.measuredOn}</dt>
        <dd data-id="source-field" class="slds-dl_horizontal__detail">{sourceFieldLabel}</dd>
        <dt class="slds-dl_horizontal__label">{labels.lastRecalculated}</dt>
        <dd data-id="last-recalculated" class="slds-dl_horizontal__detail">
          {lastRecalculatedText}
        </dd>
      </dl>

      <template lwc:if={isEmpty}>
        <c-barn-empty-state
          illustration="setup"
          heading={labels.emptyHeading}
          message={labels.empty}
          data-id="empty-state"
        ></c-barn-empty-state>
      </template>

      <template lwc:if={hasLadder}>
        <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-max-medium-table_stacked">
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col">{labels.columnLevel}</th>
              <th scope="col">{labels.columnFrom}</th>
              <th scope="col">{labels.columnUpTo}</th>
              <th scope="col">{labels.columnDonors}</th>
              <th scope="col">{labels.columnActive}</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={rungs} for:item="rung">
              <tr key={rung.recordId} data-id="rung">
                <td data-label={labels.columnLevel}>
                  <lightning-button
                    data-id="rung-link"
                    data-record-id={rung.recordId}
                    variant="base"
                    label={rung.name}
                    onclick={handleOpenRung}
                  ></lightning-button>
                </td>
                <td data-label={labels.columnFrom}>
                  <lightning-formatted-number
                    format-style="currency"
                    value={rung.minimumAmount}
                  ></lightning-formatted-number>
                </td>
                <td data-label={labels.columnUpTo}>
                  <template lwc:if={rung.isTopOfLadder}>{labels.topOfLadder}</template>
                  <template lwc:else>
                    <lightning-formatted-number
                      format-style="currency"
                      value={rung.maximumAmount}
                    ></lightning-formatted-number>
                  </template>
                </td>
                <td data-id="donor-count" data-label={labels.columnDonors}>{rung.donorCount}</td>
                <td data-id="rung-active" data-label={labels.columnActive}>
                  <template lwc:if={rung.activeText}>
                    <c-barn-status-badge status="inactive" label={rung.activeText}></c-barn-status-badge>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>

      <div class="slds-var-m-top_small">
        <lightning-button
          data-id="new-level"
          label={labels.newLevel}
          onclick={handleNewLevel}
        ></lightning-button>
        <lightning-button
          data-id="recalculate"
          class="slds-var-m-left_x-small"
          variant="brand"
          label={labels.recalculate}
          disabled={recalculateDisabled}
          onclick={handleRecalculate}
        ></lightning-button>
      </div>
    </div>
  </lightning-card>
    </template>
</template>
