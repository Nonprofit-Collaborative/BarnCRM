<template>
  <lightning-card title={labels.title} icon-name="standard:document">
    <div class="slds-p-horizontal_medium">
      <template lwc:if={loadError}>
        <p role="alert" data-id="load-error" class="slds-text-color_error">{loadError}</p>
      </template>

      <template lwc:if={hasReceipts}>
        <table class="slds-table slds-table_bordered slds-table_cell-buffer">
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col">{labels.columnNumber}</th>
              <th scope="col">{labels.columnStatus}</th>
              <th scope="col">{labels.columnAmount}</th>
              <th scope="col">{labels.columnIssued}</th>
              <th scope="col">{labels.columnVoidReason}</th>
              <th scope="col">{labels.columnFile}</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={rows} for:item="receipt">
              <tr key={receipt.id} data-id="receipt-row">
                <td>{receipt.receiptNumber}</td>
                <td>{receipt.status}</td>
                <td>
                  <lightning-formatted-number
                    value={receipt.amount}
                    format-style="currency"
                  ></lightning-formatted-number>
                </td>
                <td>
                  <lightning-formatted-date-time
                    value={receipt.issueDate}
                  ></lightning-formatted-date-time>
                </td>
                <td>{receipt.voidReason}</td>
                <td>
                  <template lwc:if={receipt.contentDocumentId}>
                    <lightning-button
                      data-id="view-pdf"
                      data-document-id={receipt.contentDocumentId}
                      variant="base"
                      label={labels.viewPdf}
                      title={receipt.viewPdfTitle}
                      onclick={handleViewPdf}
                    ></lightning-button>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
      <template lwc:else>
        <p data-id="none-yet" class="slds-text-body_regular">{labels.noneYet}</p>
      </template>

      <template lwc:if={canIssue}>
        <div class="slds-m-top_medium">
          <lightning-button
            data-id="issue"
            label={labels.issue}
            variant="brand"
            disabled={busy}
            onclick={handleIssue}
          ></lightning-button>
        </div>
      </template>

      <template lwc:if={canReissue}>
        <div class="slds-m-top_medium">
          <lightning-input
            data-id="void-reason"
            label={labels.voidReason}
            value={reason}
            onchange={handleReasonChange}
          ></lightning-input>
          <div class="slds-m-top_small">
            <lightning-button
              data-id="void-and-reissue"
              label={labels.voidAndReissue}
              variant="destructive-text"
              disabled={busy}
              onclick={handleVoidAndReissue}
            ></lightning-button>
          </div>
          <p class="slds-text-body_small slds-m-top_x-small">{labels.voidNote}</p>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
