<template>
  <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name={icons.pipeline}>
      <div slot="actions" class="slds-grid slds-grid_vertical-align-center slds-wrap">
        <lightning-radio-group
          data-id="view"
          class="slds-var-m-right_small"
          name="view"
          label={labels.viewBoard}
          variant="label-hidden"
          type="button"
          options={viewOptions}
          value={view}
          onchange={handleView}
        ></lightning-radio-group>
        <lightning-radio-group
          data-id="scope"
          class="slds-var-m-right_small"
          name="scope"
          label={labels.scopeEveryone}
          variant="label-hidden"
          type="button"
          options={scopeOptions}
          value={scope}
          onchange={handleScope}
        ></lightning-radio-group>
        <template lwc:if={canCreate}>
          <lightning-button
            data-id="new-ask"
            label={labels.newAsk}
            onclick={handleNewAsk}
          ></lightning-button>
        </template>
      </div>

      <div class="slds-var-p-horizontal_medium">
        <p class="slds-text-body_regular slds-var-m-bottom_small">{labels.intro}</p>

        <div class="slds-assistive-text" aria-live="polite" data-id="live">{liveMessage}</div>
        <span id="ask-drag-help" class="slds-assistive-text">{labels.dragInstructions}</span>

        <template lwc:if={isLoading}>
          <lightning-spinner alternative-text={labels.title} size="small"></lightning-spinner>
        </template>

        <template lwc:if={hasError}>
          <c-barn-notice
            data-id="error-message"
            class="slds-var-m-bottom_small"
            variant="error"
            message={errorMessage}
          ></c-barn-notice>
        </template>

        <template lwc:if={showReadOnly}>
          <c-barn-notice
            data-id="read-only"
            class="slds-var-m-bottom_small"
            message={labels.readOnly}
          ></c-barn-notice>
        </template>

        <template lwc:if={hasBoard}>
          <div
            class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-bottom_small"
            data-id="totals"
          >
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
              <c-barn-stat-tile
                data-id="open-count"
                label={labels.tileOpen}
                value={board.openCount}
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
              <c-barn-stat-tile
                data-id="open-amount"
                label={labels.tileOpenAmount}
                value={board.openAmount}
                format-style="currency"
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
              <c-barn-stat-tile
                data-id="won-amount"
                label={labels.tileWon}
                value={board.wonAmount}
                format-style="currency"
                badge-label={wonDetail}
                badge-variant="success"
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
              <c-barn-stat-tile
                data-id="declined-count"
                label={labels.tileDeclined}
                value={board.declinedCount}
                bordered
                align="start"
              ></c-barn-stat-tile>
            </div>
          </div>

          <template lwc:if={truncatedMessage}>
            <c-barn-notice
              data-id="truncated"
              class="slds-var-m-bottom_small"
              message={truncatedMessage}
            ></c-barn-notice>
          </template>
        </template>

        <template lwc:if={isEmpty}>
          <c-barn-empty-state data-id="empty-state" illustration="no-data" message={labels.empty}>
            <template lwc:if={canCreate}>
              <lightning-button label={labels.newAsk} onclick={handleNewAsk}></lightning-button>
            </template>
          </c-barn-empty-state>
        </template>

        <template lwc:if={showBoard}>
          <div class="ask-board" data-id="board">
            <template for:each={boardColumns} for:item="column">
              <section
                key={column.key}
                class={column.dropClass}
                data-id="column"
                data-stage={column.stage}
                data-drop-zone={column.zoneId}
                data-drop-label={column.title}
                aria-label={column.title}
              >
                <header class="slds-var-m-bottom_x-small">
                  <h2 class="slds-text-heading_small slds-truncate" title={column.title}>
                    {column.title}
                  </h2>
                  <p class="slds-text-body_small slds-text-color_weak" data-id="column-total">
                    <lightning-formatted-number value={column.count}></lightning-formatted-number>
                    <span class="slds-var-m-horizontal_xx-small" aria-hidden="true">|</span>
                    <lightning-formatted-number
                      value={column.amount}
                      format-style="currency"
                    ></lightning-formatted-number>
                  </p>
                </header>
                <template lwc:if={column.isEmpty}>
                  <p class="slds-text-body_small slds-text-color_weak">{labels.columnEmpty}</p>
                </template>
                <ul class="slds-has-dividers_around-space">
                  <template for:each={column.cards} for:item="card">
                    <li
                      key={card.id}
                      class={card.cardClass}
                      data-id={card.id}
                      data-card
                      data-drag-id={card.dragId}
                      data-drag-label={card.donorLabel}
                      tabindex={card.tabIndex}
                      aria-describedby="ask-drag-help"
                      onpointerdown={handlePointerDown}
                      onkeydown={handleDragKey}
                    >
                      <div class="slds-grid slds-grid_vertical-align-start">
                        <template lwc:if={card.showHandle}>
                          <span
                            class="ask-card__handle slds-var-m-right_xx-small"
                            data-drag-handle
                            aria-hidden="true"
                          >
                            <lightning-icon
                              icon-name="utility:drag_and_drop"
                              size="x-small"
                            ></lightning-icon>
                          </span>
                        </template>
                        <h3
                          class="slds-col slds-text-title_bold slds-truncate"
                          title={card.donorLabel}
                        >
                          {card.donorLabel}
                        </h3>
                        <lightning-button-menu
                          data-id={card.id}
                          alternative-text={card.menuLabel}
                          icon-size="x-small"
                          menu-alignment="right"
                          onselect={handleCardMenu}
                        >
                          <template for:each={card.menuItems} for:item="item">
                            <lightning-menu-item
                              key={item.key}
                              label={item.label}
                              value={item.value}
                            ></lightning-menu-item>
                          </template>
                        </lightning-button-menu>
                      </div>
                      <template lwc:if={card.outcomeLabel}>
                        <c-barn-status-badge
                          data-id="outcome"
                          status={card.outcomeStatus}
                          label={card.outcomeLabel}
                        ></c-barn-status-badge>
                      </template>
                      <p class="slds-text-body_regular">
                        <lightning-formatted-number
                          value={card.amount}
                          format-style="currency"
                        ></lightning-formatted-number>
                      </p>
                      <template lwc:if={card.targetDate}>
                        <p class="slds-text-body_small">
                          <lightning-formatted-date-time
                            value={card.targetDate}
                            time-zone="UTC"
                          ></lightning-formatted-date-time>
                        </p>
                      </template>
                      <template lwc:if={card.nextStep}>
                        <p class="slds-text-body_small">{card.nextStep}</p>
                      </template>
                      <p class="slds-text-body_small slds-text-color_weak">{card.ownerName}</p>
                      <template lwc:if={card.daysText}>
                        <p class="slds-text-body_small slds-text-color_weak" data-id="days">
                          {card.daysText}
                        </p>
                      </template>
                    </li>
                  </template>
                </ul>
              </section>
            </template>
          </div>
        </template>

        <template lwc:if={showList}>
          <div data-id="list">
            <lightning-datatable
              key-field="id"
              data={rows}
              columns={listColumns}
              hide-checkbox-column
              onrowaction={handleRowAction}
            ></lightning-datatable>
          </div>
        </template>
      </div>
    </lightning-card>

    <template lwc:if={isClosing}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="close-ask-title"
        class="slds-modal slds-fade-in-open"
      >
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <h2 id="close-ask-title" class="slds-modal__title slds-hyphenate">{closeTitle}</h2>
          </header>
          <div class="slds-modal__content slds-var-p-around_medium" data-id="close-dialog">
            <template lwc:if={hasCloseError}>
              <c-barn-notice
                data-id="close-error"
                class="slds-var-m-bottom_small"
                variant="error"
                message={closeError}
              ></c-barn-notice>
            </template>
            <lightning-radio-group
              data-field="outcome"
              data-close-input
              name="outcome"
              label={labels.outcomeLabel}
              options={outcomeOptions}
              value={form.outcome}
              required
              onchange={handleFormChange}
            ></lightning-radio-group>

            <template lwc:if={isWon}>
              <lightning-radio-group
                class="slds-var-m-top_small"
                data-field="result"
                data-close-input
                name="result"
                label={labels.resultLabel}
                options={resultOptions}
                value={form.result}
                required
                onchange={handleFormChange}
              ></lightning-radio-group>
            </template>

            <template lwc:if={isGift}>
              <lightning-input
                data-field="amount"
                data-close-input
                type="number"
                formatter="currency"
                step="0.01"
                min="0.01"
                label={labels.fieldAmount}
                value={form.amount}
                required
                onchange={handleFormChange}
              ></lightning-input>
              <lightning-input
                data-field="giftDate"
                data-close-input
                type="date"
                label={labels.fieldGiftDate}
                value={form.giftDate}
                required
                onchange={handleFormChange}
              ></lightning-input>
              <lightning-combobox
                data-field="giftType"
                data-close-input
                label={labels.fieldGiftType}
                options={giftTypes}
                value={form.giftType}
                required
                onchange={handleFormChange}
              ></lightning-combobox>
            </template>

            <template lwc:if={isPledge}>
              <lightning-input
                data-field="amount"
                data-close-input
                type="number"
                formatter="currency"
                step="0.01"
                min="0.01"
                label={labels.fieldPledgeTotal}
                value={form.amount}
                required
                onchange={handleFormChange}
              ></lightning-input>
              <lightning-input
                data-field="giftDate"
                data-close-input
                type="date"
                label={labels.fieldFirstPayment}
                value={form.giftDate}
                required
                onchange={handleFormChange}
              ></lightning-input>
              <lightning-combobox
                data-field="frequency"
                data-close-input
                label={labels.fieldFrequency}
                options={frequencies}
                value={form.frequency}
                required
                onchange={handleFormChange}
              ></lightning-combobox>
              <lightning-input
                data-field="payments"
                data-close-input
                type="number"
                step="1"
                min="1"
                label={labels.fieldPayments}
                value={form.payments}
                required
                onchange={handleFormChange}
              ></lightning-input>
            </template>

            <template lwc:if={isLink}>
              <p class="slds-text-body_small slds-var-m-top_small">{labels.linkHelp}</p>
              <lightning-record-picker
                data-field="linkedId"
                label={labels.fieldLinkGift}
                object-api-name="Gift__c"
                filter={donorFilter}
                display-info={giftDisplayInfo}
                onchange={handleFormChange}
              ></lightning-record-picker>
              <lightning-record-picker
                data-field="linkedId"
                label={labels.fieldLinkPledge}
                object-api-name="Commitment__c"
                filter={donorFilter}
                display-info={pledgeDisplayInfo}
                onchange={handleFormChange}
              ></lightning-record-picker>
            </template>

            <lightning-input
              class="slds-var-m-top_small"
              data-field="nextAskDate"
              data-close-input
              type="date"
              label={labels.fieldNextAsk}
              field-level-help={labels.nextAskHelp}
              value={form.nextAskDate}
              onchange={handleFormChange}
            ></lightning-input>
          </div>
          <footer class="slds-modal__footer">
            <lightning-button
              data-id="close-cancel"
              label={labels.cancel}
              onclick={handleCancelClose}
            ></lightning-button>
            <lightning-button
              data-id="close-save"
              class="slds-var-m-left_x-small"
              variant="brand"
              label={labels.save}
              disabled={isSaving}
              onclick={handleSaveClose}
            ></lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </template>
</template>
